/* TRADE MASTERY — persistent game state (localStorage, versioned, safe) */
(function () {
  'use strict';
  const KEY = 'tradeMastery.save.v1';
  const START_CASH = 10000;

  function newAccount(cash = START_CASH) {
    return {
      start: cash,
      cash,
      positions: [],
      orders: [],
      equityCurve: [{ t: Date.now(), v: cash }],
      peak: cash,
      maxDD: 0,
      daily: { date: TM.U.dayKey(), start: cash },
      nextId: 1,
    };
  }

  function defaults() {
    return {
      v: 1,
      created: Date.now(),
      name: '',
      onboarded: false,
      xp: 0,
      xpLog: [],
      settings: { sound: true, hints: true, speed: 1, unlockAll: false, reduceMotion: false },
      lessons: {}, // id -> {done, at, quiz:{r,t}}
      quiz: { levels: {}, topics: {} }, // levels: lvl -> {best, last, count, passed}; topics: lessonId -> {r,w}
      scenarios: {}, // id -> {best, count}
      account: newAccount(),
      market: { seed: TM.U.seed(), ticks: 0, t0: 1767225600, events: [] },
      trades: [], // closed trades, all modes
      journal: {}, // tradeId -> entry
      plan: null,
      counters: {
        tradesWithStop: 0,
        lowRiskWins: 0,
        srFound: 0,
        fakeoutsFound: 0,
        journalCount: 0,
        scenariosDone: 0,
        daySessions: 0,
        swingCampaigns: 0,
        greenWeeks: 0,
        stormsSurvived: 0,
        liquidations: 0,
        quizCorrect: 0,
        quizAnswered: 0,
        disciplinedTrades: 0,
        swingPortfolio: 0,
        patientTargets: 0,
        coachQuestions: 0,
        perfectTests: 0,
        goodLosses: 0,
      },
      achievements: {},
      challenges: {},
      daily: { date: '', goals: [], done: {}, streak: 0, last: '' },
      day: { session: null, history: [], week: [] },
      swing: { campaign: null, history: [] },
      xpToday: { date: '', tradeXp: 0 },
      seenTips: {},
    };
  }

  function merge(base, saved) {
    // deep-merge saved data into defaults so new fields appear after updates
    if (saved == null || typeof saved !== 'object' || Array.isArray(saved)) return saved == null ? base : saved;
    const out = Array.isArray(base) ? [] : {};
    Object.keys(base).forEach((k) => (out[k] = base[k]));
    Object.keys(saved).forEach((k) => {
      if (base && typeof base[k] === 'object' && base[k] !== null && !Array.isArray(base[k]) && saved[k] && typeof saved[k] === 'object' && !Array.isArray(saved[k]))
        out[k] = merge(base[k], saved[k]);
      else out[k] = saved[k];
    });
    return out;
  }

  let storageOk = true;
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return merge(defaults(), JSON.parse(raw));
    } catch (e) {
      storageOk = false;
      console.warn('Storage unavailable; progress will not persist.', e);
    }
    return defaults();
  }

  const Store = (TM.Store = {
    s: null,
    START_CASH,
    newAccount,
    init() {
      this.s = load();
    },
    storageOk: () => storageOk,
    saveNow() {
      try {
        localStorage.setItem(KEY, JSON.stringify(this.s));
        storageOk = true;
      } catch (e) {
        storageOk = false;
      }
    },
    save: null,
    resetAccount() {
      this.s.account = newAccount();
      this.s.market = { seed: TM.U.seed(), ticks: 0, t0: 1767225600, events: [] };
      this.s.day.session = null;
      this.s.swing.campaign = null;
      this.saveNow();
    },
    resetAll() {
      try {
        localStorage.removeItem(KEY);
      } catch (e) {}
      this.s = defaults();
      this.saveNow();
    },
    exportData() {
      return JSON.stringify(this.s);
    },
    importData(str) {
      const obj = JSON.parse(str);
      if (!obj || typeof obj !== 'object' || obj.v !== 1) throw new Error('This file is not a Trade Mastery save.');
      this.s = merge(defaults(), obj);
      this.saveNow();
    },
    inc(counter, n = 1) {
      this.s.counters[counter] = (this.s.counters[counter] || 0) + n;
      this.save();
    },
  });
  Store.save = TM.U.debounce(() => Store.saveNow(), 400);
  window.addEventListener('beforeunload', () => Store.s && Store.saveNow());
  document.addEventListener('visibilitychange', () => document.hidden && Store.s && Store.saveNow());
})();

/* ---- js/core/market.js ---- */
/* TRADE MASTERY — simulated market engine: path generation, indicators, live multi-asset feed.
   All prices are SIMULATED. Nothing here reflects real market prices. */
(function () {
  'use strict';
  const U = TM.U;

  /* =========================================================
     Scripted path generator (lessons, scenarios, day & swing sims)
     segment fields:
       n      bars in segment
       to     target price to reach by end of segment (directed leg)
       range  [lo, hi]  bounded chop with rejection wicks at the edges
       d      drift per bar (fraction) if no `to`/`range`
       v      volatility per bar (fraction)       default .006
       vm     volume multiplier                    default 1
       gap    overnight gap at segment start (fraction, e.g. .05)
       wick   {dir:-1|1, size:.02} spike wick on the final bar (stop hunt)
       vol    per-bar volatility multipliers array (optional, intraday U-shape)
       vmArr  per-bar volume multipliers array (optional)
     ========================================================= */
  function generate(o) {
    const r = U.rng(o.seed || 1);
    const tpb = o.tpb || 8;
    const step = o.step || 60;
    let t = o.t0 || 1767283200;
    let p = o.start || 100;
    const out = [];
    const baseVol = o.baseVol || 100000;
    let cluster = 1;
    const skip = o.skipTime; // fn(t) -> next valid t (e.g. skip nights/weekends)
    // expand "range" segments into alternating swings that really touch the floor and ceiling
    const segs = [];
    let pp = p;
    (o.segs || []).forEach((sg) => {
      if (sg.gap) pp *= 1 + sg.gap;
      if (!sg.range) {
        segs.push(sg);
        if (sg.to != null) pp = sg.to;
        return;
      }
      const [lo, hi] = sg.range;
      const span = hi - lo;
      const base = U.clamp(Math.round(sg.n / 6), 4, 30);
      let used = 0;
      let up = pp < (lo + hi) / 2;
      let first = true;
      while (used < sg.n) {
        let len = Math.max(2, Math.round(base * (0.65 + r() * 0.7)));
        if (sg.n - used - len < 3) len = sg.n - used;
        const tgt = up ? hi - span * (0.03 + r() * 0.12) : lo + span * (0.03 + r() * 0.12);
        const leg = Object.assign({}, sg, { n: len, to: tgt, range: null, bound: [lo, hi] });
        if (!first) delete leg.gap;
        if (sg.vol) leg.vol = sg.vol.slice(used, used + len);
        if (sg.vmArr) leg.vmArr = sg.vmArr.slice(used, used + len);
        if (sg.wick && used + len < sg.n) delete leg.wick;
        segs.push(leg);
        used += len;
        up = !up;
        first = false;
        pp = tgt;
      }
    });
    segs.forEach((sg) => {
      const n = sg.n || 10;
      const v = sg.v == null ? 0.006 : sg.v;
      const totalTicks = n * tpb;
      let tickIdx = 0;
      for (let b = 0; b < n; b++) {
        if (b === 0 && sg.gap) p *= 1 + sg.gap;
        const open = p;
        let hi = p,
          lo = p,
          absRet = 0;
        const ticks = o.keepTicks ? [p] : null;
        const vb = v * (sg.vol ? sg.vol[b] || 1 : 1);
        for (let k = 0; k < tpb; k++) {
          const z = U.gauss(r);
          cluster = U.clamp(cluster * 0.92 + 0.08 * (0.55 + Math.abs(z) * 0.6), 0.6, 2.2);
          const sig = (vb / Math.sqrt(tpb)) * cluster;
          let drift = 0;
          const rem = totalTicks - tickIdx;
          if (sg.to != null) drift = Math.log(sg.to / p) / Math.max(1, rem);
          else if (sg.range) {
            const mid = (sg.range[0] + sg.range[1]) / 2;
            drift = 0.012 * Math.log(mid / p);
          } else if (sg.d) drift = sg.d / tpb;
          const ret = drift + sig * z;
          absRet += Math.abs(ret);
          p *= Math.exp(ret);
          if (sg.bound) {
            const [a, bnd] = sg.bound;
            if (p > bnd) {
              hi = Math.max(hi, p);
              p = bnd - (p - bnd) * 0.8;
            }
            if (p < a) {
              lo = Math.min(lo, p);
              p = a + (a - p) * 0.8;
            }
          }
          hi = Math.max(hi, p);
          lo = Math.min(lo, p);
          if (ticks) ticks.push(p);
          tickIdx++;
        }
        if (sg.wick && b === n - 1) {
          const wp = p * (1 + sg.wick.dir * sg.wick.size);
          if (sg.wick.dir < 0) lo = Math.min(lo, wp);
          else hi = Math.max(hi, wp);
          if (ticks) ticks.splice(Math.floor(tpb / 2), 0, wp);
        }
        const vmb = (sg.vm || 1) * (sg.vmArr ? sg.vmArr[b] || 1 : 1);
        const volume = baseVol * vmb * (0.55 + (absRet / Math.max(1e-6, v)) * 0.35) * Math.exp(U.gauss(r) * 0.25);
        const c = { t, o: open, h: hi, l: lo, c: p, v: Math.round(volume) };
        if (ticks) c.ticks = ticks;
        out.push(c);
        t += step;
        if (skip) t = skip(t);
      }
    });
    return out;
  }

  /* =========================================================
     Indicators
     ========================================================= */
  const Ind = (TM.Ind = {
    sma(vals, n) {
      const out = new Array(vals.length).fill(null);
      let s = 0;
      for (let i = 0; i < vals.length; i++) {
        s += vals[i];
        if (i >= n) s -= vals[i - n];
        if (i >= n - 1) out[i] = s / n;
      }
      return out;
    },
    ema(vals, n) {
      const out = new Array(vals.length).fill(null);
      const k = 2 / (n + 1);
      let e = null;
      for (let i = 0; i < vals.length; i++) {
        if (i < n - 1) continue;
        if (e === null) {
          let s = 0;
          for (let j = i - n + 1; j <= i; j++) s += vals[j];
          e = s / n;
        } else e = vals[i] * k + e * (1 - k);
        out[i] = e;
      }
      return out;
    },
    rsi(closes, n = 14) {
      const out = new Array(closes.length).fill(null);
      let g = 0,
        l = 0;
      for (let i = 1; i < closes.length; i++) {
        const ch = closes[i] - closes[i - 1];
        const up = Math.max(0, ch),
          dn = Math.max(0, -ch);
        if (i <= n) {
          g += up;
          l += dn;
          if (i === n) {
            g /= n;
            l /= n;
            out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
          }
        } else {
          g = (g * (n - 1) + up) / n;
          l = (l * (n - 1) + dn) / n;
          out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
        }
      }
      return out;
    },
    macd(closes, f = 12, s = 26, sig = 9) {
      const ef = Ind.ema(closes, f),
        es = Ind.ema(closes, s);
      const m = closes.map((_, i) => (ef[i] != null && es[i] != null ? ef[i] - es[i] : null));
      const firstIdx = m.findIndex((x) => x != null);
      const sigLine = new Array(closes.length).fill(null);
      if (firstIdx >= 0) {
        const sub = Ind.ema(m.slice(firstIdx), sig);
        sub.forEach((v, i) => (sigLine[i + firstIdx] = v));
      }
      const hist = m.map((v, i) => (v != null && sigLine[i] != null ? v - sigLine[i] : null));
      return { macd: m, signal: sigLine, hist };
    },
    bb(closes, n = 20, k = 2) {
      const mid = Ind.sma(closes, n);
      const up = new Array(closes.length).fill(null),
        lo = new Array(closes.length).fill(null);
      for (let i = n - 1; i < closes.length; i++) {
        let s = 0;
        for (let j = i - n + 1; j <= i; j++) s += (closes[j] - mid[i]) ** 2;
        const sd = Math.sqrt(s / n);
        up[i] = mid[i] + k * sd;
        lo[i] = mid[i] - k * sd;
      }
      return { mid, up, lo };
    },
    vwap(candles, anchorFn) {
      const out = [];
      let pv = 0,
        vv = 0,
        lastDay = null;
      candles.forEach((c, i) => {
        const day = anchorFn ? anchorFn(c, i) : Math.floor(c.t / 86400);
        if (day !== lastDay) {
          pv = 0;
          vv = 0;
          lastDay = day;

        const tp = (c.h + c.l + c.c) / 3;
        pv += tp * c.v;
        vv += c.v;
        out.push(vv ? pv / vv : c.c);
      });
      return out;
    },
    atr(candles, n = 14) {
      const out = new Array(candles.length).fill(null);
      let a = null;
      for (let i = 1; i < candles.length; i++) {
        const c = candles[i],
          p = candles[i - 1];
        const tr = Math.max(c.h - c.l, Math.abs(c.h - p.c), Math.abs(c.l - p.c));
        if (i < n) {
          a = (a || 0) + tr;
          if (i === n - 1) a = a / (n - 1);
        } else a = (a * (n - 1) + tr) / n;
        if (i >= n - 1) out[i] = a;
      }
      return out;
    },
    pivots(candles, k = 3) {
      const highs = [],
        lows = [];
      for (let i = k; i < candles.length - k; i++) {
        let isH = true,
          isL = true;
        for (let j = i - k; j <= i + k; j++) {
          if (j === i) continue;
          if (candles[j].h >= candles[i].h) isH = false;
          if (candles[j].l <= candles[i].l) isL = false;
        }
        if (isH) highs.push(i);
        if (isL) lows.push(i);

    const slope = e20[L] != null && e20prev != null ? (e20[L] - e20prev) / e20prev : 0;

      else if (last.c < e20[L] && slope < -0.0004) trend = 'down';
    }
    const look = sub.slice(-30, -1);
    const avgV = look.reduce((s, c) => s + c.v, 0) / Math.max(1, look.length);

      ema9: e9[L],
      ema20: e20[L],
      ema50: e50[L],
      rsi: rsi[L],
      atr: atr[L] || last.h - last.l || last.c * 0.005,
      trend,
      slope,
      volRatio: avgV ? last.v / avgV : 1,

        let drift = A.reg.drift / TPB;
        if (A.reg.kind === 'range') drift += 0.02 * Math.log(A.reg.anchor / A.p) / TPB;
        // gentle long-run mean reversion to keep prices in a sane band
        drift += 0.0004 * Math.log(d.start / A.p) / TPB;
        const ret = drift + sig * z;
        A.p *= Math.exp(ret);
        const c = A.cur;
        c.h = Math.max(c.h, A.p);
        c.l = Math.min(c.l, A.p);
        c.c = A.p;
        c.v += (d.baseV / TPB) * (0.4 + Math.abs(z) * 0.9) * A.reg.vm * (storm && d.type === 'crypto' ? 3 : 1);
      });
      this.tickNo++;
    },
    tick() {
      if (!this.ready) return;
      const m = TM.Store.s.market;
      this._tick(false);
      m.ticks++;
      // update tf caches' last candle
      ASSETS.forEach((d) => {
        const A = this.a[d.sym];
        Object.keys(A.tfCache).forEach((tf) => this._tfUpdateLast(A, tf));
      });
    },
    _bucket(A, bucket, sec) {
      let o = null;
      const take = (c) => {
        if (c.t >= bucket + sec) return true;
        if (c.t < bucket) return false;
        if (!o) o = { t: bucket, o: c.o, h: c.h, l: c.l, c: c.c, v: c.v };
        else {
          o.o = c.o;
          o.h = Math.max(o.h, c.h);
          o.l = Math.min(o.l, c.l);
          o.v += c.v;
        }
        return true;
      };
      if (A.cur) take(A.cur);
      for (let i = A.base.length - 1; i >= 0; i--) if (!take(A.base[i])) break;
      return o;
    },
    _tfUpdateLast(A, tf) {
      const arr = A.tfCache[tf];
      const sec = this.TF[tf] * 60;
      const bucket = Math.floor(A.cur.t / sec) * sec;
      const last = arr[arr.length - 1];
      const b = this._bucket(A, bucket, sec);
      if (last && last.t === bucket) Object.assign(last, b);
      else {
        arr.push(b);
        if (arr.length > CAP) arr.shift();
      }
    },
    series(sym, tf = '1m') {
      const A = this.a[sym];
      if (!A) return [];
      if (!A.tfCache[tf]) A.tfCache[tf] = aggregate(A.base.concat([A.cur]), this.TF[tf]).map((c) => Object.assign({}, c));
      return A.tfCache[tf];
    },
    price(sym) {
      return this.a[sym] ? this.a[sym].p : 0;
    },
    candle(sym) {
      return this.a[sym] && this.a[sym].cur;
    },
    quote(sym) {
      const A = this.a[sym];
      const d = A.d;
      const half = d.type === 'crypto' ? A.p * d.spread * 0.5 : d.spread / 2;
      return { bid: A.p - half, ask: A.p + half, last: A.p, spread: half * 2 };
    },
    change(sym, bars = 1440) {
      const A = this.a[sym];
      const arr = A.base;
      const ref = arr[Math.max(0, arr.length - bars)];
      return ref ? (A.p / ref.o - 1) * 100 : 0;
    },
    vol24(sym) {
      const A = this.a[sym];
      const arr = A.base.slice(-1440);
      return arr.reduce((s, c) => s + c.v * c.c, 0);
    },
    mcap(sym) {
      return this.price(sym) * this.def(sym).supply;
    },
    dominance() {
      const tot = ASSETS.filter((d) => d.type === 'crypto').reduce((s, d) => s + this.mcap(d.sym), 0);
      // other coins not simulated individually are ~ 24% of the market
      return (this.mcap('BTC') / (tot / 0.76)) * 100;
    },
    funding(sym) {
      // simulated funding rate: crowded longs after a rally -> positive funding
      const ch = this.change(sym, 480);
      return U.clamp(0.0001 + ch * 0.00004, -0.0008, 0.0012);
    },
    remember() {
      const m = TM.Store.s.market;
      m.last = {};
      ASSETS.forEach((d) => (m.last[d.sym] = this.a[d.sym].p));
    },
  });

  TM.Market = { generate, context, aggregate, Ind };
})();

      if (ov.vwap) C.vwap = Ind.vwap(d, this.o.vwapAnchor);
      if (this.o.panes.includes('rsi')) C.rsi = Ind.rsi(cl, this.o.rsiPeriod || 14);
      if (this.o.panes.includes('macd')) C.macd = Ind.macd(cl);
      this.calcd = C;
    }
    req() {
      if (this._dirty && this._raf) return;
      this._dirty = true;
      this._raf = requestAnimationFrame(() => {
        this._raf = null;
        this.draw();
      });
    }
    /* coordinate helpers */
    xOf(i) {
      return this.plotW - (this.end - i - 0.5) * this.barW;
    }
    idxOf(x) {
      return Math.floor(this.end - (this.plotW - x) / this.barW);
    }
    yOf(p) {
      return this.mainT + (1 - (p - this.pMin) / (this.pMax - this.pMin)) * this.mainH;
    }
    pOf(y) {
      return this.pMin + (1 - (y - this.mainT) / this.mainH) * (this.pMax - this.pMin);
    }
    dec(p) {
      return this.o.decimals != null ? this.o.decimals : U.decFor(p);
    }
    _layout() {
      const panes = this.o.panes;
      const paneH = this.H < 300 ? 56 : 78;
      this.mainT = 6;
      this.mainH = this.H - this.timeH - this.mainT - panes.length * paneH - 4;
      this.paneRects = panes.map((p, k) => ({ name: p, top: this.mainT + this.mainH + 4 + k * paneH, h: paneH }));
    }
    draw() {
      if (this.dead) return;
      this._dirty = false;
      const c = this.ctx;
      const W = this.W,
        H = this.H;
      this._layout();
      c.fillStyle = COL.bg;
      c.fillRect(0, 0, W, H);
      const n = this.count();
      const d = this.data;
      if (!n) {
        c.fillStyle = COL.axis;
        c.font = '12px Inter, sans-serif';
        c.fillText('Loading chart…', 12, 24);
        return;
      }
      const i0 = Math.max(0, Math.floor(this.end - this.plotW / this.barW) - 1);
      const i1 = Math.min(n - 1, Math.ceil(this.end));
      this.i0 = i0;
      this.i1 = i1;
      // price range
      let mn = Infinity,
        mx = -Infinity;
      for (let i = i0; i <= i1; i++) {
        mn = Math.min(mn, d[i].l);
        mx = Math.max(mx, d[i].h);
      }
      const C = this.calcd;
      ['ema9', 'ema20', 'ema50', 'sma20', 'vwap'].forEach((k) => {
        if (!C[k]) return;
        for (let i = i0; i <= i1; i++)
          if (C[k][i] != null) {
            mn = Math.min(mn, C[k][i]);
            mx = Math.max(mx, C[k][i]);
          }
      });
      if (C.bb)
        for (let i = i0; i <= i1; i++)
          if (C.bb.up[i] != null) {
            mn = Math.min(mn, C.bb.lo[i]);
            mx = Math.max(mx, C.bb.up[i]);
          }
      const span0 = mx - mn || mx * 0.01 || 1;
      this.lines.forEach((l) => {
        if (l.price == null || l.noFit) return;
        if (l.price > mn - span0 * 1.5 && l.price < mx + span0 * 1.5) {
          mn = Math.min(mn, l.price);
          mx = Math.max(mx, l.price);
        }
      });
      this.zones.forEach((z) => {
        if (z.noFit) return;
        mn = Math.min(mn, z.p1, z.p2);
        mx = Math.max(mx, z.p1, z.p2);
      });
      const pad = (mx - mn || mx * 0.01 || 1) * 0.08;
      this.pMin = mn - pad;
      this.pMax = mx + pad;
      const plotW = this.plotW;
      // grid + price axis
      const step = niceStep(this.pMax - this.pMin, Math.max(3, Math.floor(this.mainH / 55)));
      c.font = '10.5px "JetBrains Mono", ui-monospace, monospace';
      c.textAlign = 'left';
      c.textBaseline = 'middle';
      const dp = this.dec(mx);
      for (let p = Math.ceil(this.pMin / step) * step; p <= this.pMax; p += step) {
        const y = Math.round(this.yOf(p)) + 0.5;
        c.strokeStyle = COL.grid;
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(0, y);
        c.lineTo(plotW, y);
        c.stroke();
        c.fillStyle = COL.axis;
        c.fillText(U.price(p, dp), plotW + 6, y);
      }
      // watermark
      if (this.o.watermark) {
        c.save();
        c.fillStyle = 'rgba(140,150,170,.07)';
        c.font = `700 ${Math.max(18, Math.min(44, W / 14))}px Sora, Inter, sans-serif`;
        c.textAlign = 'center';
        c.fillText((this.o.symbol ? this.o.symbol + ' · ' : '') + this.o.watermark, plotW / 2, this.mainT + this.mainH / 2);
        c.restore();
      }
      c.save();
      c.beginPath();
      c.rect(0, 0, plotW, H);
      c.clip();
      // zones
      this.zones.forEach((z) => {
        const y1 = this.yOf(Math.max(z.p1, z.p2)),
          y2 = this.yOf(Math.min(z.p1, z.p2));
        const x1 = z.i1 != null ? this.xOf(z.i1) - this.barW / 2 : 0;
        const x2 = z.i2 != null ? this.xOf(z.i2) + this.barW / 2 : plotW;
        c.fillStyle = z.color || 'rgba(77,141,255,.10)';
        c.fillRect(x1, y1, x2 - x1, Math.max(2, y2 - y1));
        if (z.label) {
          c.fillStyle = z.textColor || '#9fb4d8';
          c.font = '600 10.5px Inter, sans-serif';
          c.textAlign = 'left';
          c.textBaseline = 'top';
          c.fillText(z.label, x1 + 6, y1 + 4);
        }
      });
      // highlights
      this.hl.forEach((h) => {
        if (h.i < i0 || h.i > i1) return;
        c.fillStyle = h.color || 'rgba(242,184,75,.16)';
        const x = this.xOf(h.i);
        c.fillRect(x - this.barW / 2, this.mainT, this.barW, this.mainH);
      });
      // volume
      if (this.o.volume) {
        let vmx = 0;
        for (let i = i0; i <= i1; i++) vmx = Math.max(vmx, d[i].v);
        const vh = this.mainH * 0.2;
        for (let i = i0; i <= i1; i++) {
          const k = d[i];
          const h = vmx ? (k.v / vmx) * vh : 0;
          c.fillStyle = k.c >= k.o ? COL.upVol : COL.downVol;
          const bw = Math.max(1, this.barW * 0.7);
          c.fillRect(this.xOf(i) - bw / 2, this.mainT + this.mainH - h, bw, h);
        }
      }
      // bollinger
      if (C.bb) {
        c.beginPath();
        let started = false;
        for (let i = i0; i <= i1; i++) {
          if (C.bb.up[i] == null) continue;
          const x = this.xOf(i);
          if (!started) {
            c.moveTo(x, this.yOf(C.bb.up[i]));
            started = true;
          } else c.lineTo(x, this.yOf(C.bb.up[i]));
        }
        for (let i = i1; i >= i0; i--) if (C.bb.lo[i] != null) c.lineTo(this.xOf(i), this.yOf(C.bb.lo[i]));
        c.closePath();
        c.fillStyle = COL.bbFill;
        c.fill();
        this._poly(C.bb.up, COL.bb, 1);
        this._poly(C.bb.lo, COL.bb, 1);
        this._poly(C.bb.mid, COL.bb, 1, [3, 3]);
      }
      // candles / line
      if (this.o.type === 'line') {
        c.beginPath();
        for (let i = i0; i <= i1; i++) {
          const x = this.xOf(i),
            y = this.yOf(d[i].c);
          i === i0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.strokeStyle = '#7fb0ff';
        c.lineWidth = 1.8;
        c.stroke();
      } else {
        const bw = Math.max(1, this.barW * 0.72);
        for (let i = i0; i <= i1; i++) {
          const k = d[i];
          const up = k.c >= k.o;
          const x = Math.round(this.xOf(i)) + 0.5;
          const col = k.color || (up ? COL.up : COL.down);
          c.strokeStyle = col;
          c.fillStyle = col;
          c.lineWidth = 1;
          c.beginPath();
          c.moveTo(x, this.yOf(k.h));
          c.lineTo(x, this.yOf(k.l));
          c.stroke();
          const yo = this.yOf(k.o),
            yc = this.yOf(k.c);
          const top = Math.min(yo, yc),
            bh = Math.max(1, Math.abs(yc - yo));
          c.fillRect(x - bw / 2, top, bw, bh);
        }
      }
      // overlays
      if (C.ema9) this._poly(C.ema9, COL.ema9, 1.4);
      if (C.ema20) this._poly(C.ema20, COL.ema20, 1.4);
      if (C.ema50) this._poly(C.ema50, COL.ema50, 1.5);
      if (C.sma20) this._poly(C.sma20, COL.sma20, 1.4);
      if (C.vwap) this._poly(C.vwap, COL.vwap, 1.6, [6, 3]);
      // trendline segments
      this.segs.forEach((s) => {
        let x1 = this.xOf(s.i1),
          y1 = this.yOf(s.p1),
          x2 = this.xOf(s.i2),
          y2 = this.yOf(s.p2);
        if (s.extend) {
          const k = (y2 - y1) / (x2 - x1 || 1);
          const xe = plotW;
          y2 = y2 + k * (xe - x2);
          x2 = xe;
        }
        c.strokeStyle = s.color || '#f2b84b';
        c.lineWidth = s.width || 1.6;
        c.setLineDash(s.dash || []);
        c.beginPath();
        c.moveTo(x1, y1);
        c.lineTo(x2, y2);
        c.stroke();
        c.setLineDash([]);
      });
      // markers
      this.markers.forEach((m) => {
        if (m.i < i0 || m.i > i1 || m.i >= n) return;
        const k = d[m.i];
        const x = this.xOf(m.i);
        const s = Math.max(5, Math.min(8, this.barW * 0.6));
        c.font = '600 10px Inter, sans-serif';
        c.textAlign = 'center';
        if (m.kind === 'buy' || m.kind === 'up') {
          const y = (m.price != null ? this.yOf(m.price) : this.yOf(k.l)) + 6;
          c.fillStyle = m.color || COL.up;
          c.beginPath();
          c.moveTo(x, y);
          c.lineTo(x - s, y + s * 1.4);
          c.lineTo(x + s, y + s * 1.4);
          c.closePath();
          c.fill();
          if (m.text) {
            c.textBaseline = 'top';
            c.fillText(m.text, x, y + s * 1.6);
          }
        } else if (m.kind === 'sell' || m.kind === 'down') {
          const y = (m.price != null ? this.yOf(m.price) : this.yOf(k.h)) - 6;
          c.fillStyle = m.color || COL.down;
          c.beginPath();
          c.moveTo(x, y);
          c.lineTo(x - s, y - s * 1.4);
          c.lineTo(x + s, y - s * 1.4);
          c.closePath();
          c.fill();
          if (m.text) {
            c.textBaseline = 'bottom';
            c.fillText(m.text, x, y - s * 1.6);
          }
        } else {
          const y = this.yOf(m.price != null ? m.price : k.c);
          c.fillStyle = m.color || '#f2b84b';
          c.beginPath();
          c.arc(x, y, m.r || 4.5, 0, Math.PI * 2);
          c.fill();
          if (m.ring) {
            c.strokeStyle = m.color || '#f2b84b';
            c.lineWidth = 2;
            c.beginPath();
            c.arc(x, y, (m.r || 4.5) + 5, 0, Math.PI * 2);
            c.stroke();
          }
          if (m.text) {
            c.textBaseline = 'bottom';
            c.fillText(m.text, x, y - 9);
          }
        }
      });
      // texts
      this.texts.forEach((t) => {
        if (t.i < i0 - 30 || t.i > i1 + 30) return;
        c.font = '600 11px Inter, sans-serif';
        c.textAlign = t.align || 'center';
        c.textBaseline = 'middle';
        const x = this.xOf(t.i),
          y = this.yOf(t.price);
        const w = c.measureText(t.text).width + 10;
        c.fillStyle = 'rgba(13,17,23,.82)';
        const bx = t.align === 'left' ? x : t.align === 'right' ? x - w : x - w / 2;
        c.fillRect(bx, y - 9, w, 18);
        c.fillStyle = t.color || '#e5e9f0';
        c.fillText(t.text, t.align === 'left' ? x + 5 : t.align === 'right' ? x - 5 : x, y);
      });
      c.restore();
      // horizontal lines (entry / stop / target / levels)
      this.lines.forEach((l) => {
        if (l.price == null || l.price < this.pMin || l.price > this.pMax) return;
        const y = Math.round(this.yOf(l.price)) + 0.5;
        c.strokeStyle = l.color || '#4d8dff';
        c.lineWidth = l.width || 1.2;
        c.setLineDash(l.dash || (l.draggable ? [6, 4] : []));
        c.beginPath();
        const x1 = l.i1 != null ? this.xOf(l.i1) : 0;
        c.moveTo(x1, y);
        c.lineTo(plotW, y);
        c.stroke();
        c.setLineDash([]);
        // label chip
        const txt = (l.label ? l.label + ' ' : '') + U.price(l.price, this.dec(l.price));
        c.font = '600 10.5px "JetBrains Mono", monospace';
        const tw = c.measureText(txt).width + 10;
        c.fillStyle = l.color || '#4d8dff';
        const lx = Math.max(x1 + 2, plotW - tw - 4);
        c.fillRect(lx, y - 9, tw, 18);
        c.fillStyle = '#0b0e13';
        c.textAlign = 'left';
        c.textBaseline = 'middle';
        c.fillText(txt, lx + 5, y);
        if (l.draggable) {
          c.fillStyle = l.color;
          c.fillRect(plotW - 3, y - 6, 3, 12);
        }
      });
      // last price tag
      const last = d[n - 1];
      if (last) {
        const y = this.yOf(last.c);
        const up = last.c >= last.o;
        c.setLineDash([2, 3]);
        c.strokeStyle = up ? COL.up : COL.down;
        c.beginPath();
        c.moveTo(0, y);
        c.lineTo(plotW, y);
        c.stroke();
        c.setLineDash([]);
        c.fillStyle = up ? COL.up : COL.down;
        c.fillRect(plotW, y - 9, this.axisW, 18);
        c.fillStyle = '#071009';
        c.font = '700 10.5px "JetBrains Mono", monospace';
        c.textAlign = 'left';
        c.textBaseline = 'middle';
        c.fillText(U.price(last.c, this.dec(last.c)), plotW + 5, y);
      }
      // panes
      this.paneRects.forEach((pr) => this._pane(pr, i0, i1));
      // time axis
      this._timeAxis(i0, i1);
      // crosshair + legend
      this._crosshair();
      if (this.o.legend) this._legend();
      if (this.mode === 'level') {
        c.fillStyle = 'rgba(242,184,75,.9)';
        c.font = '600 11px Inter, sans-serif';
        c.textAlign = 'right';
        c.textBaseline = 'top';
        c.fillText('Click the chart to place a level', plotW - 8, this.mainT + 22);
      }
    }
    _poly(arr, color, w, dash) {
      const c = this.ctx;
      c.strokeStyle = color;
      c.lineWidth = w;
      c.setLineDash(dash || []);
      c.beginPath();
      let s = false;
      for (let i = this.i0; i <= this.i1; i++) {
        if (arr[i] == null) {
          s = false;
          continue;
        }
        const x = this.xOf(i),
          y = this.yOf(arr[i]);
        if (!s) {
          c.moveTo(x, y);
          s = true;
        } else c.lineTo(x, y);
      }
      c.stroke();
      c.setLineDash([]);
    }
    _pane(pr, i0, i1) {
      const c = this.ctx,
        C = this.calcd;
      c.fillStyle = '#0b0f15';
      c.fillRect(0, pr.top, this.W, pr.h);
      c.strokeStyle = COL.grid;
      c.beginPath();
      c.moveTo(0, pr.top + 0.5);
      c.lineTo(this.W, pr.top + 0.5);
      c.stroke();
      c.font = '600 10px Inter, sans-serif';
      c.textAlign = 'left';
      c.textBaseline = 'top';
      if (pr.name === 'rsi' && C.rsi) {
        const Y = (v) => pr.top + 4 + (1 - v / 100) * (pr.h - 8);
        c.fillStyle = 'rgba(167,139,250,.07)';
        c.fillRect(0, Y(70), this.plotW, Y(30) - Y(70));
        [70, 30].forEach((lv) => {
          c.strokeStyle = lv === 70 ? 'rgba(240,70,90,.45)' : 'rgba(22,199,132,.45)';
          c.setLineDash([4, 3]);
          c.beginPath();
          c.moveTo(0, Y(lv));
          c.lineTo(this.plotW, Y(lv));
          c.stroke();
          c.setLineDash([]);
          c.fillStyle = COL.axis;
          c.fillText(String(lv), this.plotW + 6, Y(lv) - 6);
        });
        c.save();
        c.beginPath();
        c.rect(0, pr.top, this.plotW, pr.h);
        c.clip();
        c.strokeStyle = '#a78bfa';
        c.lineWidth = 1.4;
        c.beginPath();
        let s = false;
        for (let i = i0; i <= i1; i++) {
          if (C.rsi[i] == null) continue;
          const x = this.xOf(i),
            y = Y(C.rsi[i]);
          s ? c.lineTo(x, y) : c.moveTo(x, y);
          s = true;
        }
        c.stroke();
        c.restore();
        const lv = C.rsi[Math.min(i1, this.count() - 1)];
        c.fillStyle = '#a78bfa';
        c.fillText('RSI(14) ' + (lv != null ? lv.toFixed(1) : '–'), 6, pr.top + 4);
      }
      if (pr.name === 'macd' && C.macd) {
        const M = C.macd;
        let mx = 0;
        for (let i = i0; i <= i1; i++) {
          [M.macd[i], M.signal[i], M.hist[i]].forEach((v) => v != null && (mx = Math.max(mx, Math.abs(v))));
        }
        mx = mx || 1;
        const mid = pr.top + pr.h / 2;
        const Y = (v) => mid - (v / mx) * (pr.h / 2 - 6);
        c.save();
        c.beginPath();
        c.rect(0, pr.top, this.plotW, pr.h);
        c.clip();
        const bw = Math.max(1, this.barW * 0.6);
        for (let i = i0; i <= i1; i++) {
          const h = M.hist[i];
          if (h == null) continue;
          c.fillStyle = h >= 0 ? 'rgba(22,199,132,.55)' : 'rgba(240,70,90,.55)';
          const y = Y(h);
          c.fillRect(this.xOf(i) - bw / 2, Math.min(y, mid), bw, Math.abs(y - mid));
        }
        [
          [M.macd, '#4d8dff'],
          [M.signal, '#f2b84b'],
        ].forEach(([arr, col]) => {
          c.strokeStyle = col;
          c.lineWidth = 1.3;
          c.beginPath();
          let s = false;
          for (let i = i0; i <= i1; i++) {
            if (arr[i] == null) continue;
            s ? c.lineTo(this.xOf(i), Y(arr[i])) : c.moveTo(this.xOf(i), Y(arr[i]));
            s = true;
          }
          c.stroke();
        });
        c.restore();
        c.fillStyle = '#4d8dff';
        c.fillText('MACD(12,26,9)', 6, pr.top + 4);
        c.fillStyle = '#f2b84b';
        c.fillText('signal', 96, pr.top + 4);
      }
    }
    _timeAxis(i0, i1) {
      const c = this.ctx;
      const y = this.H - this.timeH;
      c.fillStyle = '#0b0f15';
      c.fillRect(0, y, this.W, this.timeH);
      c.fillStyle = COL.axis;
      c.font = '10px "JetBrains Mono", monospace';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      const d = this.data;
      if (d.length < 2) return;
      const interval = d[1].t - d[0].t;
      const daily = interval >= 86000 || this.o.timeMode === 'day';
      const every = Math.max(1, Math.ceil(90 / this.barW));
      for (let i = Math.ceil(i0 / every) * every; i <= i1; i += every) {
        if (!d[i]) continue;
        const x = this.xOf(i);
        if (x < 20 || x > this.plotW - 20) continue;
        c.fillText(daily ? U.md(d[i].t) : U.hm(d[i].t), x, y + this.timeH / 2);
      }
    }
    _crosshair() {
      const h = this.hover;
      if (!h || !this.o.interactive) return;
      const c = this.ctx;
      c.strokeStyle = COL.cross;
      c.setLineDash([3, 3]);
      c.lineWidth = 1;
      const i = this.idxOf(h.x);
      const x = this.xOf(i);
      c.beginPath();
      c.moveTo(x, 0);
      c.lineTo(x, this.H - this.timeH);
      c.stroke();
      if (h.y < this.mainT + this.mainH) {
        c.beginPath();
        c.moveTo(0, h.y);
        c.lineTo(this.plotW, h.y);
        c.stroke();
        c.setLineDash([]);
        const p = this.pOf(h.y);
        c.fillStyle = '#2b3546';
        c.fillRect(this.plotW, h.y - 9, this.axisW, 18);
        c.fillStyle = '#e5e9f0';
        c.font = '10.5px "JetBrains Mono", monospace';
        c.textAlign = 'left';
        c.textBaseline = 'middle';
        c.fillText(U.price(p, this.dec(p)), this.plotW + 5, h.y);
      }
      c.setLineDash([]);
      const k = this.data[i];
      if (k && i < this.count()) {
        const interval = this.data.length > 1 ? this.data[1].t - this.data[0].t : 60;
        const lbl = interval >= 86000 ? U.dow(k.t) + ' ' + U.md(k.t) : U.md(k.t) + ' ' + U.hm(k.t);
        c.font = '10px "JetBrains Mono", monospace';
        const tw = c.measureText(lbl).width + 12;
        c.fillStyle = '#2b3546';
        c.fillRect(x - tw / 2, this.H - this.timeH, tw, this.timeH);
        c.fillStyle = '#e5e9f0';
        c.textAlign = 'center';
        c.fillText(lbl, x, this.H - this.timeH / 2);
      }
    }
    _legend() {
      const c = this.ctx;
      const n = this.count();
      let i = this.hover ? this.idxOf(this.hover.x) : n - 1;
      if (i < 0 || i >= n) i = n - 1;

      c.textAlign = 'left';
      c.textBaseline = 'top';
      let x = 8;
      const y = this.mainT + 4;
      const seg = (t, col) => {
        c.fillStyle = col;
        c.fillText(t, x, y);
        x += c.measureText(t).width + 8;
      };
      if (this.o.symbol) seg(this.o.symbol, '#e5e9f0');
      const col = k.c >= k.o ? COL.up : COL.down;
      if (this.W > 380) {

        seg('H ' + U.price(k.h, dp), col);
        seg('L ' + U.price(k.l, dp), col);
      }
      seg('C ' + U.price(k.c, dp), col);
      seg(U.pct(ch), col);
      // overlay legend line 2
      x = 8;
      const y2 = y + 15;
      c.font = '600 10px Inter, sans-serif';
      const C = this.calcd;
      const ov = [
        ['ema9', 'EMA 9'],
        ['ema20', 'EMA 20'],
        ['ema50', 'EMA 50'],
        ['sma20', 'SMA 20'],
        ['vwap', 'VWAP'],
      ];
      ov.forEach(([key, name]) => {
        if (!C[key]) return;
        c.fillStyle = COL[key];
        const v = C[key][i];
        const t = name + (v != null ? ' ' + U.price(v, dp) : '');
        c.fillText(t, x, y2);
        x += c.measureText(t).width + 10;
      });
      if (C.bb) {
        c.fillStyle = COL.bb;
        c.fillText('BB(20,2)', x, y2);
      }
    }
    _bind() {
      if (!this.o.interactive) return;
      const cv = this.cv;
      let down = null,
        drag = null,
        moved = 0;
      const pos = (e) => {
        const r = cv.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      };
      const nearLine = (p) => {
        let best = null,
          bd = 9;
        this.lines.forEach((l) => {
          if (!l.draggable || l.price == null) return;
          const dd = Math.abs(this.yOf(l.price) - p.y);

          }

      };
      cv.addEventListener('pointerdown', (e) => {
        const p = pos(e);
        down = { x: p.x, y: p.y, end: this.end, t: Date.now() };
        moved = 0;
        drag = nearLine(p);
        if (drag) {
          cv.setPointerCapture(e.pointerId);
          e.preventDefault();

      });
      cv.addEventListener('pointermove', (e) => {
        const p = pos(e);

          moved = Math.max(moved, Math.abs(p.x - down.x) + Math.abs(p.y - down.y));
          if (drag) {
            const dec = this.dec(drag.price);
            drag.price = U.round(this.pOf(p.y), dec);
            this.o.onLineDrag && this.o.onLineDrag(drag.id, drag.price, false);
          } else if (e.pointerType === 'mouse' || Math.abs(p.x - down.x) > Math.abs(p.y - down.y)) {
            this.end = down.end - (p.x - down.x) / this.barW;
            this._clampEnd();
          }
        } else {
          cv.style.cursor = nearLine(p) ? 'ns-resize' : this.mode === 'level' ? 'copy' : 'crosshair';
        }
        this.req();
      });
      const up = (e) => {
        if (!down) return;
        const p = pos(e);
        if (drag) {
          this.o.onLineDrag && this.o.onLineDrag(drag.id, drag.price, true);
        } else if (moved < 6) {
          const i = this.idxOf(p.x);
          const price = this.pOf(p.y);
          if (p.y < this.mainT + this.mainH) {
            if (this.mode === 'level' && this.o.onPriceClick) this.o.onPriceClick(price);
            else if (this.o.onCandleClick && i >= 0 && i < this.count()) this.o.onCandleClick(i, this.data[i], price);
            else if (this.o.onPriceClick) this.o.onPriceClick(price);
          }
        }
        down = null;
        drag = null;
        this.req();
      };
      cv.addEventListener('pointerup', up);
      cv.addEventListener('pointercancel', () => {
        down = null;
        drag = null;
      });
      cv.addEventListener('pointerleave', () => {
        this.hover = null;
        this.req();
      });
      cv.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          const p = pos(e);
          if (e.ctrlKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)) this.zoom(e.deltaY < 0 ? 1.12 : 0.89, p.x);
          else {
            this.end += e.deltaX / this.barW;
            this._clampEnd();
            this.req();
          }
        },
        { passive: false }
      );
    }
  }
  TM.Chart = Chart;
})();

/* TRADE MASTERY — paper-trading engine (positions, orders, stops, leverage, liquidation), statistics and trade reviews.

(function () {

  const U = TM.U;

  const T = (TM.Trading = {
    pnl(pos, price) {
      const dir = pos.side === 'long' ? 1 : -1;
      return (price - pos.entry) * pos.qty * dir - (pos.fees || 0) - (pos.funding || 0);
    },
    liqPrice(side, entry, lev) {
      if (!lev || lev <= 1) return null;
      return side === 'long' ? entry * (1 - 1 / lev + MMR) : entry * (1 + 1 / lev - MMR);
    },
    riskAmount(side, entry, stop, qty) {
      if (!stop) return null;

      return per * qty;
    },
    rr(side, entry, stop, target) {
      if (!stop || !target) return null;

      const rew = side === 'long' ? target - entry : entry - target;
      if (risk <= 0) return null;
      return rew / risk;

    equity(acct, priceFn) {

      const lev = spec.lev || 1;

      const margin = notional / lev;

      if (margin + fee > acct.cash + 1e-9) errors.push(`Not enough buying power. Needs ${U.money(margin + fee)}, you have ${U.money(acct.cash)}.`);
      if (stop) {
        if (side === 'long' && stop >= entry) errors.push('For a long (buy), the stop-loss must be BELOW the entry price.');
        if (side === 'short' && stop <= entry) errors.push('For a short (sell), the stop-loss must be ABOVE the entry price.');
      }
      if (target) {
        if (side === 'long' && target <= entry) errors.push('For a long, the take-profit must be ABOVE the entry price.');
        if (side === 'short' && target >= entry) errors.push('For a short, the take-profit must be BELOW the entry price.');
      }

      const riskPct = risk != null ? (risk / equity) * 100 : null;
      const rr = T.rr(side, entry, stop, target);
      const liq = T.liqPrice(side, entry, lev);
      if (!stop) warnings.push('No stop-loss: your risk on this trade is undefined.');
      if (riskPct != null && riskPct > 2) warnings.push(`You are risking ${riskPct.toFixed(1)}% of your account. Most pros risk 0.5–2% per trade.`);
      if (rr != null && rr < 1) warnings.push(`Reward:risk is only ${rr.toFixed(2)}:1. You would need to win more than ${(100 / (1 + rr)).toFixed(0)}% of trades just to break even.`);
      if (!target) warnings.push('No take-profit target. Decide where you will exit before you enter.');

    },
    open(acct, spec) {

        side: spec.side,
        qty: spec.qty,
        entry: spec.entry,
        lev,
        margin,
        fees: fee,
        feeRate: spec.feeRate || 0,
        funding: 0,

        .filter((o) => o.sym === sym)

      const gw = wins.reduce((s, t) => s + t.pnl, 0);
      const gl = -losses.reduce((s, t) => s + t.pnl, 0);

        dd = 0;

        .slice()
        .sort((a, b) => a.closedAt - b.closedAt)

        wins: wins.length,
        losses: losses.length,
        winRate: n ? (wins.length / n) * 100 : 0,

      }
      if (t.stopMoves && t.stopMoves.some((m) => m.widened)) bad('Discipline: you moved your stop-loss FURTHER away while the trade was losing. That turns small planned losses into large unplanned ones.', 15, '4-5');

          break;
        case 'liquidation':
          bad('Exit: LIQUIDATED. The exchange closed your position and kept your margin. Leverage was too high for the volatility.', 25, 'C-3');
          break;
        case 'session-end':
          tip('Exit: the position was closed automatically at the end of the session. Day traders plan to be flat before the close.', '5-4');
          break;
        default: {
          // manual
          if (t.pnl < 0 && R != null && R < -1.15) bad(`Exit: you lost ${Math.abs(R).toFixed(1)}R — more than your planned risk. Respect the stop.`, 10, '4-5');
          else if (t.pnl < 0 && R != null && R > -0.5 && opts.followThrough && opts.followThrough.hitTarget) tip('Exit: you closed early for a small loss, but price later reached your target. Was the setup actually invalid, or did fear make the decision?', '4-5');
          else if (t.pnl < 0 && R != null && R > -0.6) tip('Exit: you cut the trade before the stop. Fine if the reason you entered disappeared — not fine if it was just nerves.', '4-5');
          if (t.pnl > 0 && R != null && t.riskPlanned && t.mfe / t.riskPlanned > 2 && R < 0.8) tip(`Exit: the trade was up ${(t.mfe / t.riskPlanned).toFixed(1)}R at its best, but you kept only ${R.toFixed(1)}R. Consider a trailing stop or taking partial profits.`, '5-4');
          else if (t.pnl > 0) good('Exit: you closed the trade in profit.', 2);
          if (opts.followThrough && t.pnl > 0 && opts.followThrough.hitTarget && R < 1) tip('After you exited, price went on to hit your target. Trust your plan once the trade is working.', '5-4');
        }
      }
      if (opts.emotional) bad('Patience: you closed a swing trade after a small move that was still inside your plan. Swing trades need room to breathe — reacting to every wiggle is emotional trading.', 8, '6-1');
      if (opts.heldEarnings) tip('You held through an earnings announcement. That is a coin flip on a gap — many swing traders reduce size or exit before earnings.', '6-4');

      score = Math.round(U.clamp(score, 0, 100));
      const grade = score >= 90 ? 'A' : score >= 78 ? 'B' : score >= 62 ? 'C' : score >= 45 ? 'D' : 'F';
      let verdict;
      if (t.pnl > 0 && score >= 70) verdict = 'Good process, good outcome. This is what repeatable trading looks like.';
      else if (t.pnl > 0) verdict = 'You made money, but the process was risky. Lucky wins teach bad habits — fix the process before it costs you.';
      else if (score >= 70) verdict = 'A good loss. You followed a sound process and the market simply did not cooperate. Over many trades, good process wins.';
      else verdict = 'Poor process and a loss. Focus on the red items below — they are the habits that blow up accounts.';
      const learn = items.find((i) => i.k === 'bad') || items.find((i) => i.k === 'tip') || items[0];
      return { score, grade, items, verdict, lessons: Array.from(lessons), takeaway: learn ? learn.s : '' };
    },
    /* HTML block for the review modal */
    html(t, rv) {
      const exitTxt = { target: 'Take-profit hit', stop: 'Stop-loss hit', 'gap-stop': 'Gapped through stop', liquidation: 'Liquidated', manual: 'Closed manually', 'session-end': 'Session close' }[t.exitReason] || t.exitReason;
      const def = TM.Live.def(t.sym);
      const name = def ? def.sym : t.sym;
      const li = rv.items.map((i) => `<li class="rv-${i.k}"><span class="rv-ic">${i.k === 'good' ? '✓' : i.k === 'bad' ? '✕' : 'i'}</span><span>${i.s}</span></li>`).join('');
      const lessonLinks = rv.lessons
        .map((id) => TM.Lessons && TM.Lessons.byId(id))
        .filter(Boolean)
        .slice(0, 3)
        .map((l) => `<a class="chip" href="#lesson-${l.id}">📘 ${l.id.replace('-', '.')} ${U.esc(l.title)}</a>`)
        .join('');
      return `<div class="review">
        <div class="rv-top">
          <div class="rv-grade g-${rv.grade}">${rv.grade}<small>process</small></div>
          <div class="rv-sum">
            <div class="rv-line"><b>${t.side === 'long' ? 'LONG' : 'SHORT'} ${U.esc(name)}</b> · ${U.num(t.qty, t.qty < 1 ? 4 : t.qty % 1 ? 3 : 0)} @ ${U.price(t.entry)} → ${U.price(t.exit)}${t.lev > 1 ? ` · ${t.lev}×` : ''}</div>
            <div class="rv-out ${U.cls(t.pnl)}">${U.smoney(t.pnl)} ${t.r != null ? `<span class="muted">(${t.r >= 0 ? '+' : ''}${t.r.toFixed(2)}R)</span>` : ''} <span class="pill">${exitTxt}</span></div>
            <div class="rv-verdict">${rv.verdict}</div>
          </div>
        </div>
        <ul class="rv-list">${li}</ul>
        ${lessonLinks ? `<div class="rv-lessons"><span class="muted">Recommended:</span> ${lessonLinks}</div>` : ''}
      </div>`;
    },
  };
})();

      return [t.length, 10];

    streak(s) {
      let best = 0,

      s.trades
        .slice()
        .sort((a, b) => a.closedAt - b.closedAt)
        .forEach((t) => {
          if (t.origStop && t.riskPct != null && t.riskPct <= 2.05) {
            cur++;
            best = Math.max(best, cur);
          } else cur = 0;
        });
      return best;

      U.sound('win');

    daily() {
      const s = S();
      const key = U.dayKey();
      if (s.daily.date !== key) {
        // streak continues only if yesterday was completed
        const y = new Date();
        y.setDate(y.getDate() - 1);
        if (s.daily.last !== U.dayKey(y) && s.daily.last !== key) s.daily.streak = 0;
        let h = 0;
        for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
        const r = U.rng(h);
        const pool = U.shuffle(['lesson', 'disc', 'journal', 'quiz', 'scenario', 'day', 'coach'], r);
        s.daily = { date: key, goals: pool.slice(0, 3), done: {}, count: {}, streak: s.daily.streak || 0, last: s.daily.last || '' };
        TM.Store.save();
      }
      return s.daily;
    },
    goal(id, n = 1) {
      const d = P.daily();
      if (!d.goals.includes(id) || d.done[id]) return;
      d.count = d.count || {};
      d.count[id] = (d.count[id] || 0) + n;
      const need = P.GOALS[id].need || 1;
      if (d.count[id] >= need) {
        d.done[id] = true;
        P.addXP(40, 'Daily goal: ' + P.GOALS[id].text);
        if (d.goals.every((g) => d.done[g])) {
          d.streak = (d.streak || 0) + 1;
          d.last = d.date;
          setTimeout(() => P.addXP(60, `All daily goals done · ${d.streak}-day streak 🔥`), 700);
        }
      }
      TM.Store.save();
      TM.bus.emit('progress');
    },

    /* ---------------- trade recording ---------------- */
    recordTrade(trade, opts = {}) {
      const s = S();
      const rv = TM.Review.analyze(trade, opts.review || {});
      trade.review = { score: rv.score, grade: rv.grade, takeaway: rv.takeaway, lessons: rv.lessons, verdict: rv.verdict };
      s.trades.push(trade);
      if (s.trades.length > 1500) s.trades.shift();
      const c = s.counters;
      if (trade.origStop) c.tradesWithStop++;
      if (trade.pnl > 0 && trade.origStop && trade.riskPct <= 1.05) c.lowRiskWins++;
      if ((trade.exitReason === 'stop' || trade.exitReason === 'gap-stop') && trade.origStop && trade.riskPct <= 2.05) c.goodLosses++;
      if (trade.exitReason === 'liquidation') c.liquidations++;
      if (rv.score >= 78) {
        c.disciplinedTrades++;
        P.goal('disc');
      }
      // discipline XP (capped per day so that more trades != more XP)
      const key = U.dayKey();
      if (s.xpToday.date !== key) s.xpToday = { date: key, tradeXp: 0, trades: 0 };
      s.xpToday.trades = (s.xpToday.trades || 0) + 1;
      const xp = rv.score >= 90 ? 30 : rv.score >= 78 ? 20 : rv.score >= 62 ? 10 : 0;
      if (xp && s.xpToday.tradeXp < 200) {
        s.xpToday.tradeXp += xp;
        setTimeout(() => P.addXP(xp, `Disciplined trade (process ${rv.grade})`), 900);
      }
      if (s.xpToday.trades === 15) {
        TM.Coach && TM.Coach.say('You have closed 15 trades today. <b>Overtrading</b> is one of the fastest ways to lose. Quality beats quantity — consider reviewing your journal instead of taking more trades.');
      }
      TM.Store.save();
      TM.bus.emit('trade:recorded', trade);
      P.checkAchievements();
      return rv;
    },
    /* review + journal modal. Returns a promise that resolves when the modal closes. */
    afterTrade(trade, opts = {}) {
      const rv = P.recordTrade(trade, opts);
      if (opts.silent) {
        U.toast(`Trade closed (${trade.exitReason === 'target' ? 'target hit' : trade.exitReason === 'liquidation' ? 'LIQUIDATED' : trade.exitReason === 'stop' || trade.exitReason === 'gap-stop' ? 'stopped out' : 'closed'}) · <b class="${U.cls(trade.pnl)}">${U.smoney(trade.pnl)}</b>`, trade.pnl >= 0 ? 'good' : 'bad', {
          ms: 5200,
          action: { label: 'Review', fn: () => P.showReview(trade) },
        });
        U.sound(trade.pnl >= 0 ? 'win' : 'loss');
        return Promise.resolve();
      }
      U.sound(trade.pnl >= 0 ? 'win' : 'loss');
      return P.showReview(trade, rv);
    },
    showReview(trade, rv) {
      rv = rv || TM.Review.analyze(trade);
      return new Promise((resolve) => {
        const body = U.el('<div></div>');
        body.innerHTML = TM.Review.html(trade, rv);
        const already = S().journal[trade.id];
        let form = null;
        if (!already && TM.JournalUI) {
          const wrap = U.el(`<details class="jr-inline" open><summary>✍️ Journal this trade <span class="muted">(+20 XP)</span></summary></details>`);
          form = TM.JournalUI.form(trade);
          wrap.appendChild(form.el);
          body.appendChild(wrap);
        }
        const actions = already
          ? [{ label: 'Close', cls: 'btn-primary' }]
          : [
              { label: 'Journal later', cls: 'btn-ghost' },
              {
                label: 'Save journal entry',
                cls: 'btn-primary',
                onClick: () => {
                  if (!form) return;
                  const ok = TM.JournalUI.save(trade, form.get());
                  if (!ok) return false;
                },
              },
            ];
        U.modal({ title: 'Trade review', body, actions, wide: true, onClose: resolve });
        body.querySelectorAll('.rv-lessons a').forEach((a) => a.addEventListener('click', () => U.closeTopModal()));
      });
    },
  });
})();

/* ---- js/core/coach.js ---- */
/* TRADE MASTERY — "Coach Nova", a rule-based AI-style trading coach.
   It explains, analyses and recommends. It never predicts prices or promises profits. */
(function () {
  'use strict';
  const U = TM.U;
  const S = () => TM.Store.s;
  let ctx = { view: 'home', hint: null, label: '' };
  let panel, log, input, dot;

  function norm(s) {
    return ' ' + String(s).toLowerCase().replace(/[^a-z0-9:%.$/ -]/g, ' ').replace(/\s+/g, ' ') + ' ';
  }

  function findTerm(q) {
    const nq = norm(q);
    let best = null,
      bestLen = 0;
    TM.Glossary.forEach((g) => {
      [g.t].concat(g.a).forEach((alias) => {
        const a = ' ' + alias.toLowerCase() + ' ';
        const a2 = ' ' + alias.toLowerCase() + 's ';
        if ((nq.includes(a) || nq.includes(a2)) && alias.length > bestLen) {
          best = g;
          bestLen = alias.length;
        }
      });
    });
    return best;
  }

  function lessonLink(id) {
    const l = TM.Lessons && TM.Lessons.byId(id);
    return l ? `<a class="chip" href="#lesson-${l.id}">📘 Lesson ${l.id.replace('-', '.')}: ${U.esc(l.title)}</a>` : '';
  }

  function weakTopics() {
    const tp = S().quiz.topics;
    return Object.keys(tp)
      .map((k) => ({ id: k, acc: tp[k].r / Math.max(1, tp[k].r + tp[k].w), n: tp[k].r + tp[k].w }))
      .filter((x) => x.n >= 1 && x.acc < 0.7)
      .sort((a, b) => a.acc - b.acc);
  }

  const Coach = (TM.Coach = {
    setContext(c) {
      ctx = Object.assign({ hint: null, label: '' }, c);
      if (panel) U.$('.coach-ctx', panel).textContent = ctx.label ? 'Context: ' + ctx.label : '';
    },
    recommend() {
      const s = S();
      const out = [];
      const weak = weakTopics();
      weak.slice(0, 2).forEach((w) => {
        const l = TM.Lessons.byId(w.id);
        if (l) out.push({ l, why: `you answered ${Math.round(w.acc * 100)}% of questions on it correctly` });
      });
      // mistakes from trade reviews
      const counts = {};
      s.trades.slice(-25).forEach((t) => (t.review && t.review.lessons ? t.review.lessons : []).forEach((id) => (counts[id] = (counts[id] || 0) + 1)));
      Object.keys(counts)
        .sort((a, b) => counts[b] - counts[a])
        .slice(0, 2)
        .forEach((id) => {
          const l = TM.Lessons.byId(id);
          if (l && !out.find((o) => o.l.id === id)) out.push({ l, why: `this came up in ${counts[id]} of your recent trade reviews` });
        });
      const next = TM.Lessons.next();
      if (next && !out.find((o) => o.l.id === next.id)) out.push({ l: next, why: 'it is the next lesson on your learning path' });
      return out.slice(0, 3);
    },
    analyzeTrades() {
      const s = S();
      const tr = s.trades.slice(-30);
      if (!tr.length) return 'You have no closed trades yet. Open <a href="#practice">Practice Trading</a>, pick an asset, set a stop-loss and a target, and take your first simulated trade. I will review every trade you close.';
      const st = TM.Trading.stats(tr);
      const noStop = tr.filter((t) => !t.origStop).length;
      const bigRisk = tr.filter((t) => t.riskPct > 2.05).length;
      const widened = tr.filter((t) => t.stopMoves && t.stopMoves.some((m) => m.widened)).length;
      const counter = tr.filter((t) => t.ctx && ((t.side === 'long' && t.ctx.trend === 'down') || (t.side === 'short' && t.ctx.trend === 'up'))).length;
      const avgScore = tr.reduce((a, t) => a + (t.review ? t.review.score : 0), 0) / tr.length;
      let h = `<b>Your last ${tr.length} trades</b><ul class="coach-ul">
        <li>Win rate <b>${st.winRate.toFixed(0)}%</b> · profit factor <b>${isFinite(st.profitFactor) ? st.profitFactor.toFixed(2) : '∞'}</b> · net <b class="${U.cls(st.total)}">${U.smoney(st.total)}</b></li>
        <li>Average win ${U.money(st.avgWin)} vs average loss ${U.money(Math.abs(st.avgLoss))}${st.avgR != null ? ` · average result ${st.avgR.toFixed(2)}R` : ''}</li>
        <li>Average process score <b>${avgScore.toFixed(0)}/100</b></li></ul>`;
      const issues = [];
      if (noStop) issues.push(`<b>${noStop}</b> trade(s) had no stop-loss when you entered. ${lessonLink('4-1')}`);
      if (bigRisk) issues.push(`<b>${bigRisk}</b> trade(s) risked more than 2% of the account. ${lessonLink('4-2')}`);
      if (widened) issues.push(`You widened your stop on <b>${widened}</b> losing trade(s). ${lessonLink('4-5')}`);
      if (counter >= 3) issues.push(`<b>${counter}</b> trades went against the trend. ${lessonLink('2-4')}`);
      if (st.avgWin && st.avgLoss && Math.abs(st.avgLoss) > st.avgWin * 1.2) issues.push(`Your average loss is bigger than your average win. Cut losers at the stop and let winners reach their targets. ${lessonLink('4-1')}`);
      if (issues.length) h += '<b>What to work on</b><ul class="coach-ul">' + issues.map((x) => `<li>${x}</li>`).join('') + '</ul>';
      else h += 'Your process looks solid. Keep journaling — consistency is what turns good habits into an edge.';
      h += '<p class="muted small">Past results in a simulator do not predict future results.</p>';
      return h;
    },
    sizeCalc(q) {
      const nums = (q.match(/[0-9]+(?:\.[0-9]+)?/g) || []).map(Number);
      const acct = /account|balance/.test(q) ? nums[0] : null;
      if (nums.length >= 4) {
        const [a, r, e, st] = nums;
        const per = Math.abs(e - st);
        if (per > 0) {
          const riskD = a * (r / 100);
          const sh = Math.floor(riskD / per);
          return `With a <b>${U.money(a, 0)}</b> account risking <b>${r}%</b> (${U.money(riskD)}), entry <b>${e}</b> and stop <b>${st}</b> (${U.money(per)} per share):<br><b>Position size = ${U.money(riskD)} ÷ ${U.money(per)} = ${sh} shares</b> (≈ ${U.money(sh * e, 0)} position).`;
        }
      }
      return `Position size formula: <b>Shares = (Account × Risk%) ÷ (Entry − Stop)</b>.<br>Example: $10,000 × 1% = $100 risk. Entry $50, stop $48 → $2 risk per share → 50 shares.<br>Ask me like this: <i>"size account 10000 risk 1 entry 50 stop 48"</i>. ${lessonLink('4-2')}`;
    },
    answer(q) {
      const nq = norm(q);
      S().counters.coachQuestions++;
      TM.Store.save();
      TM.Progress.goal('coach');
      TM.Progress.checkAchievements();
      // safety: no predictions, no promises
      if (/((will|going to|gonna) .{0,30}(go up|go down|rise|fall|drop|pump|dump|crash|moon|increase|decrease|hit|reach|be worth)| predict| forecast| price target| guarantee| sure thing| should i (buy|sell|short)| what should i (buy|sell)| which (stock|coin|crypto)| best (coin|stock|crypto)| get rich| to the moon)/.test(nq)) {
        return `I cannot predict where any price will go — nobody can do that reliably, and anyone who promises profits is selling something. What I <i>can</i> do is help you build a process:<ul class="coach-ul"><li>What is the trend on the higher timeframe?</li><li>Where is the nearest support/resistance?</li><li>Where would your idea be proven wrong (stop)?</li><li>Is the reward at least 2× the risk?</li><li>Is the position sized to risk ≤1–2%?</li></ul>If you can answer all five, you have a plan — win or lose. ${lessonLink('7-4')}`;
      }
      if (/ hint | help me | stuck | clue | what do i do /.test(nq)) {
        if (ctx.hint) return '💡 ' + (typeof ctx.hint === 'function' ? ctx.hint() : ctx.hint);
        return 'There is no active exercise right now. Open a lesson or challenge and ask me for a hint while you work on it.';
      }
      if (/ analy| review | my trades | how am i doing | my performance | my stats | mistakes /.test(nq)) return Coach.analyzeTrades();
      if (/ recommend| what next | what should i learn | next lesson | weak| struggl| improve /.test(nq)) {
        const rec = Coach.recommend();
        if (!rec.length) return 'You have completed everything on the learning path. Revisit the Knowledge Tests and keep your journal going.';
        return '<b>Recommended for you</b><ul class="coach-ul">' + rec.map((r) => `<li>${lessonLink(r.l.id)}<br><span class="muted small">because ${r.why}</span></li>`).join('') + '</ul>';
      }
      if (/ size | position siz| how many shares | calculate /.test(nq) || (/ risk /.test(nq) && /[0-9]/.test(nq) && / stop /.test(nq))) return Coach.sizeCalc(q);
      if (/ rank | xp | level up | progress /.test(nq)) {
        const r = TM.Progress.rank();
        const n = TM.Progress.nextRank();
        return `You are a <b>${r.icon} ${r.name}</b> with <b>${S().xp} XP</b>.${n ? ` ${n.xp - S().xp} XP to <b>${n.name}</b>.` : ' That is the top rank!'} XP comes from lessons, tests, scenarios, challenges and <i>disciplined</i> trades — not from profit alone.`;
      }
      if (/ real money | broker | invest real | ready for real| go live /.test(nq)) {
        return 'Before risking real money, aim for: 50+ simulated trades with a written plan, a positive expectancy, a max drawdown under 10%, and a journal that shows you follow your rules. Start tiny when you do. I am a teaching tool — this is not financial advice.';
      }
      const term = findTerm(q);
      if (term) return `<b>${term.t}</b><br>${term.d}<br>${lessonLink(term.l)}`;
      if (/ hello | hi | hey | yo /.test(nq)) return `Hi${S().name ? ' ' + U.esc(S().name) : ''}! I am Coach Nova. Ask me what a term means, ask for a <b>hint</b>, say <b>analyse my trades</b>, or <b>what should I learn next</b>.`;
      return 'I am not sure about that one. Try asking about a term (e.g. <i>"what is RSI"</i>, <i>"explain stop hunt"</i>), say <b>hint</b> during an exercise, <b>analyse my trades</b>, <b>what should I learn next</b>, or <b>position size</b>.';
    },
    push(who, html) {
      if (!log) return;
      const m = U.el(`<div class="cmsg cmsg-${who}"><div class="cbub"></div></div>`);
      m.querySelector('.cbub').innerHTML = html;
      log.appendChild(m);
      log.scrollTop = log.scrollHeight;
      m.querySelectorAll('a[href^="#"]').forEach((a) => a.addEventListener('click', () => Coach.toggle(false)));
    },
    say(html) {
      Coach.push('bot', html);
      if (!panel.classList.contains('open')) dot.hidden = false;
    },
    ask(q) {
      if (!q.trim()) return;
      Coach.push('me', U.esc(q));
      const typing = U.el('<div class="cmsg cmsg-bot"><div class="cbub typing"><i></i><i></i><i></i></div></div>');
      log.appendChild(typing);
      log.scrollTop = log.scrollHeight;
      setTimeout(() => {
        typing.remove();
        Coach.push('bot', Coach.answer(q));
      }, 380);
    },
    toggle(force) {
      const open = force == null ? !panel.classList.contains('open') : force;
      panel.classList.toggle('open', open);
      document.body.classList.toggle('coach-open', open);
      if (open) {
        dot.hidden = true;
        setTimeout(() => input.focus(), 120);
      }
    },
    init() {
      const root = document.getElementById('coach');
      root.innerHTML = `
        <button class="coach-fab" aria-label="Open trading coach"><span class="coach-av">N</span><span class="coach-fab-t">Coach</span><span class="coach-dot" hidden></span></button>
        <section class="coach-panel" aria-label="Coach Nova">
          <header><div class="coach-av">N</div><div><b>Coach Nova</b><div class="muted small">AI-style trading coach · explains, never predicts</div></div><button class="icon-btn coach-x" aria-label="Close coach">✕</button></header>
          <div class="coach-ctx small muted"></div>
          <div class="coach-log"></div>
          <div class="coach-chips">
            <button data-q="hint">💡 Hint</button><button data-q="Analyse my trades">📊 Analyse my trades</button><button data-q="What should I learn next?">🧭 What next?</button><button data-q="How do I size a position?">⚖️ Position size</button><button data-q="What is a stop-loss?">🛑 Stop-loss</button><button data-q="What is RSI?">RSI?</button>
          </div>
          <form class="coach-form"><input id="coach-input" autocomplete="off" placeholder="Ask about any trading term…" aria-label="Ask the coach"><button class="btn btn-primary btn-sm">Ask</button></form>
        </section>`;
      panel = U.$('.coach-panel', root);
      log = U.$('.coach-log', root);
      input = U.$('#coach-input', root);
      dot = U.$('.coach-dot', root);
      U.$('.coach-fab', root).onclick = () => Coach.toggle();
      U.$('.coach-x', root).onclick = () => Coach.toggle(false);
      U.$('.coach-form', root).onsubmit = (e) => {
        e.preventDefault();
        Coach.ask(input.value);
        input.value = '';
      };
      U.on(root, 'click', '.coach-chips button', (e, b) => Coach.ask(b.dataset.q));
      Coach.push('bot', `Hi${S().name ? ' ' + U.esc(S().name) : ''}! I am <b>Coach Nova</b>. I explain terms, review your simulated trades, give hints during exercises and suggest lessons. I will never predict prices or promise profits — I teach process.`);
    },
  });
})();
