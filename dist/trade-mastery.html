/* TRADE MASTERY — interactive lesson widgets & exercises.
   Each widget: TM.W[kind](host, cfg, done) -> optional {destroy}. done({ok, score}) signals completion. */
(function () {
  'use strict';
  const U = TM.U;
  const W = (TM.W = {});
  const data = (spec) => TM.Recipes.build(spec);

  function chartIn(host, cfg, extra = {}) {
    const box = U.el('<div class="w-chart"></div>');
    host.appendChild(box);
    box._cfg = cfg;
    const ch = new TM.Chart(
      box,
      Object.assign(
        {
          height: cfg.height || (window.innerWidth < 600 ? 260 : 320),
          overlays: cfg.overlays || {},
          panes: cfg.panes || [],
          volume: cfg.volume !== false,
          fitBars: cfg.fitBars,
          symbol: cfg.symbol || '',
          watermark: 'SIMULATED',
          rightPad: cfg.rightPad == null ? 3 : cfg.rightPad,
        },
        extra
      )
    );
    let d = cfg.candles || data(cfg.data);
    if (cfg.slice) d = d.slice(cfg.slice[0], cfg.slice[1]);
    ch.setData(d, { fit: true, fitBars: cfg.fitBars || d.length + 4 });
    if (cfg.lines) ch.setLines(cfg.lines);
    if (cfg.zones) ch.setZones(cfg.zones);
    if (cfg.segsDraw) ch.setSegments(cfg.segsDraw);
    if (cfg.marks) ch.setMarkers(cfg.marks);
    if (cfg.texts) ch.setTexts(cfg.texts);
    box._chart = ch;
    return { ch, d, box };
  }
  W.chartIn = chartIn;

  function fb(host) {
    const el = U.el('<div class="w-fb" aria-live="polite"></div>');
    host.appendChild(el);
    return {
      el,
      set(kind, html) {
        el.className = 'w-fb show fb-' + kind;
        el.innerHTML = html;
      },
      clear() {
        el.className = 'w-fb';
        el.innerHTML = '';
      },
    };
  }
  W.fb = fb;

  function hintFor(cfg) {
    TM.Coach.setContext({ view: 'lesson', hint: cfg.hint || 'Read the prompt carefully and look at the chart from left to right. What did price do the last few times it reached this area?', label: 'Lesson exercise' });
  }

  /* ---------------- static visual (html) ---------------- */
  W.html = function (host, cfg) {
    host.insertAdjacentHTML('beforeend', `<div class="w-html">${cfg.html}</div>`);
  };

  /* ---------------- chart view with optional toggles ---------------- */
  W.chart = function (host, cfg) {
    const bar = U.el('<div class="w-toggles"></div>');
    host.appendChild(bar);
    let base = cfg.candles || data(cfg.data);
    if (cfg.slice) base = base.slice(cfg.slice[0], cfg.slice[1]);
    let C = chartIn(host, Object.assign({}, cfg, { candles: base, slice: null }));
    const ov = Object.assign({}, cfg.overlays || {});
    const panes = (cfg.panes || []).slice();
    (cfg.toggles || []).forEach((k) => {
      const names = { ema9: 'EMA 9', ema20: 'EMA 20', ema50: 'EMA 50', sma20: 'SMA 20', bb: 'Bollinger', vwap: 'VWAP', rsi: 'RSI', macd: 'MACD', volume: 'Volume' };
      const on = k === 'rsi' || k === 'macd' ? panes.includes(k) : k === 'volume' ? cfg.volume !== false : !!ov[k];
      const b = U.el(`<button class="tg ${on ? 'on' : ''}" data-k="${k}">${names[k] || k}</button>`);
      b.onclick = () => {
        b.classList.toggle('on');
        const isOn = b.classList.contains('on');
        if (k === 'rsi' || k === 'macd') {
          const i = panes.indexOf(k);
          if (isOn && i < 0) panes.push(k);
          if (!isOn && i >= 0) panes.splice(i, 1);
          C.ch.setPanes(panes.slice());
        } else if (k === 'volume') {
          C.ch.o.volume = isOn;
          C.ch.req();
        } else {
          ov[k] = isOn;
          C.ch.setOverlays({ [k]: isOn });
        }
      };
      bar.appendChild(b);
    });
    if (cfg.tfs) {
      const seg = U.el('<div class="seg seg-sm"></div>');
      cfg.tfs.forEach((tf, i) => {
        const b = U.el(`<button class="${i === 0 ? 'on' : ''}">${tf.label}</button>`);
        b.onclick = () => {
          U.$$('button', seg).forEach((x) => x.classList.remove('on'));
          b.classList.add('on');
          const agg = TM.Market.aggregate(base, tf.mins);
          const view = tf.last ? agg.slice(-tf.last) : agg;
          C.ch.setData(view, { fit: true, fitBars: view.length + 3 });
          if (cfg.onTf) cfg.onTf(tf);
        };
        seg.appendChild(b);
      });
      bar.prepend(seg);
      const tf0 = cfg.tfs[0];
      const agg0 = TM.Market.aggregate(base, tf0.mins);
      const v0 = tf0.last ? agg0.slice(-tf0.last) : agg0;
      C.ch.setData(v0, { fit: true, fitBars: v0.length + 3 });
    }
    if (!bar.children.length) bar.remove();
    if (cfg.caption) host.insertAdjacentHTML('beforeend', `<p class="w-cap">${cfg.caption}</p>`);
    if (cfg.clickInfo) {
      const info = U.el('<div class="w-info muted">Tap any candle to inspect it.</div>');
      host.appendChild(info);
      C.ch.o.onCandleClick = (i, k) => {
        const up = k.c >= k.o;
        const body = Math.abs(k.c - k.o),
          rng = k.h - k.l || 1e-9;
        const uw = k.h - Math.max(k.o, k.c),
          lw = Math.min(k.o, k.c) - k.l;
        let story = up ? 'Buyers won this period: it closed higher than it opened.' : 'Sellers won this period: it closed lower than it opened.';
        if (body / rng < 0.25) story = 'Small body, long wicks: buyers and sellers fought to a draw (indecision).';
        else if (uw / rng > 0.45) story += ' The long upper wick shows buyers pushed up but sellers rejected the high.';
        else if (lw / rng > 0.45) story += ' The long lower wick shows sellers pushed down but buyers bought the dip.';
        else if (body / rng > 0.75) story += ' A big body with small wicks means one side was firmly in control.';
        const avgV = C.d.slice(Math.max(0, i - 20), i).reduce((s, x) => s + x.v, 0) / Math.max(1, Math.min(20, i));
        const vr = avgV ? k.v / avgV : 1;
        info.innerHTML = `<b class="${up ? 'up' : 'down'}">${up ? 'Green' : 'Red'} candle</b> · O ${U.price(k.o)} · H ${U.price(k.h)} · L ${U.price(k.l)} · C ${U.price(k.c)} · Vol ${vr.toFixed(1)}× avg<br>${story}${vr > 1.8 ? ' <b>Volume was unusually high</b> — this move had conviction.' : ''}`;
        C.ch.setHighlights([{ i, color: 'rgba(77,141,255,.18)' }]);
        cfg.onInspect && cfg.onInspect(i);
      };
    }
    return { destroy: () => C.ch.destroy(), chart: C.ch };
  };

  /* ---------------- sort items into buckets ---------------- */
  W.sort = function (host, cfg, done) {
    hintFor(cfg);
    host.insertAdjacentHTML('beforeend', `<p class="w-prompt">${cfg.prompt}</p>`);
    const list = U.el('<div class="w-sort"></div>');
    host.appendChild(list);
    let left = cfg.items.length;
    U.shuffle(cfg.items).forEach((it) => {
      const row = U.el(`<div class="sort-row"><div class="sort-item">${it.t}</div><div class="sort-btns">${cfg.buckets.map((b, i) => `<button class="btn btn-sm btn-ghost" data-b="${i}">${b}</button>`).join('')}</div><div class="sort-why"></div></div>`);
      U.on(row, 'click', 'button', (e, b) => {
        if (row.classList.contains('ok')) return;
        const ok = Number(b.dataset.b) === it.b;
        const why = row.querySelector('.sort-why');
        why.innerHTML = (ok ? '✓ ' : '✕ ') + (it.why || '');
        if (ok) {
          row.classList.add('ok');
          b.classList.add('btn-ok');
          U.$$('button', row).forEach((x) => (x.disabled = true));
          left--;
          U.sound('click');
          if (!left) done({ ok: true });
        } else {
          row.classList.remove('shake');
          void row.offsetWidth;
          row.classList.add('shake', 'wrong');
          U.sound('error');
        }
      });
      list.appendChild(row);
    });
  };

  /* ---------------- supply & demand simulator ---------------- */
  W.supply = function (host, cfg, done) {
    hintFor(Object.assign({ hint: 'Price rises when buyers are more eager than sellers. Push the Buyers slider well above Sellers and wait a few seconds.' }, cfg));
    host.insertAdjacentHTML(
      'beforeend',
      `<p class="w-prompt">${cfg.prompt}</p>
      <div class="sd">
        <div class="sd-ctrl">
          <label>Eager buyers <b class="up" id="sd-bv">50</b><input type="range" id="sd-b" min="0" max="100" value="50"></label>
          <label>Eager sellers <b class="down" id="sd-sv">50</b><input type="range" id="sd-s" min="0" max="100" value="50"></label>
          <div class="sd-book"><div class="sd-bar up-bg" id="sd-bb"></div><div class="sd-bar down-bg" id="sd-sb"></div></div>
          <div class="sd-msg muted" id="sd-msg">Balanced: price drifts sideways.</div>
        </div>
        <div class="sd-view"><div class="sd-price mono">$<span id="sd-p">100.00</span> <small id="sd-ch">0.00%</small></div><canvas id="sd-cv"></canvas></div>
      </div>`
    );
    const f = fb(host);
    const $ = (id) => host.querySelector('#' + id);
    let p = 100;
    const hist = [100];
    let finished = false;
    const r = U.rng(7);
    const iv = setInterval(() => {
      const b = +$('sd-b').value,
        s = +$('sd-s').value;
      $('sd-bv').textContent = b;
      $('sd-sv').textContent = s;
      $('sd-bb').style.width = b / 2 + '%';
      $('sd-sb').style.width = s / 2 + '%';
      const imb = (b - s) / 100;
      p *= 1 + imb * 0.004 + U.gauss(r) * 0.0012;
      hist.push(p);
      if (hist.length > 90) hist.shift();
      $('sd-p').textContent = p.toFixed(2);
      const ch = (p / 100 - 1) * 100;
      $('sd-ch').textContent = U.pct(ch);
      $('sd-ch').className = U.cls(ch);
      $('sd-msg').textContent =
        imb > 0.15 ? 'More buyers than sellers → buyers compete and pay up → price RISES.' : imb < -0.15 ? 'More sellers than buyers → sellers compete and accept less → price FALLS.' : 'Roughly balanced → price drifts sideways.';
      U.lineChart($('sd-cv'), hist, { baseline: 100 });
      if (!finished) {
        const goalUp = cfg.goal !== 'down';
        if ((goalUp && ch >= cfg.target) || (!goalUp && ch <= -cfg.target)) {
          finished = true;
          f.set('ok', `✓ ${cfg.explain || 'Exactly. Price is simply the result of buyers and sellers competing.'}`);
          done({ ok: true });
        }
      }
    }, 160);
    return { destroy: () => clearInterval(iv) };
  };

  /* ---------------- order book / order types ---------------- */
  W.orderbook = function (host, cfg, done) {
    hintFor(Object.assign({ hint: 'A MARKET order fills instantly at the ask (when buying). A LIMIT order waits until price comes to YOUR price. For "at $X or better" tasks, use Limit.' }, cfg));
    host.insertAdjacentHTML(
      'beforeend',
      `<div class="ob">
        <div class="ob-book"><div class="ob-h"><span>Bid size</span><span>Price</span><span>Ask size</span></div><div class="ob-rows"></div><div class="ob-spread muted small"></div></div>
        <div class="ob-ticket">
          <div class="ob-task"></div>
          <div class="seg" id="ob-side"><button class="on" data-v="buy">Buy</button><button data-v="sell">Sell</button></div>
          <div class="seg" id="ob-type"><button class="on" data-v="market">Market</button><button data-v="limit">Limit</button></div>
          <label class="fld" id="ob-lim" hidden>Limit price<input type="number" step="0.01" id="ob-lp" value="99.80"></label>
          <label class="fld">Shares<input type="number" id="ob-q" value="10" min="1"></label>
          <button class="btn btn-primary" id="ob-go">Place order</button>
          <div class="ob-orders small"></div>
          <div class="ob-pos small muted">Position: 0 shares</div>
        </div>
      </div>`
    );
    const f = fb(host);
    const $ = (s) => host.querySelector(s);
    const tasks = cfg.tasks || [
      { k: 'mb', t: 'Task 1/3 — Buy 10 shares <b>immediately</b>.' },
      { k: 'lb', t: 'Task 2/3 — Buy 10 more shares, but pay <b>$99.80 or less</b>. Price is above that right now.' },
      { k: 'ls', t: 'Task 3/3 — Sell all 20 shares for <b>$100.30 or more</b>.' },
    ];
    let ti = 0,
      mid = 100.0,
      pos = 0,
      orders = [],
      side = 'buy',
      type = 'market';
    const r = U.rng(3);
    const showTask = () => ($('.ob-task').innerHTML = ti < tasks.length ? tasks[ti].t : '✓ All tasks complete.');
    showTask();
    const seg = (id, set) =>
      U.on($(id), 'click', 'button', (e, b) => {
        U.$$('button', $(id)).forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        set(b.dataset.v);
      });
    seg('#ob-side', (v) => (side = v));
    seg('#ob-type', (v) => {
      type = v;
      $('#ob-lim').hidden = v !== 'limit';
    });
    const render = () => {
      const bid = mid - 0.05,
        ask = mid + 0.05;
      let h = '';
      for (let i = 4; i >= 0; i--) h += `<div class="ob-row ask"><span></span><span>${(ask + i * 0.05).toFixed(2)}</span><span>${(200 + ((i * 137) % 400)).toFixed(0)}</span></div>`;
      for (let i = 0; i < 5; i++) h += `<div class="ob-row bid"><span>${(180 + ((i * 211) % 420)).toFixed(0)}</span><span>${(bid - i * 0.05).toFixed(2)}</span><span></span></div>`;
      $('.ob-rows').innerHTML = h;
      $('.ob-spread').innerHTML = `Best bid <b class="up">${bid.toFixed(2)}</b> · Best ask <b class="down">${ask.toFixed(2)}</b> · Spread <b>$0.10</b>`;
      $('.ob-orders').innerHTML = orders.map((o) => `<div class="pill">Working: LIMIT ${o.side.toUpperCase()} ${o.q} @ ${o.p.toFixed(2)}</div>`).join('');
      $('.ob-pos').textContent = `Position: ${pos} shares`;
    };
    render();
    const complete = (msg) => {
      f.set('ok', '✓ ' + msg);
      ti++;
      showTask();
      if (ti >= tasks.length) done({ ok: true });
    };
    $('#ob-go').onclick = () => {
      const q = Math.max(1, Math.floor(+$('#ob-q').value || 0));
      const bid = mid - 0.05,
        ask = mid + 0.05;
      const task = tasks[ti] && tasks[ti].k;
      if (type === 'market') {
        if (side === 'buy') {
          pos += q;
          U.sound('fill');
          if (task === 'mb') complete(`Filled instantly at the ask: <b>$${ask.toFixed(2)}</b>. Market orders are fast, but you pay the ask — the $0.10 spread is a small hidden cost.`);
          else if (task === 'lb') f.set('bad', `That filled at the ask ($${ask.toFixed(2)}) — more than $99.80. To control your price, use a <b>Limit</b> order.`);
          else f.set('info', `Bought ${q} at $${ask.toFixed(2)}.`);
        } else {
          if (pos < q) return f.set('bad', 'You cannot sell more shares than you own (in this exercise).');
          pos -= q;
          U.sound('fill');
          if (task === 'ls') f.set('bad', `Sold at the bid ($${bid.toFixed(2)}) — below your $100.30 goal. Use a <b>Limit</b> sell at 100.30.`);
          else f.set('info', `Sold ${q} at the bid $${bid.toFixed(2)}.`);
        }
      } else {
        const lp = +$('#ob-lp').value;
        if (!(lp > 0)) return f.set('bad', 'Enter a limit price.');
        if (side === 'sell' && pos < q) return f.set('bad', 'You do not own enough shares to sell.');
        if (side === 'buy' && lp >= ask) {
          pos += q;
          f.set('info', `Your limit ($${lp.toFixed(2)}) was above the ask, so it filled immediately at $${ask.toFixed(2)}.`);
          if (task === 'mb') complete('Filled immediately because your limit was above the ask.');
          return render();
        }
        orders.push({ side, p: lp, q });
        f.set('info', `Limit ${side} placed at $${lp.toFixed(2)}. It is <b>working</b>: it will only fill if price reaches your level. Watch the book…`);
      }
      render();
    };
    const iv = setInterval(() => {
      const task = tasks[ti] && tasks[ti].k;
      // a working order "attracts" price so the exercise never stalls; otherwise drift back toward $100
      let pull = (100 - mid) * 0.04;
      if (orders.length) {
        const o0 = orders[0];
        const fillAt = o0.side === 'buy' ? o0.p - 0.08 : o0.p + 0.08; // where the opposite side of the book reaches the order
        pull = Math.sign(fillAt - mid) * Math.min(0.035, Math.abs(fillAt - mid));
      }
      mid = Math.max(95, mid + pull + U.gauss(r) * 0.02);
      mid = Math.round(mid * 100) / 100;
      const bid = mid - 0.05,
        ask = mid + 0.05;
      orders.slice().forEach((o) => {
        const hit = o.side === 'buy' ? ask <= o.p : bid >= o.p;
        if (!hit) return;
        orders.splice(orders.indexOf(o), 1);
        pos += o.side === 'buy' ? o.q : -o.q;
        U.sound('fill');
        if (o.side === 'buy' && task === 'lb' && o.p <= 99.8 + 1e-9) complete(`Your limit buy filled at <b>$${o.p.toFixed(2)}</b>. You waited for the price to come to you — but limit orders are never guaranteed to fill.`);
        else if (o.side === 'sell' && task === 'ls' && o.p >= 100.3 - 1e-9 && pos <= 0) complete(`Sold at <b>$${o.p.toFixed(2)}</b>. Limit sells let you name your exit price.`);
        else if (o.side === 'sell' && task === 'ls' && pos > 0) f.set('info', `Partial: sold ${o.q} at $${o.p.toFixed(2)}. Sell the rest at $100.30+.`);
        else f.set('info', `Limit ${o.side} filled at $${o.p.toFixed(2)}.`);
      });
      render();
    }, 450);
    return { destroy: () => clearInterval(iv) };
  };

  W.candle = function (host, cfg, done) {
    hintFor(Object.assign({ hint: 'Green = close above open. The wick is the distance from the body to the high or low. Drag Low far below the body for a long lower wick.' }, cfg));
    host.insertAdjacentHTML(
      'beforeend',
      `<p class="w-prompt">${cfg.prompt}</p>

        h = +$('cb-High').value,
        l = +$('cb-Low').value,
        c = +$('cb-Close').value;
      h = Math.max(h, o, c);

    };
    const draw = () => {

      const Y = (p) => 240 - ((p - 88) / 24) * 220;
      const up = k.c >= k.o;
      const col = up ? '#16c784' : '#f0465a';
      const top = Y(Math.max(k.o, k.c)),
        bot = Y(Math.min(k.o, k.c));
      host.querySelector('.cb-svg').innerHTML = `
        <line x1="80" x2="80" y1="${Y(k.h)}" y2="${Y(k.l)}" stroke="${col}" stroke-width="3"/>
        <rect x="55" y="${top}" width="50" height="${Math.max(2, bot - top)}" fill="${col}" rx="2"/>
        ${[
          ['High', k.h],
          ['Low', k.l],
          ['Open', k.o],
          ['Close', k.c],
        ]
          .map(([n, p]) => `<text x="125" y="${Y(p) + 4}" fill="#aab4c3" font-size="12" font-family="JetBrains Mono, monospace">${n} ${p.toFixed(1)}</text><line x1="108" x2="120" y1="${Y(p)}" y2="${Y(p)}" stroke="#3a4456"/>`)
          .join('')}`;

      const res = cfg.check(get());

        f.set('ok', '✓ ' + (cfg.explain || 'That is the candle.'));

      } else f.set('bad', res);

  /* ---------------- click the right candle ---------------- */
  W.clickCandle = function (host, cfg, done) {
    hintFor(cfg);
    host.insertAdjacentHTML('beforeend', `<p class="w-prompt">${cfg.prompt}</p>`);
    let tries = 0,
      solved = false;
    const C = chartIn(host, cfg);
    const f = fb(host);
    const targets = cfg.target(C.d, TM.Ind);
    const tol = cfg.tol == null ? 1 : cfg.tol;
    C.ch.o.onCandleClick = (i) => {
      if (solved) return;
      const hit = targets.some((t) => Math.abs(t - i) <= tol);
      if (hit) {
        solved = true;
        C.ch.setMarkers([{ i, kind: 'dot', ring: true, color: '#16c784' }]);
        C.ch.setHighlights([{ i, color: 'rgba(22,199,132,.18)' }]);
        f.set('ok', '✓ ' + cfg.explain);
        U.sound('click');
        done({ ok: true, firstTry: tries === 0 });
      } else {
        tries++;
        C.ch.setMarkers([{ i, kind: 'dot', color: '#f0465a' }]);
        U.sound('error');
        const why = cfg.wrong ? cfg.wrong(i, C.d, targets) : '';
        if (tries >= 3) {
          solved = true;
          C.ch.setHighlights(targets.map((t) => ({ i: t, color: 'rgba(242,184,75,.25)' })));
          C.ch.setMarkers(targets.map((t) => ({ i: t, kind: 'dot', ring: true, color: '#f2b84b' })));
          f.set('info', `Here it is (highlighted). ${cfg.explain}`);
          done({ ok: true, revealed: true });
        } else f.set('bad', `Not that one. ${why || ''} ${tries === 2 && cfg.hint ? '<br>💡 ' + cfg.hint : ''}`);
      }
    };
    return { destroy: () => C.ch.destroy() };
  };

  /* ---------------- draw a support / resistance level ---------------- */
  W.level = function (host, cfg, done) {
    hintFor(Object.assign({ hint: 'Find the price where the chart turned around two or three times. Click at that height anywhere on the chart.' }, cfg));
    host.insertAdjacentHTML('beforeend', `<p class="w-prompt">${cfg.prompt}</p>`);
    const C = chartIn(host, cfg);
    C.ch.mode = 'level';
    const f = fb(host);
    const levels = cfg.levels(C.d);
    let tries = 0,
      solved = false;
    const found = new Set();
    const need = cfg.need || 1;
    const drawn = [];
    C.ch.o.onPriceClick = (p) => {
      if (solved) return;
      const hitIdx = levels.findIndex((L) => Math.abs(p - L.price) <= L.tol);
      if (hitIdx >= 0 && !found.has(hitIdx)) {
        found.add(hitIdx);
        const L = levels[hitIdx];
        drawn.push({ price: L.price, color: L.color || '#f2b84b', label: L.label || 'Level', width: 2 });
        C.ch.setLines(drawn.slice());
        U.sound('click');
        if (found.size >= need) {
          solved = true;
          C.ch.mode = 'normal';
          f.set('ok', '✓ ' + cfg.explain);
          done({ ok: true, firstTry: tries === 0 });
        } else f.set('ok', `✓ Found one (${found.size}/${need}). Find the other level.`);
      } else {
        tries++;
        C.ch.setLines(drawn.concat([{ price: p, color: '#f0465a', label: '✕', dash: [3, 3] }]));
        U.sound('error');
        if (tries >= 4) {
          solved = true;
          C.ch.mode = 'normal';
          C.ch.setLines(levels.map((L) => ({ price: L.price, color: '#f2b84b', label: L.label || 'Level', width: 2 })));
          f.set('info', 'Here are the levels. ' + cfg.explain);
          done({ ok: true, revealed: true });
        } else {
          const near = levels[0];
          const dir = p > near.price ? 'too high' : 'too low';
          f.set('bad', `Not quite — that is ${levels.length === 1 ? dir : 'not a level price respected multiple times'}. Look for where price turned around more than once.`);
        }
      }
    };
    return { destroy: () => C.ch.destroy() };
  };

  /* ---------------- place stop & target ---------------- */
  W.stops = function (host, cfg, done) {
    hintFor(Object.assign({ hint: 'Put the stop just beyond the level that proves you wrong (below support for a long). Then put the target at least 2× that distance above entry.' }, cfg));
    host.insertAdjacentHTML('beforeend', `<p class="w-prompt">${cfg.prompt}</p>`);
    const C = chartIn(host, Object.assign({ rightPad: 10 }, cfg));
    const d = C.d;
    const entry = cfg.entry ? cfg.entry(d) : d[d.length - 1].c;
    const side = cfg.side || 'long';
    let stop = U.round(side === 'long' ? entry * 0.99 : entry * 1.01, 2),
      target = U.round(side === 'long' ? entry * 1.01 : entry * 0.99, 2);
    host.insertAdjacentHTML(
      'beforeend',
      `<div class="st-row"><label class="fld">Entry<input type="number" value="${entry.toFixed(2)}" disabled></label>
      <label class="fld">Stop-loss<input type="number" step="0.01" id="st-s" value="${stop}"></label>
      <label class="fld">Take-profit<input type="number" step="0.01" id="st-t" value="${target}"></label>
      <div class="st-rr"><span class="muted small">Reward:Risk</span><b id="st-rr">1.0 : 1</b></div>
      <button class="btn btn-primary" id="st-go">Check plan</button></div><p class="muted small">Tip: drag the dashed red/green lines on the chart, or type prices.</p>`
    );
    const f = fb(host);
    const $ = (id) => host.querySelector('#' + id);
    const sync = () => {
      C.ch.setLines([
        { id: 'e', price: entry, color: '#4d8dff', label: 'Entry' },
        { id: 's', price: stop, color: '#f0465a', label: 'Stop', draggable: true },
        { id: 't', price: target, color: '#16c784', label: 'Target', draggable: true },
      ]);
      const rr = TM.Trading.rr(side, entry, stop, target);
      $('st-rr').textContent = rr == null ? '—' : rr.toFixed(2) + ' : 1';
      $('st-rr').className = rr >= 2 ? 'up' : rr >= 1 ? '' : 'down';
    };
    C.ch.o.onLineDrag = (id, p) => {
      if (id === 's') {
        stop = p;
        $('st-s').value = p.toFixed(2);
      }
      if (id === 't') {
        target = p;
        $('st-t').value = p.toFixed(2);
      }
      sync();
    };
    $('st-s').oninput = () => {
      stop = +$('st-s').value;
      sync();
    };
    $('st-t').oninput = () => {
      target = +$('st-t').value;
      sync();
    };
    sync();
    $('st-go').onclick = () => {
      const res = cfg.check({ entry, stop, target, d, rr: TM.Trading.rr(side, entry, stop, target) });
      if (res === true) {
        f.set('ok', '✓ ' + cfg.explain);
        done({ ok: true });
      } else f.set('bad', res);
    };
    return { destroy: () => C.ch.destroy() };
  };

  /* ---------------- diversification allocator ---------------- */
  W.allocate = function (host, cfg, done) {
    hintFor(Object.assign({ hint: 'Keep any single position at or below the limit and spread across sectors that do not move together.' }, cfg));
    host.insertAdjacentHTML('beforeend', `<p class="w-prompt">${cfg.prompt}</p>`);
    const wrap = U.el('<div class="al"><div class="al-sliders"></div><div class="al-side"><div class="al-pie"></div><div class="al-stress small"></div><button class="btn btn-primary" id="al-go">Check portfolio</button></div></div>');
    host.appendChild(wrap);
    const f = fb(host);
    const cols = ['#4d8dff', '#16c784', '#f2b84b', '#a78bfa', '#38c6d9', '#ff8fd0'];
    const vals = cfg.assets.map((a) => a.init || 0);
    const sl = wrap.querySelector('.al-sliders');
    cfg.assets.forEach((a, i) => {
      const row = U.el(`<label class="al-row"><span class="al-sw" style="background:${cols[i]}"></span><span class="al-n"><b>${a.sym}</b> <span class="muted small">${a.sector}</span></span><input type="range" min="0" max="100" step="5" value="${vals[i]}"><b class="mono al-v">${vals[i]}%</b></label>`);
      row.querySelector('input').oninput = (e) => {
        vals[i] = +e.target.value;
        draw();
      };
      sl.appendChild(row);
    });
    const draw = () => {
      const tot = vals.reduce((a, b) => a + b, 0) || 1;
      let acc = 0;
      const stops = vals
        .map((v, i) => {
          const s = (acc / tot) * 360;
          acc += v;
          return `${cols[i]} ${s}deg ${(acc / tot) * 360}deg`;
        })
        .join(',');
      wrap.querySelector('.al-pie').style.background = `conic-gradient(${stops})`;
      U.$$('.al-v', sl).forEach((el, i) => (el.textContent = Math.round((vals[i] / tot) * 100) + '%'));
      // stress test: worst single-sector crash
      const crash = cfg.assets.map((a, i) => ((vals[i] / tot) * a.crash) / 100);
      const worst = Math.max(...crash);
      const wi = crash.indexOf(worst);
      wrap.querySelector('.al-stress').innerHTML = `<b>Stress test:</b> if <b>${cfg.assets[wi].sector}</b> crashes ${cfg.assets[wi].crash}%, your portfolio drops <b class="down">${worst.toFixed(1)}%</b>.<br>Total allocated: ${tot}% ${tot !== 100 ? '<span class="muted">(shown as share of total)</span>' : ''}`;
    };
    draw();
    wrap.querySelector('#al-go').onclick = () => {
      const tot = vals.reduce((a, b) => a + b, 0);
      if (!tot) return f.set('bad', 'Allocate something first.');
      const pct = vals.map((v) => (v / tot) * 100);
      const res = cfg.check(pct, cfg.assets);
      if (res === true) {
        f.set('ok', '✓ ' + cfg.explain);
        done({ ok: true });
      } else f.set('bad', res);
    };
  };

  /* ---------------- leverage & liquidation lab ---------------- */
  W.leverage = function (host, cfg, done) {
    hintFor(Object.assign({ hint: 'Liquidation distance ≈ 1 ÷ leverage. A 10% liquidation distance needs leverage below 10×. Leave room for fees and maintenance margin.' }, cfg));
    const entry = cfg.entry || 60000;
    host.insertAdjacentHTML(
      'beforeend',
      `<p class="w-prompt">${cfg.prompt}</p>
      <div class="lv"><label>Leverage <b class="mono" id="lv-v">1×</b><input type="range" id="lv-r" min="1" max="50" value="1"></label>
      <div class="lv-grid">
        <div><span class="muted small">Your margin</span><b class="mono">$1,000</b></div>
        <div><span class="muted small">Position size</span><b class="mono" id="lv-pos"></b></div>
        <div><span class="muted small">Liquidation price</span><b class="mono down" id="lv-liq"></b></div>
        <div><span class="muted small">Distance to liquidation</span><b class="mono" id="lv-dist"></b></div>
        <div><span class="muted small">If price +${cfg.move}%</span><b class="mono up" id="lv-up"></b></div>
        <div><span class="muted small">If price −${cfg.move}%</span><b class="mono down" id="lv-dn"></b></div>
      </div>
      <div class="lv-bar"><div class="lv-liqmark" id="lv-mark"></div><div class="lv-drop" id="lv-drop"></div><span class="lv-l small">−50%</span><span class="lv-e small">Entry</span></div>
      <button class="btn btn-primary" id="lv-go">Lock in leverage</button></div>`
    );
    const f = fb(host);
    const $ = (id) => host.querySelector('#' + id);
    const draw = () => {
      const L = +$('lv-r').value;
      $('lv-v').textContent = L + '×';
      $('lv-pos').textContent = U.money(1000 * L, 0);
      const liq = L > 1 ? TM.Trading.liqPrice('long', entry, L) : null;
      $('lv-liq').textContent = liq ? '$' + U.num(liq, 0) : 'none (no leverage)';
      const dist = liq ? (1 - liq / entry) * 100 : 100;
      $('lv-dist').textContent = liq ? dist.toFixed(1) + '%' : '—';
      $('lv-up').textContent = U.smoney((1000 * L * cfg.move) / 100, 0);
      const dn = Math.max(-1000, (-1000 * L * cfg.move) / 100);
      $('lv-dn').textContent = (dist <= cfg.move ? 'LIQUIDATED ' : '') + U.smoney(dn, 0);
      $('lv-mark').style.right = Math.min(100, (dist / 50) * 100) + '%';
      $('lv-drop').style.width = (cfg.move / 50) * 100 + '%';
    };
    $('lv-r').oninput = draw;
    draw();
    $('lv-go').onclick = () => {
      const L = +$('lv-r').value;
      const res = cfg.check(L);
      if (res === true) {
        f.set('ok', '✓ ' + cfg.explain);
        done({ ok: true });
      } else f.set('bad', res);
    };
  };

  /* ---------------- sequence of decisions (psychology) ---------------- */
  W.decisions = function (host, cfg, done) {
    hintFor(Object.assign({ hint: 'Ask: "Is this decision part of my written plan, or a reaction to how I feel right now?"' }, cfg));
    const box = U.el('<div class="ds"></div>');
    host.appendChild(box);
    let i = 0,
      good = 0;
    const step = () => {
      if (i >= cfg.steps.length) {
        box.innerHTML = `<div class="ds-end"><b>${good}/${cfg.steps.length}</b> disciplined decisions. ${good === cfg.steps.length ? 'Ice-cold discipline.' : 'Review the ones you missed — these situations happen to every trader.'}</div>`;
        done({ ok: true, score: good / cfg.steps.length });
        return;
      }
      const st = cfg.steps[i];
      box.innerHTML = `<div class="ds-n muted small">Situation ${i + 1} of ${cfg.steps.length}</div><div class="ds-sit">${st.s}</div><div class="opts"></div><div class="w-fb"></div><button class="btn btn-primary ds-next" hidden>Next situation →</button>`;
      const opts = box.querySelector('.opts');
      st.o.forEach((o) => {
        const b = U.el(`<button class="opt"><span>${o.t}</span></button>`);
        b.onclick = () => {
          U.$$('.opt', opts).forEach((x) => (x.disabled = true));
          b.classList.add(o.good ? 'right' : 'wrong');
          if (o.good) good++;
          const fe = box.querySelector('.w-fb');
          fe.className = 'w-fb show ' + (o.good ? 'fb-ok' : 'fb-bad');
          fe.innerHTML = (o.good ? '✓ ' : '✕ ') + o.fb;
          box.querySelector('.ds-next').hidden = false;
          U.sound(o.good ? 'click' : 'error');
        };
        opts.appendChild(b);
      });
      box.querySelector('.ds-next').onclick = () => {
        i++;
        step();
      };
    };
    step();
  };

  /* ---------------- trading plan builder ---------------- */
  W.plan = function (host, cfg, done) {
    const p = TM.Store.s.plan || {};
    host.insertAdjacentHTML(
      'beforeend',
      `<p class="w-prompt">${cfg.prompt}</p>
      <form class="plan">
        <label class="fld">My style<select id="pl-style"><option>Day trading</option><option>Swing trading</option><option>Both</option></select></label>
        <label class="fld">Markets I trade<input id="pl-mk" placeholder="e.g. Large-cap tech stocks, BTC & ETH" value="${U.esc(p.markets || '')}"></label>
        <label class="fld">My setups (entry rules)<textarea id="pl-setup" rows="2" placeholder="e.g. Pullback to EMA 20 in an uptrend, with a bullish candle and RSI above 40">${U.esc(p.setup || '')}</textarea></label>
        <label class="fld">Stop-loss rule<input id="pl-stop" placeholder="e.g. Below the last swing low, at least 1 ATR away" value="${U.esc(p.stop || '')}"></label>
        <div class="plan-row"><label class="fld">Risk per trade (%)<input type="number" step="0.1" id="pl-risk" value="${p.risk || 1}"></label>
        <label class="fld">Minimum reward:risk<input type="number" step="0.1" id="pl-rr" value="${p.rr || 2}"></label>
        <label class="fld">Max trades per day<input type="number" id="pl-max" value="${p.max || 3}"></label>
        <label class="fld">Daily loss limit (%)<input type="number" step="0.5" id="pl-dl" value="${p.dl || 3}"></label></div>
        <label class="fld">I will NOT trade when…<input id="pl-no" placeholder="e.g. right before earnings, after 2 losses in a row, when angry" value="${U.esc(p.no || '')}"></label>
        <button class="btn btn-primary">Save my trading plan</button>
      </form>`
    );
    const f = fb(host);
    if (p.style) host.querySelector('#pl-style').value = p.style;
    host.querySelector('.plan').onsubmit = (e) => {
      e.preventDefault();
      const $ = (id) => host.querySelector('#' + id).value.trim();
      const plan = { style: $('pl-style'), markets: $('pl-mk'), setup: $('pl-setup'), stop: $('pl-stop'), risk: +$('pl-risk'), rr: +$('pl-rr'), max: +$('pl-max'), dl: +$('pl-dl'), no: $('pl-no'), at: Date.now() };
      const issues = [];
      if (plan.setup.length < 10) issues.push('Describe your entry setup in at least a sentence.');
      if (plan.stop.length < 5) issues.push('Write a stop-loss rule.');
      if (!(plan.risk > 0) || plan.risk > 3) issues.push('Pick a risk per trade between 0.1% and 3% (1% is a common choice).');
      if (!(plan.rr >= 1)) issues.push('Minimum reward:risk should be at least 1 (2 is common).');
      if (issues.length) return f.set('bad', issues.join('<br>'));
      TM.Store.s.plan = plan;
      TM.Store.save();
      TM.Progress.checkAchievements();
      f.set('ok', '✓ Plan saved. You can see it any time in your Trading Journal. A plan only works if you follow it — the journal will show whether you did.');
      done({ ok: true });
    };
  };

  /* =====================================================================
     SCENARIO PLAYER — progressive reveal of a chart with decisions.
     cfg: {data|candles, overlays, panes, intro, stages:[{reveal, q, options:[{t,score(0-3),fb}], input:{answer,tol,prefix,unit}, lines, zones, note}], outro}
     ===================================================================== */
  W.scenario = function (host, cfg, done) {
    TM.Coach.setContext({ view: 'scenario', hint: () => (cfg.stages[si] && cfg.stages[si].hint) || 'Think in this order: trend → key level → confirmation (volume/candle close) → where am I wrong → is reward ≥ 2× risk?', label: 'Market scenario' });
    const d = cfg.candles || data(cfg.data);
    host.insertAdjacentHTML('beforeend', cfg.intro ? `<div class="sc-intro">${cfg.intro}</div>` : '');
    const C = chartIn(host, Object.assign({}, cfg, { candles: d, rightPad: 8 }));
    const panel = U.el('<div class="sc-panel"></div>');
    host.appendChild(panel);
    let si = 0,
      total = 0,
      max = 0,
      anim = null;
    const showStage = () => {
      const st = cfg.stages[si];
      C.ch.setLines(st.lines || []);
      C.ch.setZones(st.zones || []);
      C.ch.setMarkers(st.marks || []);
      panel.innerHTML = `<div class="sc-step muted small">Decision ${si + 1} of ${cfg.stages.length}</div>${st.note ? `<div class="sc-note">${st.note}</div>` : ''}<p class="w-prompt">${st.q}</p><div class="sc-body"></div><div class="w-fb"></div><button class="btn btn-primary sc-next" hidden>${si === cfg.stages.length - 1 ? 'See what happened →' : 'Continue — reveal more →'}</button>`;
      const body = panel.querySelector('.sc-body');
      const fe = panel.querySelector('.w-fb');
      const next = panel.querySelector('.sc-next');
      if (st.input) {
        const form = U.el(`<form class="w-num"><span class="w-unit">${st.input.prefix || ''}</span><input type="number" step="any" inputmode="decimal" aria-label="Your answer"><span class="w-unit">${st.input.unit || ''}</span><button class="btn btn-primary">Submit</button></form>`);
        body.appendChild(form);
        let tries = 0;
        max += 3;
        form.onsubmit = (e) => {
          e.preventDefault();
          const v = parseFloat(form.querySelector('input').value);
          if (isNaN(v)) return;
          const ok = Math.abs(v - st.input.answer) <= (st.input.tol || 0.5);
          if (ok || tries >= 1) {
            const sc = ok ? (tries ? 2 : 3) : 0;
            total += sc;
            fe.className = 'w-fb show ' + (ok ? 'fb-ok' : 'fb-bad');
            fe.innerHTML = (ok ? '✓ ' : `✕ The answer is <b>${st.input.prefix || ''}${st.input.answer}${st.input.unit || ''}</b>. `) + st.input.fb;
            form.querySelector('button').disabled = true;
            form.querySelector('input').disabled = true;
            next.hidden = false;
          } else {
            tries++;
            fe.className = 'w-fb show fb-bad';
            fe.innerHTML = '✕ Not quite — try once more. ' + (st.input.hint || '');
          }
        };
      } else {
        max += 3;
        const opts = U.el('<div class="opts"></div>');
        body.appendChild(opts);
        st.options.forEach((o) => {
          const b = U.el(`<button class="opt"><span>${o.t}</span><span class="opt-score"></span></button>`);
          b.onclick = () => {
            U.$$('.opt', opts).forEach((x) => (x.disabled = true));
            total += o.score;
            b.classList.add(o.score >= 3 ? 'right' : o.score >= 2 ? 'okish' : 'wrong');
            const best = st.options.reduce((a, x) => (x.score > a.score ? x : a), st.options[0]);
            if (best !== o) opts.children[st.options.indexOf(best)].classList.add('right');
            b.querySelector('.opt-score').textContent = '+' + o.score;
            fe.className = 'w-fb show ' + (o.score >= 3 ? 'fb-ok' : o.score >= 2 ? 'fb-info' : 'fb-bad');
            fe.innerHTML = `<b>${o.score >= 3 ? 'Strong decision.' : o.score >= 2 ? 'Reasonable, but not the best.' : 'Risky decision.'}</b> ${o.fb}`;
            next.hidden = false;
            U.sound(o.score >= 2 ? 'click' : 'error');
          };
          opts.appendChild(b);
        });
      }
      next.onclick = () => {
        si++;
        const to = si < cfg.stages.length ? cfg.stages[si].reveal : d.length - 1;
        animateTo(to, () => (si < cfg.stages.length ? showStage() : finish()));
      };
    };
    const animateTo = (to, cb) => {
      let cur = C.ch.limitIdx;
      panel.innerHTML = '<div class="muted sc-wait">▶ Market moving…</div>';
      const stepMs = TM.Store.s.settings.reduceMotion ? 0 : 140;
      if (!stepMs) {
        C.ch.reveal(to);
        return cb();
      }
      anim = setInterval(() => {
        cur++;
        C.ch.reveal(cur);
        if (cur >= to) {
          clearInterval(anim);
          anim = null;
          cb();
        }
      }, stepMs);
    };
    const finish = () => {
      const pct = Math.round((total / Math.max(1, max)) * 100);
      C.ch.setLines(cfg.finalLines || []);
      C.ch.setZones(cfg.finalZones || []);
      C.ch.setMarkers(cfg.finalMarks || []);
      panel.innerHTML = `<div class="sc-end"><div class="sc-score ${pct >= 70 ? 'up' : pct >= 45 ? '' : 'down'}">${pct}%</div><div><b>Decision score</b><p>${cfg.outro || ''}</p></div></div>`;
      done({ ok: true, score: pct });
    };
    C.ch.reveal(cfg.stages[0].reveal);
    // anchor the window so revealed candles fill from the left and the future stays hidden on the right
    C.ch.follow = false;
    C.ch.end = d.length + 8;
    C.ch.req();
    showStage();
    return {
      destroy: () => {
        clearInterval(anim);
        C.ch.destroy();
      },
    };
  };
})();

(function () {
  'use strict';
  const U = TM.U;
  const S = () => TM.Store.s;

  TM.recordAnswer = function (lessonId, ok) {
    const t = S().quiz.topics;
    t[lessonId] = t[lessonId] || { r: 0, w: 0 };
    ok ? t[lessonId].r++ : t[lessonId].w++;
    S().counters.quizAnswered++;
    if (ok) S().counters.quizCorrect++;
    TM.Progress.goal('quiz');
    TM.Store.save();
  };

  TM.Views.academy = function (el) {
    const s = S();
    const done = (id) => s.lessons[id] && s.lessons[id].done;
    const next = TM.Lessons.next();
    const total = TM.Lessons.list.length;
    const nDone = TM.Lessons.list.filter((l) => done(l.id)).length;
    el.innerHTML = `
      <div class="page-head"><div><h2>Trading Academy</h2><p class="muted">Seven levels from zero to strategist, plus a crypto track. Every lesson: explanation → visual → hands-on exercise → quiz → real scenario.</p></div>
      <div class="ring" style="--p:${(nDone / total) * 100}"><b>${nDone}</b><small>/ ${total}</small></div></div>
      <div class="levels">${TM.Lessons.LEVELS.map((L) => {
        const ls = TM.Lessons.ofLevel(L.id);
        const unlocked = TM.Lessons.levelUnlocked(L.id);
        const nd = ls.filter((l) => done(l.id)).length;
        const test = s.quiz.levels[L.id];
        return `<section class="level card ${unlocked ? '' : 'locked'} ${L.star ? 'star' : ''}">
          <header class="lv-head"><span class="lv-ic">${L.icon}</span><div class="lv-t"><div class="eyebrow">${L.id === 'C' ? 'Bonus track' : 'Level ' + L.id}${L.star ? ' · ⭐ Most important' : ''}</div><h3>${L.name}</h3><p class="muted small">${L.blurb}</p></div>
          <div class="lv-prog"><div class="xpbar"><i style="width:${(nd / ls.length) * 100}%"></i></div><span class="small muted">${nd}/${ls.length} lessons${L.rank !== 'Bonus' ? ' · unlocks rank ' + L.rank : ''}</span></div></header>
          ${unlocked ? '' : `<div class="lock-msg">🔒 Complete ${L.id === 'C' ? 'Level 1' : 'Level ' + (typeof L.id === 'number' ? L.id - 1 : '')} to unlock — or enable "Unlock all levels" in Settings.</div>`}
          <div class="lessons">${ls
            .map((l) => {
              const st = done(l.id) ? 'done' : next && next.id === l.id ? 'next' : unlocked ? 'open' : 'locked';
              return `<a class="lesson ${st}" href="${unlocked ? '#lesson-' + l.id : '#academy'}" ${unlocked ? '' : 'aria-disabled="true"'}><span class="ls-n">${l.id.replace('-', '.')}</span><span class="ls-b"><b>${U.esc(l.title)}</b><span class="small muted">${l.topics.join(' · ')}</span></span><span class="ls-s">${st === 'done' ? '✓' : st === 'next' ? '▶' : st === 'locked' ? '🔒' : ''}</span></a>`;
            })
            .join('')}
            <a class="lesson test ${unlocked ? '' : 'locked'}" href="${unlocked ? '#test-' + L.id : '#academy'}"><span class="ls-n">🧠</span><span class="ls-b"><b>${L.name} — Knowledge Test</b><span class="small muted">${test ? `Best ${test.best}% · ${test.passed ? 'Passed ✓' : 'Not passed yet'}` : '10 questions · pass with 70%'}</span></span><span class="ls-s">${test && test.passed ? '✓' : ''}</span></a>
          </div></section>`;
      }).join('')}</div>`;
    U.$$('.lesson[aria-disabled]', el).forEach((a) => a.addEventListener('click', (e) => {
      e.preventDefault();
      U.toast('This level is locked. Finish the previous level first (or enable "Unlock all levels" in Settings).', 'info');
    }));
  };

  /* ---------------- lesson player ---------------- */
  TM.Views.lesson = function (el, id) {
    const lesson = TM.Lessons.byId(id);
    if (!lesson) {
      location.hash = '#academy';
      return;
    }
    if (!TM.Lessons.unlocked(lesson)) {
      el.innerHTML = `<div class="card"><h3>🔒 Lesson locked</h3><p class="muted">Complete the previous level first, or enable "Unlock all levels" in Settings.</p><a class="btn btn-primary" href="#academy">Back to the Academy</a></div>`;
      return;
    }
    const s = S();
    const firstTime = !(s.lessons[id] && s.lessons[id].done);
    const steps = lesson.steps;
    const solved = new Array(steps.length).fill(false);
    let i = 0,
      widget = null;
    const res = { quizRight: 0, quizTotal: 0, exFirst: 0, scen: null };
    const label = { learn: 'Learn', do: 'Practice', quiz: 'Quiz', scenario: 'Scenario' };
    const lv = TM.Lessons.LEVELS.find((L) => L.id === lesson.level);
    el.innerHTML = `
      <div class="lesson-top"><a class="btn btn-ghost btn-sm" href="#academy">← Academy</a><div class="lt-t"><div class="eyebrow">${lv.icon} ${lesson.level === 'C' ? 'Crypto track' : 'Level ' + lesson.level + ' · ' + lv.name} · Lesson ${id.replace('-', '.')}</div><h2>${U.esc(lesson.title)}</h2></div></div>
      <div class="stepper">${steps.map((st, k) => `<button class="stp" data-k="${k}"><i></i><span>${label[st.type]}</span></button>`).join('')}</div>
      <div class="lesson-body card"></div>
      <div class="lesson-nav"><button class="btn btn-ghost" id="ls-back">← Back</button><span class="muted small" id="ls-req"></span><button class="btn btn-primary" id="ls-next">Next →</button></div>`;
    const body = el.querySelector('.lesson-body');
    const nextB = el.querySelector('#ls-next');
    const backB = el.querySelector('#ls-back');
    const req = el.querySelector('#ls-req');

    const refreshNav = () => {
      U.$$('.stp', el).forEach((b, k) => {
        b.classList.toggle('on', k === i);
        b.classList.toggle('done', solved[k]);
        b.disabled = k > i && !solved.slice(0, k).every(Boolean);
      });
      const st = steps[i];
      const needs = st.type !== 'learn' && !solved[i];
      nextB.disabled = needs;
      req.textContent = needs ? { do: 'Complete the exercise to continue', quiz: 'Answer the questions to continue', scenario: 'Finish the scenario to continue' }[st.type] : '';
      nextB.textContent = i === steps.length - 1 ? 'Finish lesson ✓' : 'Next →';
      backB.disabled = i === 0;
    };
    const show = (k) => {
      if (widget && widget.destroy) widget.destroy();
      widget = null;
      i = k;
      const st = steps[i];
      body.innerHTML = '';
      body.classList.remove('fade-in');
      void body.offsetWidth;
      body.classList.add('fade-in');
      TM.Coach.setContext({ view: 'lesson', hint: null, label: 'Lesson ' + id.replace('-', '.') });
      if (st.type === 'learn') {
        body.insertAdjacentHTML('beforeend', `<h3>${st.title}</h3><div class="learn-text">${st.body}</div>`);
        if (st.visual) {
          const v = U.el('<div class="learn-visual"></div>');
          body.appendChild(v);
          widget = TM.W[st.visual.w](v, st.visual, () => {});
        }
        solved[i] = true;
      } else if (st.type === 'do') {
        body.insertAdjacentHTML('beforeend', `<div class="eyebrow">Interactive exercise</div>`);
        widget = TM.W[st.w](body, st, (r) => {
          if (!solved[i] && r.firstTry) res.exFirst++;
          solved[i] = true;
          refreshNav();
        });
      } else if (st.type === 'quiz') {
        runQuiz(st);
      } else if (st.type === 'scenario') {
        body.insertAdjacentHTML('beforeend', `<div class="eyebrow">Practical trading scenario</div>`);
        widget = TM.W.scenario(body, st, (r) => {
          res.scen = r.score;
          solved[i] = true;
          refreshNav();
        });
      }
      refreshNav();
      body.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    const runQuiz = (st) => {
      let qi = 0;
      body.insertAdjacentHTML('beforeend', `<div class="eyebrow">Knowledge check · ${st.qs.length} questions</div><div class="qz"></div>`);
      const box = body.querySelector('.qz');
      const one = () => {
        const qq = st.qs[qi];
        box.innerHTML = `<div class="muted small">Question ${qi + 1} of ${st.qs.length}</div>`;
        const order = U.shuffle(qq.o.map((t, k) => ({ t, k })));
        TM.W.choice(box, { prompt: qq.q, options: order.map((x) => x.t), answer: order.findIndex((x) => x.k === qq.a), explain: qq.e }, (r) => {
          res.quizTotal++;
          if (r.ok) res.quizRight++;
          TM.recordAnswer(id, r.ok);
          const b = U.el(`<button class="btn btn-primary">${qi < st.qs.length - 1 ? 'Next question →' : 'Done ✓'}</button>`);
          b.onclick = () => {
            qi++;
            if (qi < st.qs.length) one();
            else {
              box.innerHTML = `<div class="qz-end"><b>${res.quizRight}/${res.quizTotal}</b> correct. ${res.quizRight === res.quizTotal ? 'Excellent!' : 'Review the explanations — they will come back in the Knowledge Test.'}</div>`;
              solved[i] = true;
              refreshNav();
            }
          };
          box.appendChild(b);
        });
      };
      one();
    };
    const finish = () => {
      if (widget && widget.destroy) widget.destroy();
      widget = null;
      let xp = 0;
      if (firstTime) {
        xp = 80 + res.quizRight * 10 + res.exFirst * 10 + (res.scen != null && res.scen >= 70 ? 20 : 0);
        s.lessons[id] = { done: true, at: Date.now(), quiz: { r: res.quizRight, t: res.quizTotal }, scen: res.scen };
        TM.Store.save();
        TM.Progress.addXP(xp, 'Lesson ' + id.replace('-', '.') + ' complete');
        TM.Progress.goal('lesson');
      }
      const nxt = TM.Lessons.next();
      const levelNowDone = TM.Progress.levelDone(lesson.level);
      el.querySelector('.stepper').innerHTML = '';
      el.querySelector('.lesson-nav').innerHTML = '';
      body.innerHTML = `<div class="ls-done"><div class="ls-done-ic">🎉</div><h3>Lesson complete!</h3>
        <div class="ls-done-stats"><div><b>${res.quizRight}/${res.quizTotal}</b><span>quiz</span></div><div><b>${res.scen != null ? res.scen + '%' : '—'}</b><span>scenario</span></div><div><b class="xp">${firstTime ? '+' + xp : '—'}</b><span>XP${firstTime ? '' : ' (replay)'}</span></div></div>
        <p class="muted">Key idea: ${U.esc(lesson.topics.join(', '))}. Put it to work in the simulators.</p>
        <div class="btn-row center">${levelNowDone ? `<a class="btn btn-primary" href="#test-${lesson.level}">🧠 Take the ${lv.name} test</a>` : ''}${nxt ? `<a class="btn ${levelNowDone ? 'btn-ghost' : 'btn-primary'}" href="#lesson-${nxt.id}">Next: ${nxt.id.replace('-', '.')} ${U.esc(nxt.title)} →</a>` : ''}<a class="btn btn-ghost" href="#academy">Back to Academy</a></div></div>`;
      U.sound('level');
    };
    nextB.onclick = () => {
      if (nextB.disabled) return;
      if (i === steps.length - 1) finish();
      else show(i + 1);
    };
    backB.onclick = () => i > 0 && show(i - 1);
    U.on(el.querySelector('.stepper'), 'click', '.stp', (e, b) => {
      const k = +b.dataset.k;
      if (!b.disabled) show(k);
    });
    show(0);
    return { destroy: () => widget && widget.destroy && widget.destroy() };
  };
})();

    /* -------- helpers -------- */

    const series = () => TM.Live.series(ui.sym, ui.tf);
    const dec = (p) => U.decFor(p);
    const equity = () => TM.mainEquity();
    const qtyDec = () => (isCrypto ? (def().start > 1000 ? 4 : def().start > 10 ? 3 : 0) : 0);
    const roundQty = (q) => {
      const d = qtyDec();
      const m = 10 ** d;
      return Math.floor(q * m) / m;
    };
    function entryPrice() {
      const q = TM.Live.quote(ui.sym);
      if (tk.type === 'limit' && +tk.limit > 0) return +tk.limit;
      return tk.side === 'long' ? q.ask : q.bid;
    }
    function computeQty(entry) {
      const stop = +tk.stop;
      if (tk.size === 'qty') return roundQty(+tk.qty || 0);
      if (tk.size === 'amount') return roundQty((+tk.amount || 0) / entry);
      if (!(stop > 0) || stop === entry) return 0;
      const riskD = (equity() * (+tk.risk || 0)) / 100;

      $('.th-info').innerHTML = `Bid <b class="up">${U.price(q.bid)}</b> · Ask <b class="down">${U.price(q.ask)}</b> · Spread ${U.price(q.spread, U.decFor(p))} · Mkt cap ${U.big(TM.Live.mcap(d.sym))} · 24h vol ${U.big(TM.Live.vol24(d.sym))}<br><span>${d.about}</span>`;
    }
    function renderAcct() {

      $('.acct-mini').innerHTML = `<div><span class="muted small">Equity</span><b class="mono">${U.money(eq)}</b></div><div><span class="muted small">Buying power</span><b class="mono">${U.money(acct.cash)}</b></div><div><span class="muted small">Unrealised</span><b class="mono ${U.cls(un)}">${U.smoney(un)}</b></div>`;
    }
    function renderTicket() {
      const sp = spec();
      const chk = TM.Trading.check(s.account, sp, sp.equity);
      const c = chk.calc;
      const d = def();

      const lines = [

      lines.push(['Reward : Risk', c.rr != null ? `<span class="${c.rr >= 2 ? 'up' : c.rr < 1 ? 'down' : ''}">${c.rr.toFixed(2)} : 1</span>` : '—']);

      $('.tk-sum').innerHTML = lines.map(([k, v]) => `<div class="kv"><span>${k}</span><b class="mono">${v}</b></div>`).join('');
      if (tk.size === 'risk' && !(+tk.stop > 0)) chk.errors = ['Risk % sizing needs a stop-loss price — the size is calculated from it.'];
      if (tk.size === 'risk' && tk.capped && sp.qty > 0) chk.warnings.unshift(`Size capped by your buying power, so you are risking ${c.riskPct != null ? c.riskPct.toFixed(2) : '?'}% instead of ${tk.risk}%. Your stop is very tight — that is fine, just know the position is as large as the account allows.`);

    function tfIndex(t) {
      const arr = series();
      let lo = 0,
        hi = arr.length - 1;
      if (!arr.length || t < arr[0].t) return -1;
      while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (arr[mid].t <= t) lo = mid;
        else hi = mid - 1;

      return lo;

        .filter((t) => t.sym === sym && t.mode === mode && t.openedT)

    function onDrag(id, price, final) {

        tk.target = p;
        $('#tk-target').value = p;
      } else if (id === 'tk-l') {
        tk.limit = p;
        $('#tk-limit').value = p;
      } else if (/^[st]:/.test(id) && final) {
        const pos = s.account.positions.find((x) => x.id === id.slice(2));
        if (pos) {
          const field = id[0] === 's' ? 'stop' : 'target';
          const old = pos[field];
          const err = validateMod(pos, field, p);

      }

        renderTicket();
        return;

      tk.confirm = false;
      renderTicket();

    function validateMod(pos, field, v) {

        if (pos.side === 'long' && v <= px) return 'A long position’s target must be above the current price.';

          .map((p) => {
            const last = TM.Live.price(p.sym);
            const pnl = TM.Trading.pnl(p, last);
            const r = p.riskPlanned ? pnl / p.riskPlanned : null;
            return `<tr data-id="${p.id}"><td><b>${p.sym}</b>${p.lev > 1 ? ` <span class="pill">${p.lev}×</span>` : ''}</td><td class="${p.side === 'long' ? 'up' : 'down'}">${p.side.toUpperCase()}</td><td class="mono">${U.num(p.qty, qtyDec())}</td><td class="mono">${U.price(p.entry)}</td><td class="mono">${U.price(last)}</td><td class="mono ${U.cls(pnl)}">${U.smoney(pnl)}${r != null ? `<br><small>${r >= 0 ? '+' : ''}${r.toFixed(2)}R</small>` : ''}</td>
            <td><input class="mini-in" type="number" step="any" data-f="stop" value="${p.stop || ''}" placeholder="none" aria-label="Stop-loss"></td><td><input class="mini-in" type="number" step="any" data-f="target" value="${p.target || ''}" placeholder="none" aria-label="Take-profit"></td>${isCrypto ? `<td class="mono down">${p.liq ? U.price(p.liq) : '—'}</td>` : ''}

          })
          .join('')}</tbody></table></div>`;
      } else if (tab === 'ord') {
        b.innerHTML = ords.length

          : '<div class="empty">No working limit orders.</div>';
      } else {

      const ctl = new AbortController();

      try {
        const r = await fetch(url, { signal: ctl.signal });

    async function loadRealChart(sym) {
      const out = $('#real-out');
      out.innerHTML = '<span class="muted">Loading real daily candles…</span>';
      let candles = null,
        src = '';
      try {
        const j = await fetchJSON(`https://api.binance.com/api/v3/klines?symbol=${sym}USDT&interval=1d&limit=200`);
        candles = j.map((k) => ({ t: k[0] / 1000, o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5] }));
        src = 'Binance public API';
      } catch (e) {
        try {
          const j = await fetchJSON(`https://api.coingecko.com/api/v3/coins/${CG[sym]}/ohlc?vs_currency=usd&days=180`);
          const byDay = {};
          j.forEach((k) => {
            const day = Math.floor(k[0] / 86400000) * 86400;
            const d = byDay[day];
            if (!d) byDay[day] = { t: day, o: k[1], h: k[2], l: k[3], c: k[4], v: 0 };
            else {
              d.h = Math.max(d.h, k[2]);
              d.l = Math.min(d.l, k[3]);
              d.c = k[4];
            }
          });
          candles = Object.values(byDay).sort((a, b) => a.t - b.t);
          src = 'CoinGecko public API';
        } catch (e2) {
          out.innerHTML = `<p class="muted">Real chart data could not be loaded here (${U.esc(e2.message || 'network blocked')}). The simulator keeps working normally.</p>`;
          return;
        }
      }
      out.innerHTML = '';

      ch.setData(candles, { fit: true, fitBars: candles.length + 3 });

      const minDist = e * (isCrypto ? 0.006 : 0.004);
      let dist = Math.max(Math.abs(e - swing) + ctx.atr * 0.5, ctx.atr * 1.5, minDist);
      const st = tk.side === 'long' ? e - dist : e + dist;

    'trend-up': { name: 'Trend day (up)', desc: 'Price broke out of the opening range and stayed above VWAP most of the day. The best trades were buying pullbacks to VWAP/EMA 9 — shorting was fighting the tide.' },
    'trend-down': { name: 'Trend day (down)', desc: 'Price broke down from the opening range and stayed below VWAP. Rallies into VWAP were selling opportunities; buying dips kept failing.' },
    reversal: { name: 'Reversal day', desc: 'The early gap-up rally failed, price lost VWAP and trended lower all afternoon. Early longs needed tight stops; the trend change was the opportunity.' },
    range: { name: 'Range / chop day', desc: 'No side took control. Price crossed VWAP again and again inside a tight range. Breakouts failed — the best decision was often to trade small or not at all.' },
    fade: { name: 'Gap-fill (fade) day', desc: 'A big gap up was sold from the open and price drifted back toward yesterday’s close. Chasing the gap was the mistake; patience or fading the weakness was rewarded.' },
  };
  const phase = (m) => (m < 30 ? 'Open' : m < 120 ? 'Morning' : m < 270 ? 'Midday' : m < 360 ? 'Afternoon' : 'Close');
  const phaseVol = (i) => (i < 30 ? 2.3 - i * 0.045 : i < 120 ? 1 : i < 270 ? 0.55 : i < 360 ? 0.9 : 1.25);
  const phaseVm = (i) => (i < 30 ? 3.2 - i * 0.07 : i < 120 ? 1 : i < 270 ? 0.5 : i < 360 ? 0.85 : 1.8);

  function plan(type) {
    switch (type) {
      case 'trend-up':
        return [[15, 'range', 0.994, 1.006], [15, 'to', 1.016], [30, 'to', 1.009], [60, 'to', 1.03], [150, 'range', 1.022, 1.034], [90, 'to', 1.046], [30, 'to', 1.05]];
      case 'trend-down':
        return [[15, 'range', 0.994, 1.006], [15, 'to', 0.984], [30, 'to', 0.991], [60, 'to', 0.97], [150, 'range', 0.966, 0.978], [90, 'to', 0.955], [30, 'to', 0.95]];
      case 'reversal':
        return [[15, 'to', 1.012], [25, 'to', 1.021], [30, 'to', 1.004], [50, 'to', 0.99], [150, 'range', 0.982, 0.994], [90, 'to', 0.972], [30, 'to', 0.968]];
      case 'fade':
        return [[15, 'range', 0.995, 1.006], [45, 'to', 0.985], [60, 'to', 0.973], [150, 'range', 0.968, 0.98], [90, 'to', 0.975], [30, 'to', 0.97]];
      default:
        return [[30, 'range', 0.992, 1.008], [360, 'range', 0.99, 1.01]];
    }
  }
  function gapFor(type, r) {
    return { 'trend-up': 0.012 + r() * 0.015, 'trend-down': -0.012 - r() * 0.015, reversal: 0.018 + r() * 0.012, fade: 0.03 + r() * 0.015, range: (r() - 0.5) * 0.008 }[type];
  }
  function catalyst(g, r) {
    if (g > 0.025) return U.pick(['Gapping up big after earnings beat expectations', 'Gapping up on takeover rumours', 'Gapping up after a new product launch'], r);
    if (g > 0.008) return U.pick(['Gapping up on an analyst upgrade', 'Gapping up after positive sector news', 'Gapping up on strong pre-market volume'], r);
    if (g < -0.008) return U.pick(['Gapping down after a guidance cut', 'Gapping down after a CEO resignation', 'Gapping down on a downgrade'], r);
    return U.pick(['Flat open, no major news', 'Quiet pre-market, light volume', 'No catalyst — trading with the market'], r);
  }

  function genDay(sess) {
    const r = U.rng(sess.seed);
    const st = STOCKS.find((x) => x.sym === sess.sym);
    const prevStart = st.base * (0.98 + r() * 0.04);
    const day0 = Date.UTC(2026, 2, 2 + (sess.n % 25)) / 1000; // a weekday-ish sim date
    const prior = TM.Market.generate({ seed: sess.seed + 1, start: prevStart, t0: day0 - 86400 + 13.5 * 3600, step: 60, tpb: 6, baseVol: 9000, segs: [{ n: 90, to: prevStart * 1.008, v: 0.0009, vm: 0.7 }, { n: 60, range: [prevStart * 1.002, prevStart * 1.011], v: 0.0009, vm: 1.1 }] });
    const pc = prior[prior.length - 1].c;
    const g = sess.gap;
    const p0 = pc * (1 + g);
    let off = 0;
    const segs = plan(sess.type).map(([n, kind, a, b], k) => {
      const sg = { n, v: 0.00125, vol: [], vmArr: [] };
      if (k === 0) sg.gap = g;
      if (kind === 'to') sg.to = p0 * a;
      else sg.range = [p0 * a, p0 * b];
      for (let j = 0; j < n; j++) {
        sg.vol.push(phaseVol(off + j));
        sg.vmArr.push(phaseVm(off + j));
      }
      off += n;
      return sg;
    });
    const day = TM.Market.generate({ seed: sess.seed + 2, start: pc, t0: day0 + 9.5 * 3600, step: 60, tpb: 8, baseVol: 14000, keepTicks: true, segs });
    return { all: prior.concat(day), prevClose: pc };
  }

  function newSession(pick) {
    const s = S();
    const n = (s.counters.daySessions || 0) + (s.day.history ? s.day.history.length : 0);
    return { seed: pick.seed, sym: pick.sym, type: pick.type, gap: pick.gap, cat: pick.cat, n, bar: PRIOR, tick: 0, acct: TM.Store.newAccount(10000), feed: [], tradeIds: [], ids: { breakout: 0, pullback: 0, reversal: 0, level: 0, momentum: 0, trend: 0 }, idOk: 0, idTry: 0, flags: {}, done: false };
  }
  function candidates() {
    const base = U.seed();
    const r = U.rng(base);
    const syms = U.shuffle(STOCKS, r).slice(0, 3);
    return syms.map((st, k) => {
      const type = U.pick(['trend-up', 'trend-down', 'reversal', 'range', 'fade', 'trend-up', 'reversal'], r);
      const g = gapFor(type, r);
      return { seed: base + k * 101, sym: st.sym, name: st.name, type, gap: g, cat: catalyst(g, r), rvol: (1.2 + Math.abs(g) * 60 + r()).toFixed(1) };
    });
  }

  TM.Views.day = function (el) {
    const s = S();
    let sess = s.day.session;
    let timer = null,
      chart = null,
      paused = true,
      modalOpen = false,
      data = null;
    const destroyers = [];

    function lobby() {
      const picks = candidates();
      const hist = (s.day.history || []).slice(-5).reverse();
      const week = s.day.week || [];
      el.innerHTML = `
        <div class="page-head"><div><h2>Day Trading Simulator</h2><p class="muted">Trade a full simulated session from the opening bell to the close. Prices move through realistic phases: opening volatility, morning trend, midday lull, afternoon move and the closing rush. You start each session with a <b>$10,000 session bankroll</b>; results go into your stats and journal.</p></div></div>
        <div class="daybar big"><span style="flex:30" class="ph-open">Open<br><small>9:30 · volatile</small></span><span style="flex:90" class="ph-morning">Morning<br><small>10:00 · trends form</small></span><span style="flex:150" class="ph-midday">Midday<br><small>11:30 · low volume</small></span><span style="flex:90" class="ph-afternoon">Afternoon<br><small>14:00 · volume returns</small></span><span style="flex:30" class="ph-close">Close<br><small>15:30 · be flat</small></span></div>

          .map(

          )
          .join('')}</div>
        <div class="grid g2">
          <section class="card"><h3>Rules of the session</h3><ul class="bul small"><li>All positions are closed automatically at 15:59.</li><li>Every trade gets a coach review: entry, risk, exit and lesson.</li><li>Use the <b>Identify</b> buttons to call out breakouts, pullbacks and more — correct calls earn XP.</li><li>XP is for discipline and pattern recognition, <b>not</b> for profit or trade count.</li><li>Week progress: <b>${week.length}/5</b> sessions · ${U.smoney(week.reduce((a, b) => a + b, 0))}</li></ul></section>
          <section class="card"><h3>Recent sessions</h3>${hist.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Stock</th><th>Day type</th><th>P&L</th><th>Trades</th><th>Grade</th></tr></thead><tbody>${hist.map((h) => `<tr><td><b>${h.sym}</b></td><td class="small">${TYPES[h.type].name}</td><td class="mono ${U.cls(h.pnl)}">${U.smoney(h.pnl)}</td><td class="mono">${h.trades}</td><td><span class="grade g-${h.grade}">${h.grade}</span></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No sessions yet. Your first one is waiting.</p>'}</section>
        </div>`;
      U.$$('.pick', el).forEach((b) => {
        b.onclick = () => {
          sess = s.day.session = newSession(picks[+b.dataset.k]);
          TM.Store.save();
          play();
        };
      });
    }

    function vwapAt(arr, i) {
      const v = TM.Ind.vwap(arr.slice(0, i + 1));
      return v[v.length - 1];
    }
    function view() {
      const all = data.all;
      const out = all.slice(0, sess.bar);
      const cur = all[sess.bar];
      if (cur) {
        const k = Math.min(sess.tick, cur.ticks.length - 1);
        const tks = cur.ticks.slice(0, k + 1);
        const frac = (k + 1) / cur.ticks.length;
        out.push({ t: cur.t, o: tks[0], h: Math.max(...tks), l: Math.min(...tks), c: tks[tks.length - 1], v: Math.round(cur.v * frac) });
      }
      return out;
    }
    const minute = () => sess.bar - PRIOR;
    const lastPrice = () => {
      const v = view();
      return v[v.length - 1].c;
    };
    const orRange = () => {
      const d = data.all.slice(PRIOR, PRIOR + 15);
      return { h: Math.max(...d.map((c) => c.h)), l: Math.min(...d.map((c) => c.l)) };
    };

    function feed(msg, kind = 'info') {
      sess.feed.unshift({ t: U.hm(data.all[Math.min(sess.bar, data.all.length - 1)].t), msg, kind });
      if (sess.feed.length > 40) sess.feed.pop();
      renderFeed();
    }
    function detectEvents() {
      if (!s.settings.hints) return;
      const m = minute();
      const f = sess.flags;
      const v = view();
      const L = v.length - 1;
      if (m === 15 && !f.or) {
        f.or = 1;
        const o = orRange();
        feed(`Opening range set: high <b>${U.price(o.h)}</b>, low <b>${U.price(o.l)}</b>. A break of either side with volume is a classic setup.`, 'coach');
      }
      if (m > 15 && m < 300) {
        const o = orRange();
        const c = v[L - 1];
        const ctx = TM.Market.context(v, L - 1);
        if (!f.orUp && c.c > o.h) {
          f.orUp = 1;
          feed(`Price closed above the opening range high on <b>${ctx.volRatio.toFixed(1)}×</b> volume. ${ctx.volRatio > 1.3 ? 'Volume confirms.' : 'Volume is weak — be careful.'} Where would your stop go?`, 'coach');
        }
        if (!f.orDn && c.c < o.l) {
          f.orDn = 1;
          feed(`Price closed below the opening range low on <b>${ctx.volRatio.toFixed(1)}×</b> volume. Sellers are pressing.`, 'coach');
        }
        const vw = TM.Ind.vwap(v);
        const side = Math.sign(v[L - 1].c - vw[L - 1]),
          prev = Math.sign(v[L - 2].c - vw[L - 2]);
        f.vx = f.vx || 0;
        if (side !== prev && f.vx < 4 && m > 20) {
          f.vx++;
          feed(side > 0 ? 'Price reclaimed <b>VWAP</b> — buyers taking back control.' : 'Price lost <b>VWAP</b> — sellers gaining control.', 'coach');
          if (f.vx === 4) feed('Price has crossed VWAP 4 times. That suggests a <b>choppy day</b> — VWAP strategies are unreliable now.', 'coach');
        }
      }
      if (m === 120 && !f.mid) {
        f.mid = 1;
        feed('11:30 — <b>Midday lull</b>. Volume usually dries up; breakouts fail more often. Many pros reduce size or take a break.', 'coach');
      }
      if (m === 270 && !f.aft) {
        f.aft = 1;
        feed('14:00 — <b>Afternoon session</b>. Volume returns. Watch whether the morning trend resumes or reverses.', 'coach');
      }
      if (m === 360 && !f.cls) {
        f.cls = 1;
        feed('15:30 — <b>Last 30 minutes</b>. Volume rises into the close. Plan your exits — positions are flattened at 15:59.', 'coach');
      }
    }

    /* identification game */
    function detect(kind) {
      const v = view();
      const L = v.length - 1;
      if (L < PRIOR + 5) return { ok: false, why: 'Let the session develop a few minutes first.' };
      const ctx = TM.Market.context(v, L);
      const cl = v.map((c) => c.c);
      const e9 = TM.Ind.ema(cl, 9),
        e20 = TM.Ind.ema(cl, 20);
      const vw = TM.Ind.vwap(v);
      const atr = ctx.atr;
      const last = v.slice(-4);
      const o = orRange();
      const m = minute();
      const hi30 = Math.max(...v.slice(-33, -3).map((c) => c.h)),
        lo30 = Math.min(...v.slice(-33, -3).map((c) => c.l));
      const res = { trend: ctx.trend };
      res.breakout = last.some((c) => c.c > hi30 || c.c < lo30 || (m > 15 && (c.c > o.h || c.c < o.l) && Math.abs(c.c - (c.c > o.h ? o.h : o.l)) < atr * 3)) && ctx.volRatio > 1.0;
      res.pullback = (ctx.trend === 'up' && last.some((c, k) => c.l <= Math.max(e20[L - 3 + k] || 0, vw[L - 3 + k]) + atr * 0.4) && v[L].c > e20[L]) || (ctx.trend === 'down' && last.some((c, k) => c.h >= Math.min(e20[L - 3 + k] || 1e9, vw[L - 3 + k]) - atr * 0.4) && v[L].c < e20[L]);
      let cross = false;
      for (let k = L - 4; k <= L; k++) if (e9[k - 1] != null && e20[k - 1] != null && Math.sign(e9[k] - e20[k]) !== Math.sign(e9[k - 1] - e20[k - 1])) cross = true;
      let vcross = false;
      for (let k = L - 3; k <= L; k++) if (Math.sign(v[k].c - vw[k]) !== Math.sign(v[k - 1].c - vw[k - 1])) vcross = true;
      res.reversal = cross || vcross;
      const lvls = [o.h, o.l, data.prevClose, Math.max(...v.slice(PRIOR).map((c) => c.h)), Math.min(...v.slice(PRIOR).map((c) => c.l))];
      res.level = m > 15 && lvls.some((p) => Math.abs(v[L].c - p) < atr * 0.6);
      const mv = v[L].c - v[L - 3].o;
      res.momentum = Math.abs(mv) > atr * 1.5 && last.slice(1).every((c) => Math.sign(c.c - c.o) === Math.sign(mv)) && ctx.volRatio > 1.1;
      const sl = (i) => (e20[i] != null && e20[i - 5] != null ? e20[i] - e20[i - 5] : 0);
      let tc = false;
      for (let k = L - 10; k <= L; k++) if (Math.sign(sl(k)) !== Math.sign(sl(k - 1)) && Math.abs(sl(k - 1)) > atr * 0.05) tc = true;
      res.trendChange = tc;
      const key = { breakout: 'breakout', pullback: 'pullback', reversal: 'reversal', level: 'level', momentum: 'momentum', trend: 'trendChange' }[kind];
      const seen = Object.keys(res).filter((k) => res[k] === true).map((k) => ({ breakout: 'a breakout', pullback: 'a pullback', reversal: 'a VWAP/EMA cross (possible reversal)', level: 'price at a key level', momentum: 'momentum', trendChange: 'a trend change' }[k]));
      const expl = {
        breakout: 'Price just pushed through a recent high/low or the opening range.',
        pullback: `The trend is ${ctx.trend} and price pulled back to the EMA 20 / VWAP area.`,
        reversal: 'EMA 9 crossed EMA 20 or price crossed VWAP in the last few minutes — control is shifting.',
        level: 'Price is testing an important level (opening range, prior close, or high/low of day).',
        momentum: 'Several same-colour candles moved more than 1.5 ATR on above-average volume.',
        trend: 'The slope of the EMA 20 has just flipped direction.',
      }[kind];
      return { ok: !!res[key], why: res[key] ? expl : seen.length ? `Right now I see: ${seen.join(', ')}. EMA-20 trend: <b>${ctx.trend}</b>.` : `Nothing clear right now — EMA-20 trend is <b>${ctx.trend}</b>. Sometimes the right call is "nothing to do".` };
    }

        <div class="ds-grid">

            <div class="card ds-identify"><b>Identify what you see</b> <span class="muted small">(${sess.idOk}/${sess.idTry} correct)</span><div class="tg-row">${[

              <label class="fld"><span id="ds-sizel">Risk % of bankroll</span><input type="number" step="any" id="ds-sizev" value="1"></label>

      chart = new TM.Chart(el.querySelector('#ds-chart'), { height: window.innerWidth < 700 ? 300 : 400, overlays: { vwap: true, ema9: true }, panes: [], symbol: sess.sym, fitBars: 140, onLineDrag: onDrag });
      chart.setData(view(), { fit: true, fitBars: 150 });

    let sizeMode = 'risk';
    function bind() {

      U.on($('.ds-identify'), 'click', '.tg', (e, b) => {
        const r = detect(b.dataset.id);
        sess.idTry++;
        const fbx = $('#ds-idfb');
        fbx.className = 'w-fb show ' + (r.ok ? 'fb-ok' : 'fb-bad');
        fbx.innerHTML = (r.ok ? '✓ Yes! ' : '✕ Not quite. ') + r.why;
        if (r.ok) {
          sess.idOk++;
          sess.ids[b.dataset.id]++;

        }

        TM.Store.save();
      });
      U.on($('#ds-size'), 'click', 'button', (e, b) => {
        sizeMode = b.dataset.v;
        U.$$('#ds-size button', el).forEach((x) => x.classList.toggle('on', x === b));

        $('#ds-sizev').value = sizeMode === 'risk' ? 1 : 100;

      });
      ['#ds-sizev', '#ds-stop', '#ds-tp'].forEach((q) => ($(q).oninput = () => (calc(), lines())));
      $('#ds-sug').onclick = () => {
        const v = view();
        const ctx = TM.Market.context(v);
        const lows = v.slice(-8).map((c) => c.l),
          highs = v.slice(-8).map((c) => c.h);
        const p = lastPrice();
        // suggest beyond the recent swing, assume long if above VWAP else short
        const vw = TM.Ind.vwap(v);
        const long = p >= vw[vw.length - 1];
        $('#ds-stop').value = U.round(long ? Math.min(...lows) - ctx.atr * 0.3 : Math.max(...highs) + ctx.atr * 0.3, 2);
        feed(`Suggested a stop beyond the last 8 minutes’ ${long ? 'low' : 'high'} plus a small ATR buffer (assumes a ${long ? 'long, price above' : 'short, price below'} VWAP).`, 'coach');
