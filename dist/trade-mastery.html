        const p = lastPrice(),
          st = +$('#ds-stop').value;
        if (!st) return U.toast('Set a stop first.', 'info');
        $('#ds-tp').value = U.round(p + (p - st) * 2, 2);
        calc();
        lines();
      };
      $('#ds-buy').onclick = () => enter('long');
      $('#ds-short').onclick = () => enter('short');
    }
    function tkSpec(side) {
      const $ = (q) => el.querySelector(q);
      const p = lastPrice();
      const entry = side === 'long' ? p + 0.01 : p - 0.01;
      const stop = +$('#ds-stop').value || null;
      const target = +$('#ds-tp').value || null;
      const eq = TM.Trading.equity(sess.acct, () => p);
      let qty = 0;
      const v = +$('#ds-sizev').value || 0;
      let capped = false;
      if (sizeMode === 'qty') qty = Math.floor(v);
      else if (stop) {
        qty = Math.floor((eq * v) / 100 / Math.abs(entry - stop));
        const maxQ = Math.floor((sess.acct.cash * 0.995) / entry);
        if (qty > maxQ) {
          qty = maxQ;
          capped = true;
        }
      }
      return { sym: sess.sym, side, qty, entry, stop, target, lev: 1, mode: 'day', feeRate: 0, equity: eq, capped };
    }
    function calc() {
      const box = el.querySelector('.ds-calc');
      if (!box) return;
      const p = lastPrice();
      const st = +el.querySelector('#ds-stop').value;
      const side = st && st > p ? 'short' : 'long';
      const sp = tkSpec(side);
      const chk = TM.Trading.check(sess.acct, sp, sp.equity);
      box.innerHTML = `${sp.capped ? '<span class="warn-t">Size capped by buying power (very tight stop).</span><br>' : ''}${st ? `Stop is ${st < p ? 'below' : 'above'} price → this is a <b>${side.toUpperCase()}</b> setup.<br>` : ''}Size: <b>${sp.qty || '—'}</b> shares · value ${U.money(chk.calc.notional)}<br>Risk: ${chk.calc.risk != null ? `<b>${U.money(chk.calc.risk)}</b> (${chk.calc.riskPct.toFixed(2)}%)` : '<b class="down">no stop</b>'} · R:R ${chk.calc.rr != null ? chk.calc.rr.toFixed(2) : '—'}`;
    }
    function lines() {
      if (!chart) return;
      const L = [];
      const o = minute() >= 15 ? orRange() : null;
      if (o) {
        L.push({ price: o.h, color: 'rgba(77,141,255,.6)', label: 'OR H', dash: [2, 4], noFit: true }, { price: o.l, color: 'rgba(77,141,255,.6)', label: 'OR L', dash: [2, 4], noFit: true });
      }
      L.push({ price: data.prevClose, color: 'rgba(160,170,190,.5)', label: 'Prev close', dash: [2, 6], noFit: true });
      sess.acct.positions.forEach((p) => {
        L.push({ id: 'e', price: p.entry, color: '#4d8dff', label: p.side === 'long' ? 'LONG' : 'SHORT' });
        if (p.stop) L.push({ id: 's', price: p.stop, color: '#f0465a', label: 'SL', draggable: true });
        if (p.target) L.push({ id: 't', price: p.target, color: '#16c784', label: 'TP', draggable: true });
      });
      if (!sess.acct.positions.length) {
        const st = +el.querySelector('#ds-stop').value,
          tp = +el.querySelector('#ds-tp').value;
        if (st) L.push({ id: 'ps', price: st, color: 'rgba(240,70,90,.6)', label: 'SL?', draggable: true });
        if (tp) L.push({ id: 'pt', price: tp, color: 'rgba(22,199,132,.6)', label: 'TP?', draggable: true });
      }
      chart.setLines(L);
      const marks = [];
      sess.tradeIds.forEach((id) => {
        const t = s.trades.find((x) => x.id === id);
        if (!t) return;
        marks.push({ i: t.openedBar, kind: t.side === 'long' ? 'buy' : 'sell', text: t.side === 'long' ? 'B' : 'S' });
        marks.push({ i: t.closedBar, kind: 'dot', price: t.exit, color: t.pnl >= 0 ? '#16c784' : '#f0465a' });
      });
      sess.acct.positions.forEach((p) => marks.push({ i: p.openedBar, kind: p.side === 'long' ? 'buy' : 'sell', text: p.side === 'long' ? 'B' : 'S' }));
      chart.setMarkers(marks);
    }
    function onDrag(id, price, final) {
      const p = U.round(price, 2);
      if (id === 'ps') el.querySelector('#ds-stop').value = p;
      if (id === 'pt') el.querySelector('#ds-tp').value = p;
      if ((id === 's' || id === 't') && final) {
        const pos = sess.acct.positions[0];
        const px = lastPrice();
        if (pos) {
          const f = id === 's' ? 'stop' : 'target';
          const bad = f === 'stop' ? (pos.side === 'long' ? p >= px : p <= px) : pos.side === 'long' ? p <= px : p >= px;
          if (bad) U.toast('That level is on the wrong side of the current price.', 'bad');
          else TM.Trading.modify(pos, f, p);
          TM.Store.save();
        }
      }
      if (final) lines();
      calc();
      renderPos();
    }
    function enter(side) {
      if (sess.acct.positions.length) return U.toast('One position at a time in the day simulator. Manage or close your current trade first.', 'info');
      if (minute() >= 389) return U.toast('The session is closing.', 'info');
      const sp = tkSpec(side);
      if (sizeMode === 'risk' && !sp.stop) return U.toast('Risk % sizing needs a stop-loss. Set one (or tap "suggest").', 'bad');
      const chk = TM.Trading.check(sess.acct, sp, sp.equity);
      if (!chk.ok) return U.toast(chk.errors[0], 'bad');
      if (!(sp.qty > 0)) return U.toast('Position size is zero. Check the stop and size.', 'bad');
      const v = view();
      const vw = TM.Ind.vwap(v);
      const o = orRange();
      const m = minute();
      const meta = { phase: phase(m), minute: m, vwapSide: Math.sign(sp.entry - vw[vw.length - 1]), breakout: m > 15 && ((side === 'long' && sp.entry > o.h) || (side === 'short' && sp.entry < o.l)) };
      const pos = TM.Trading.open(sess.acct, Object.assign({}, sp, { ctx: TM.Market.context(v), bar: v.length - 1, t: v[v.length - 1].t, meta }));
      feed(`${side === 'long' ? 'Bought' : 'Shorted'} <b>${pos.qty}</b> @ ${U.price(pos.entry)}${pos.stop ? ` · stop ${U.price(pos.stop)}` : ' · <b class="down">no stop</b>'}${pos.target ? ` · target ${U.price(pos.target)}` : ''}`, side === 'long' ? 'good' : 'bad');
      if (chk.warnings.length) feed('⚠ ' + chk.warnings.join(' '), 'warn');
      U.sound('fill');
      if (meta.phase === 'Midday' && s.settings.hints) feed('Note: midday entries face lower volume and more false moves.', 'coach');
      TM.Store.save();
      lines();
      renderPos();
    }
    function renderPos() {
      const box = el.querySelector('.ds-pos');
      if (!box) return;
      const p = sess.acct.positions[0];
      const px = lastPrice();
      const eq = TM.Trading.equity(sess.acct, () => px);
      const pnl0 = eq - 10000;
      el.querySelector('.ds-acct').innerHTML = `<div class="kv"><span>Session bankroll</span><b class="mono">${U.money(eq)}</b></div><div class="kv"><span>Session P&L</span><b class="mono ${U.cls(pnl0)}">${U.smoney(pnl0)}</b></div><div class="kv"><span>Trades</span><b class="mono">${sess.tradeIds.length}${sess.tradeIds.length > 6 ? ' <span class="down">(overtrading?)</span>' : ''}</b></div>`;
      if (!p) {
        box.innerHTML = '<p class="muted small">No open position. One trade at a time.</p>';
        return;
      }
      const pnl = TM.Trading.pnl(p, px);
      const r = p.riskPlanned ? pnl / p.riskPlanned : null;
      box.innerHTML = `<div class="pos-card ${p.side}"><div><b>${p.side.toUpperCase()} ${p.qty}</b> @ ${U.price(p.entry)}</div><div class="mono big ${U.cls(pnl)}">${U.smoney(pnl)} ${r != null ? `<small>(${r >= 0 ? '+' : ''}${r.toFixed(2)}R)</small>` : ''}</div><div class="small muted">Stop ${p.stop ? U.price(p.stop) : '—'} · Target ${p.target ? U.price(p.target) : '—'} · drag lines to adjust</div><div class="btn-row"><button class="btn btn-sm btn-ghost" id="ds-be">Stop → breakeven</button><button class="btn btn-sm" id="ds-close">Close position</button></div></div>`;
      box.querySelector('#ds-close').onclick = () => closePos('manual');
      box.querySelector('#ds-be').onclick = () => {
        if ((p.side === 'long' && px <= p.entry) || (p.side === 'short' && px >= p.entry)) return U.toast('Only possible once the trade is in profit.', 'info');
        TM.Trading.modify(p, 'stop', p.entry);
        feed('Stop moved to breakeven.', 'info');
        lines();
        renderPos();
      };
    }
    function closePos(reason, price) {
      const p = sess.acct.positions[0];
      if (!p) return;
      const px = price != null ? price : lastPrice() + (p.side === 'long' ? -0.01 : 0.01);
      const v = view();
      const t = TM.Trading.close(sess.acct, p, px, reason, { bar: v.length - 1, t: v[v.length - 1].t });
      handleClosed([t]);
    }
    function handleClosed(trades) {
      if (!trades.length) return Promise.resolve();
      const wasPlaying = !paused;
      setSpeed(0, true);
      modalOpen = true;
      let chain = Promise.resolve();
      trades.forEach((t) => {
        sess.tradeIds.push(t.id);
        // follow-through: did price reach the target within the next 30 bars?
        const fut = data.all.slice(sess.bar + 1, sess.bar + 31);
        const hitTarget = t.target ? fut.some((c) => (t.side === 'long' ? c.h >= t.target : c.l <= t.target)) : false;
        feed(`Closed (${t.exitReason}) @ ${U.price(t.exit)} · <b class="${U.cls(t.pnl)}">${U.smoney(t.pnl)}</b>`, t.pnl >= 0 ? 'good' : 'bad');
        chain = chain.then(() => TM.Progress.afterTrade(t, { review: { followThrough: { hitTarget } } }));
      });
      TM.Store.save();
      lines();
      renderPos();
      return chain.then(() => {
        modalOpen = false;
        if (wasPlaying && sess && !sess.done) setSpeed(sess.lastSpeed || 1);
      });
    }
    function setSpeed(v, keepLast) {
      if (!keepLast && v > 0) sess.lastSpeed = v;
      if (v > 0 && !keepLast) sess.lastSpeed = v;
      paused = v === 0;
      clearInterval(timer);
      timer = null;
      U.$$('#ds-speed button', el).forEach((b) => b.classList.toggle('on', +b.dataset.v === v));
      if (!paused) timer = setInterval(() => step(v), 110);
    }
    function step(times = 1) {
      for (let k = 0; k < times; k++) {
        if (modalOpen || sess.done) return;
        advanceTick();
      }
      tickUI();
    }
    function advanceTick() {
      const cur = data.all[sess.bar];
      if (!cur) {
        sess.done = true;
        return endSession();
      }
      sess.tick++;
      const k = Math.min(sess.tick, cur.ticks.length - 1);
      const px = cur.ticks[k];
      if (sess.acct.positions.length) {
        const closed = TM.Trading.process(sess.acct, sess.sym, { h: px, l: px, c: px, o: px }, { bar: sess.bar, t: cur.t });
        if (closed.length) handleClosed(closed);
      }
      if (sess.tick >= cur.ticks.length) {
        sess.tick = 0;
        sess.bar++;
        detectEvents();
        if (minute() >= 389) {
          sess.done = true;
          let pr = Promise.resolve();
          if (sess.acct.positions.length) {
            const last = data.all[sess.bar - 1];
            const t = TM.Trading.close(sess.acct, sess.acct.positions[0], last.c, 'session-end', { bar: sess.bar - 1, t: last.t });
            pr = handleClosed([t]);
          }
          pr.then(() => setTimeout(() => endSession(), 200));
          return;
        }
        if (sess.bar % 10 === 0) TM.Store.save();
      }
    }
    function fastForward(mins) {
      if (sess.done) return;
      const target = Math.min(PRIOR + 389, sess.bar + mins);
      let guard = 0;
      while (sess.bar < target && !modalOpen && !sess.done && guard++ < 10000) advanceTick();
      tickUI();
    }
    function tickUI() {
      if (!chart) return;
      chart.setData(view());
      const m = Math.max(0, minute());
      const cur = data.all[Math.min(sess.bar, data.all.length - 1)];
      el.querySelector('#ds-time').textContent = U.hm(cur.t);
      el.querySelector('#ds-phase').textContent = phase(m);
      el.querySelector('#ds-mark').style.left = (m / 390) * 100 + '%';
      if (sess.tick === 1 || sess.tick === 0) lines();
      renderPos();
      if (sess.tick % 3 === 0) calc();
    }
    function renderFeed() {
      const ul = el.querySelector('#ds-feed');
      if (!ul) return;
      ul.innerHTML = sess.feed.map((f) => `<li class="fd-${f.kind}"><span class="mono muted">${f.t}</span> ${f.msg}</li>`).join('') || '<li class="muted">Session events and coach notes appear here.</li>';
    }
    function endSession() {
      if (sess.summarised) return;
      sess.summarised = true;
      sess.done = true;
      setSpeed(0, true);
      if (sess.acct.positions.length) {
        const last = data.all[Math.min(sess.bar, data.all.length - 1)];
        const t = TM.Trading.close(sess.acct, sess.acct.positions[0], last.c, 'session-end', { bar: sess.bar, t: last.t });
        sess.tradeIds.push(t.id);
        TM.Progress.recordTrade(t);
      }
      const trades = sess.tradeIds.map((id) => s.trades.find((x) => x.id === id)).filter(Boolean);
      const pnl = sess.acct.cash - 10000;
      const avg = trades.length ? trades.reduce((a, t) => a + t.review.score, 0) / trades.length : null;
      const grade = avg == null ? '—' : avg >= 90 ? 'A' : avg >= 78 ? 'B' : avg >= 62 ? 'C' : avg >= 45 ? 'D' : 'F';
      const notes = [];
      if (!trades.length) notes.push('You took no trades. That is fine if nothing met your rules — but try at least one planned trade next time to practise execution.');
      if (trades.length > 6) notes.push(`You took <b>${trades.length}</b> trades. That is a lot for one session — overtrading usually lowers quality.`);
      const mid = trades.filter((t) => t.meta && t.meta.phase === 'Midday').length;
      if (mid >= 2) notes.push(`<b>${mid}</b> trades were in the midday lull, the lowest-quality part of the day.`);
      const noStop = trades.filter((t) => !t.origStop).length;
      if (noStop) notes.push(`<b>${noStop}</b> trade(s) without a stop-loss.`);
      if (sess.type === 'range' && trades.length >= 3) notes.push('This was a choppy range day. The best traders recognise chop early and step aside.');
      if (!notes.length) notes.push('Clean, disciplined session. Keep doing exactly this.');
      // XP: completion + discipline + recognition (never P&L)
      const goodT = trades.filter((t) => t.review.score >= 78).length;
      const xp = 50 + Math.min(50, goodT * 10) + Math.min(30, sess.idOk * 5) - (trades.length > 6 ? 30 : 0);
      s.counters.daySessions++;
      s.day.history = (s.day.history || []).concat([{ sym: sess.sym, type: sess.type, pnl, trades: trades.length, grade, at: Date.now() }]).slice(-30);
      s.day.week = (s.day.week || []).concat([pnl]);
      let weekMsg = `Week progress: ${s.day.week.length}/5 sessions (${U.smoney(s.day.week.reduce((a, b) => a + b, 0))}).`;
      if (s.day.week.length >= 5) {
        const wk = s.day.week.reduce((a, b) => a + b, 0);
        if (wk > 0) {
          s.counters.greenWeeks++;
          weekMsg = `🎉 <b>Green week!</b> Five sessions totalling <b class="up">${U.smoney(wk)}</b>.`;
        } else weekMsg = `Week complete: ${U.smoney(wk)}. A losing week with good process is still progress — review your journal.`;
        s.day.week = [];
      }
      const T = TYPES[sess.type];
      s.day.session = null;
      TM.Store.save();
      TM.Progress.addXP(Math.max(20, xp), 'Day-trading session complete');
      TM.Progress.goal('day');
      TM.Progress.checkAchievements();
      const ids = Object.entries(sess.ids).filter(([, n]) => n).map(([k, n]) => `${k} ×${n}`).join(', ') || 'none';
      const body = U.el(`<div class="eod">
        <div class="eod-top"><div><div class="eyebrow">Day type revealed</div><h3>${T.name}</h3><p>${T.desc}</p></div><div class="rv-grade g-${grade}">${grade}<small>avg process</small></div></div>
        <div class="eod-stats"><div><span>Session P&L</span><b class="mono ${U.cls(pnl)}">${U.smoney(pnl)}</b></div><div><span>Trades</span><b class="mono">${trades.length}</b></div><div><span>Patterns identified</span><b class="mono">${sess.idOk}/${sess.idTry}</b></div><div><span>XP</span><b class="mono xp">+${Math.max(20, xp)}</b></div></div>
        <div id="eod-chart"></div>
        <h4>Coach notes</h4><ul class="bul">${notes.map((n) => `<li>${n}</li>`).join('')}</ul>
        <p class="small muted">Identified: ${ids}. ${weekMsg}</p></div>`);
      const md = U.modal({ title: 'End-of-day report', body, wide: true, actions: [{ label: 'Back to lobby', cls: 'btn-ghost' }, { label: 'Next trading day →', cls: 'btn-primary' }], onClose: () => (sess = null, lobby()) });
      const ch = new TM.Chart(body.querySelector('#eod-chart'), { height: 260, overlays: { vwap: true }, symbol: '', fitBars: 400, interactive: false, zoomButtons: false });
      ch.setData(data.all.slice(PRIOR - 30), { fit: true, fitBars: 425 });
      ch.setMarkers(
        trades.flatMap((t) => [
          { i: t.openedBar - PRIOR + 30, kind: t.side === 'long' ? 'buy' : 'sell' },
          { i: t.closedBar - PRIOR + 30, kind: 'dot', price: t.exit, color: t.pnl >= 0 ? '#16c784' : '#f0465a' },
        ])
      );
      const oc = md.close;
      md.close = () => {
        ch.destroy();
        oc();
      };
      if (chart) {
        chart.destroy();
        chart = null;
      }
    }

    function play() {
      data = genDay(sess);
      render();
      lines();
      calc();
      if (!sess.feed.length) {
        feed(`Pre-market: <b>${sess.sym}</b> ${sess.cat.toLowerCase()} (${U.pct(sess.gap * 100)}). The opening bell rings at 9:30. Watch the first 15 minutes form the opening range.`, 'coach');
        feed('Tip: decide your stop BEFORE you click buy. Use "suggest" if unsure.', 'coach');
      }
      setSpeed(0, true);
      U.$$('#ds-speed button', el).forEach((b) => b.classList.toggle('on', b.dataset.v === '0'));
      U.toast('Press 1× to start the session.', 'info');
      TM.Coach.setContext({
        view: 'day',
        label: 'Day trading sim',
        hint: () => {
          const v = view();
          const ctx = TM.Market.context(v);
          const vw = TM.Ind.vwap(v);
          const above = v[v.length - 1].c > vw[vw.length - 1];
          return `It is ${phase(minute())} session. Price is <b>${above ? 'above' : 'below'} VWAP</b>, EMA-20 trend is <b>${ctx.trend}</b>, ATR ${U.price(ctx.atr)}. ${phase(minute()) === 'Midday' ? 'Midday: lower quality, consider waiting.' : above ? 'Longs on pullbacks to VWAP/EMA 9 align with buyers.' : 'Shorts on rallies into VWAP align with sellers.'}`;
        },
      });
    }

    if (sess && !sess.done) play();
    else lobby();
    return {
      destroy() {
        clearInterval(timer);
        if (chart) chart.destroy();
        destroyers.forEach((f) => f());
        TM.Store.save();
      },
    };
  };
})();

/* TRADE MASTERY — Section 4: Swing Trading Simulator.
   An 8-week (40 trading day) campaign on daily charts with overnight gaps, earnings and market news. */
(function () {
  'use strict';
  const U = TM.U;
  const S = () => TM.Store.s;
  const HIST = 120;
  const DAYS = 40;

    { sym: 'NMBS', name: 'Nimbus Cloud', sector: 'Technology', start: 74, vol: 0.019 },
    { sym: 'MDVX', name: 'Medivex Pharma', sector: 'Healthcare', start: 41, vol: 0.016 },
    { sym: 'SOLQ', name: 'Solquest Power', sector: 'Energy', start: 28, vol: 0.018 },
    { sym: 'ATLQ', name: 'Atlaq Industrial', sector: 'Industrials', start: 112, vol: 0.013 },
  ];
  const MKT_NEWS = [
    { t: 'Central bank raises interest rates unexpectedly', g: -0.022 },
    { t: 'Inflation report comes in cooler than expected', g: 0.016 },
    { t: 'Strong jobs report lifts the whole market', g: 0.012 },
    { t: 'Global growth scare hits stocks worldwide', g: -0.018 },
  ];
  const SECTOR_NEWS = {
    Technology: [['Major cloud contract win announced', 0.035], ['Regulators open an antitrust probe', -0.04]],
    Healthcare: [['Drug trial shows strong results', 0.06], ['FDA delays approval decision', -0.05]],
    Energy: [['Oil prices spike on supply cuts', 0.03], ['Oil slumps as demand outlook weakens', -0.032]],
    Industrials: [['Record order backlog reported', 0.025], ['Factory strike disrupts production', -0.03]],
  };
  const QUIET = ['Quiet session, light volume', 'Markets drift ahead of key data', 'Mixed trading as investors wait', 'Calm day across sectors', 'Sector rotation keeps indexes flat'];

  /* deterministic campaign generation */
  function generate(seed) {
    const r = U.rng(seed);
    const total = HIST + DAYS;
    const t0 = Date.UTC(2026, 0, 5) / 1000;
    // trading days (skip weekends)
    const days = [];
    let t = t0;
    while (days.length < total) {
      const dw = new Date(t * 1000).getUTCDay();
      if (dw !== 0 && dw !== 6) days.push(t);
      t += 86400;
    }
    // market-wide events during the campaign
    const events = {};
    const mk = U.shuffle(MKT_NEWS, r).slice(0, 2);
    mk.forEach((n, k) => (events['M' + (HIST + 6 + k * 17 + Math.floor(r() * 6))] = n));
    const stocks = UNIVERSE.map((u, k) => {
      const er = HIST + 6 + Math.floor(r() * 30);
      const beat = r() < 0.55;
      const earnGap = (beat ? 1 : -1) * (0.04 + r() * 0.09);
      const sn = SECTOR_NEWS[u.sector][Math.floor(r() * 2)];
      let snDay = HIST + 3 + Math.floor(r() * 34);
      if (Math.abs(snDay - er) < 3) snDay = Math.min(HIST + DAYS - 2, er + 4);
      const regimes = ['up', 'up', 'range', 'down', 'up-pull'];
      let p = u.start * (0.85 + r() * 0.3);
      const candles = [];
      let reg = null,
        left = 0,
        drift = 0,
        post = 0,
        postDir = 0;
      for (let i = 0; i < total; i++) {
        if (left <= 0) {
          reg = U.pick(regimes, r);
          left = 10 + Math.floor(r() * 25);
          drift = reg === 'up' ? u.vol * 0.28 : reg === 'down' ? -u.vol * 0.24 : reg === 'up-pull' ? u.vol * 0.12 : 0;
        }
        left--;
        let gap = U.gauss(r) * u.vol * 0.25;
        let vm = 1;
        let ev = null;
        if (i === er) {
          gap = earnGap;
          vm = 3.5;
          ev = { kind: 'earn', t: `${u.sym} earnings ${beat ? 'BEAT' : 'MISS'} expectations — stock ${beat ? 'gaps up' : 'gaps down'} ${U.pct(earnGap * 100, 1)}`, g: earnGap };
          post = 5;
          postDir = Math.sign(earnGap);
        }
        if (i === snDay) {
          gap += sn[1];
          vm = 2.4;
          ev = { kind: 'news', t: `${u.sym}: ${sn[0]}`, g: sn[1] };
        }
        const m = events['M' + i];
        if (m) {
          gap += m.g * (0.7 + 0.6 * r());
          vm = Math.max(vm, 1.8);
        }
        if (post > 0) {
          drift += postDir * u.vol * 0.08;
          post--;
          if (!post) drift = 0;
        }
        const o = p * (1 + gap);
        p = o;
        let h = o,
          l = o;
        const ticks = 8;
        let absr = 0;
        for (let k2 = 0; k2 < ticks; k2++) {
          const ret = drift / ticks + (u.vol / Math.sqrt(ticks)) * U.gauss(r);
          absr += Math.abs(ret);
          p *= Math.exp(ret);
          h = Math.max(h, p);
          l = Math.min(l, p);
        }
        const v = Math.round(2e6 * vm * (0.6 + (absr / u.vol) * 0.4) * Math.exp(U.gauss(r) * 0.2));
        candles.push({ t: days[i], o, h, l, c: p, v, ev });
      }
      return Object.assign({}, u, { candles, earnDay: er, beat });
    });
    return { stocks, events, days };
  }

        return `<div class="small ${dd > 0 && dd <= 3 ? 'warn-t' : 'muted'}">${x.sym}: ${dd > 0 ? 'in ' + dd + ' day' + (dd > 1 ? 's' : '') : dd === 0 ? 'TODAY' : 'reported'}</div>`;
      }).join('');
      const c = st.candles[i];
      const d = st.candles.slice(0, i + 1);
      const ctx = TM.Market.context(d);
      el.querySelector('#sw-head').innerHTML = `<b class="big">${st.sym}</b> <span class="muted">${st.name}</span> <span class="pill">${st.sector}</span> <span class="sim-tag">SIM</span> <span class="mono">${U.price(c.c)}</span> <span class="small muted">· trend ${ctx.trend} · ATR ${U.price(ctx.atr)} · RSI ${ctx.rsi ? ctx.rsi.toFixed(0) : '–'}</span>`;
      chart.o.symbol = st.sym;
      chart.setData(d, { fit: !!fit, fitBars: 100 });
      el.querySelector('#sw-news').innerHTML = camp.news.map((n) => `<li class="fd-${n.kind}"><span class="mono muted">D${n.d}</span> ${n.t}</li>`).join('') || '<li class="muted">News will appear as the days pass.</li>';
      el.querySelector('#sw-next').disabled = el.querySelector('#sw-week').disabled = camp.day >= DAYS - 1;
      renderPos();
      lines();
      calc();
    }
    function finish() {
      if (!camp) return;
      const i = idx();
      camp.acct.positions.slice().forEach((p) => {
        const t = TM.Trading.close(camp.acct, p, priceOf(p.sym), 'manual', { bar: i, t: G.stocks[0].candles[i].t });
        camp.tradeIds.push(t.id);
        TM.Progress.recordTrade(t);
      });
      const e = camp.acct.cash;
      const ret = (e / 10000 - 1) * 100;
      const trades = camp.tradeIds.map((id) => s.trades.find((x) => x.id === id)).filter(Boolean);
      const avg = trades.length ? trades.reduce((a, t) => a + t.review.score, 0) / trades.length : null;
      const grade = avg == null ? '—' : avg >= 90 ? 'A' : avg >= 78 ? 'B' : avg >= 62 ? 'C' : avg >= 45 ? 'D' : 'F';
      const bench = G.stocks.reduce((a, st) => a + (st.candles[i].c / st.candles[HIST].c - 1) * 100, 0) / G.stocks.length;
      const xp = 75 + Math.min(75, trades.filter((t) => t.review.score >= 78).length * 15);
      s.counters.swingCampaigns++;
      s.swing.history = (s.swing.history || []).concat([{ ret, trades: trades.length, grade, at: Date.now() }]).slice(-20);
      s.swing.campaign = null;
      TM.Store.save();
      TM.Progress.addXP(xp, 'Swing campaign complete');
      TM.Progress.checkAchievements();
      U.modal({
        title: 'Campaign report',
        wide: true,
        body: `<div class="eod"><div class="eod-stats"><div><span>Return</span><b class="mono ${U.cls(ret)}">${U.pct(ret)}</b></div><div><span>Buy & hold (avg of 4)</span><b class="mono ${U.cls(bench)}">${U.pct(bench)}</b></div><div><span>Max drawdown</span><b class="mono">${camp.maxDD.toFixed(1)}%</b></div><div><span>Trades</span><b class="mono">${trades.length}</b></div><div><span>Avg process</span><b class="grade g-${grade}">${grade}</b></div><div><span>XP</span><b class="mono xp">+${xp}</b></div></div>
          <ul class="bul">${[
            trades.length ? '' : '<li>No trades this campaign. Patience is good — but practise executing at least a few planned setups.</li>',
            trades.some((t) => t.exitReason === 'gap-stop') ? '<li>At least one stop was <b>gapped through</b>. That is why swing traders size smaller into earnings and news.</li>' : '',
            trades.filter((t) => t.closedBar - t.openedBar <= 2 && t.exitReason === 'manual' && t.pnl < 0).length >= 2 ? '<li>Several quick manual exits for small losses. Swing trades need room — were those emotional exits?</li>' : '',
            ret > bench ? '<li>You outperformed simply holding the four stocks. Nice work managing risk.</li>' : '<li>Buy & hold beat your trading this time. That happens! Focus on process quality and the results follow over many campaigns.</li>',
          ].join('')}</ul></div>`,
        actions: [{ label: 'Close', cls: 'btn-primary' }],
        onClose: () => {
          camp = null;
          if (chart) {
            chart.destroy();
            chart = null;
          }
          lobby();
        },
      });
    }
    function play() {
      G = generate(camp.seed);
      sel = 0;
      render();
      if (!camp.news.length) {
        news('Campaign started. Study the daily charts: which stocks are trending? Where are the pullbacks? Check the earnings calendar before entering.', 'coach');
        refresh();
      }
      TM.Coach.setContext({
        view: 'swing',
        label: 'Swing trading sim',
        hint: () => {
          const st = stock();
          const d = st.candles.slice(0, idx() + 1);
          const ctx = TM.Market.context(d);
          const dd = st.earnDay - idx();
          return `${st.sym}: daily trend <b>${ctx.trend}</b>, price ${ctx.price > ctx.ema20 ? 'above' : 'below'} the EMA 20, ATR ${U.price(ctx.atr)}. ${dd > 0 && dd <= 5 ? `<b>Earnings in ${dd} days</b> — size down or wait.` : ''} Swing setups: pullback to a rising EMA 20 in an uptrend, stop below the swing low.`;
        },
      });
    }
    if (camp) play();
    else lobby();
    return {
      destroy() {
        if (chart) chart.destroy();
        TM.Store.save();
      },
    };
  };
})();

(function () {

  function autoMistakes(t) {

    if (t.ctx && ((t.side === 'long' && t.ctx.trend === 'down') || (t.side === 'short' && t.ctx.trend === 'up'))) m.push('Against the trend');

      });
      const fixes = {

        'Position too big': '4-2',

        'Chased the entry': '3-4',
        'Revenge trade': '4-5',

/* TRADE MASTERY — Section 6: Realistic Market Scenarios */
(function () {
  'use strict';
  const U = TM.U;
  const S = () => TM.Store.s;

  TM.Views.scenarios = function (el, id) {
    const s = S();
    if (id) return play(el, id);
    el.innerHTML = `
      <div class="page-head"><div><h2>Market Scenarios</h2><p class="muted">Realistic situations that trip up real traders. Each scenario reveals the chart step by step and asks you to make several decisions. Every choice is explained — and scored on <b>process</b>, not luck.</p></div></div>
      <div class="scen-grid">${TM.Scenarios.list
        .map((sc) => {
          const r = s.scenarios[sc.id];
          return `<a class="card scen ${r ? 'done' : ''}" href="#scenario-${sc.id}"><div class="scen-h"><span class="scen-l">${sc.id}</span><span class="pill">${sc.tag}</span><span class="diff">${'●'.repeat(sc.diff)}${'○'.repeat(3 - sc.diff)}</span></div><h3>${sc.title}</h3><p class="muted small">${sc.blurb}</p><div class="scen-f">${r ? `<span class="${r.best >= 70 ? 'up' : ''}">Best ${r.best}%</span><span class="muted small">${r.count}× played</span>` : '<span class="muted small">Not played yet</span>'}<span class="btn btn-sm ${r ? 'btn-ghost' : 'btn-primary'}">${r ? 'Replay' : 'Start'} →</span></div></a>`;
        })
        .join('')}</div>`;
  };

  function play(el, id) {
    const sc = TM.Scenarios.byId(id);
    if (!sc) {
      location.hash = '#scenarios';
      return;
    }
    el.innerHTML = `<div class="lesson-top"><a class="btn btn-ghost btn-sm" href="#scenarios">← All scenarios</a><div class="lt-t"><div class="eyebrow">Scenario ${sc.id} · ${sc.tag}</div><h2>${sc.title}</h2></div></div><div class="card scen-play"></div>`;
    const box = el.querySelector('.scen-play');
    const w = TM.W.scenario(box, sc, (r) => {
      const s = S();
      const prev = s.scenarios[id];
      const first = !prev;
      s.scenarios[id] = { best: Math.max(prev ? prev.best : 0, r.score), count: (prev ? prev.count : 0) + 1, last: r.score };
      if (first) s.counters.scenariosDone++;
      TM.Store.save();
      const xp = first ? 50 + Math.round(r.score) : prev && r.score > prev.best ? Math.round((r.score - prev.best) / 2) : 0;
      if (xp) TM.Progress.addXP(xp, `Scenario ${id}: ${r.score}%`);
      TM.Progress.goal('scenario');
      TM.Progress.checkAchievements();
      const idx = TM.Scenarios.list.findIndex((x) => x.id === id);
      const next = TM.Scenarios.list[idx + 1];
      box.insertAdjacentHTML('beforeend', `<div class="btn-row center"><a class="btn btn-ghost" href="#scenarios">All scenarios</a><button class="btn btn-ghost" id="sc-again">Replay</button>${next ? `<a class="btn btn-primary" href="#scenario-${next.id}">Next: ${next.title} →</a>` : ''}</div>`);
      box.querySelector('#sc-again').onclick = () => TM.route();
    });
    return w;
  }
})();

(function () {
  'use strict';
  const U = TM.U;
  const S = () => TM.Store.s;
  const R = TM.Recipes;

  TM.Views.challenges = function (el) {
    function render() {
      const tiers = ['Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond'];
      el.innerHTML = `
        <div class="page-head"><div><h2>Trading Challenges</h2><p class="muted">Progressively harder goals that reward <b>discipline and skill</b>. None of them reward reckless gambling or trading more for the sake of it.</p></div></div>
        ${tiers
          .map((tier) => {
            const cs = TM.Progress.CH.filter((c) => c.tier === tier);
            return `<h3 class="sec-h tier-${tier.toLowerCase()}">${tier}</h3><div class="grid g3">${cs
              .map((c) => {
                const st = TM.Progress.chState(c);
                return `<section class="card ch ${st.claimed ? 'claimed' : st.done ? 'ready' : ''}"><div class="ch-h"><span class="ch-ic">${c.icon}</span><div><b>${c.title}</b><div class="xp small">+${c.xp} XP</div></div>${st.claimed ? '<span class="pill pill-ok">✓ Complete</span>' : ''}</div><p class="small">${c.desc}</p>
                <div class="xpbar"><i style="width:${(st.cur / st.max) * 100}%"></i></div><div class="small muted">${st.cur} / ${st.max}</div>
                <div class="btn-row">${st.done && !st.claimed ? `<button class="btn btn-primary btn-sm" data-claim="${c.id}">Claim reward</button>` : ''}${!st.claimed && c.drill ? `<button class="btn btn-sm" data-drill="${c.drill}">Play drill →</button>` : ''}${!st.claimed && c.go ? `<a class="btn btn-sm btn-ghost" href="${c.go}">Go →</a>` : ''}<button class="btn btn-sm btn-ghost" data-hint="${c.id}">💡 Hint</button></div></section>`;
              })
              .join('')}</div>`;
          })
          .join('')}`;
    }
    render();
    U.on(el, 'click', 'button', (e, b) => {
      if (b.dataset.claim) {
        TM.Progress.claim(b.dataset.claim);
        render();
        TM.updateTop();
      } else if (b.dataset.drill) drill(b.dataset.drill, render);
      else if (b.dataset.hint) {
        const c = TM.Progress.CH.find((x) => x.id === b.dataset.hint);
        TM.Coach.toggle(true);
        TM.Coach.say(`💡 <b>${c.title}</b>: ${c.hint}`);
      }
    });
    const off = TM.bus.on('progress', U.debounce(render, 300));
    return { destroy: off };
  };

  /* -------- drills -------- */
  const LEVEL_RECIPES = [
    () => ({ d: R.range(U.seed() % 999, 96, 102), levels: [{ price: 96, tol: 0.85, label: 'Support', color: '#16c784' }, { price: 102, tol: 0.85, label: 'Resistance', color: '#f0465a' }], prompt: 'Mark the <b>support</b> OR the <b>resistance</b> of this range.', need: 1 }),
    () => ({ d: R.support(U.seed() % 999), levels: [{ price: 100.8, tol: 0.9, label: 'Support', color: '#16c784' }], prompt: 'Mark the <b>support</b> level that stopped three declines.', need: 1 }),
    () => ({ d: R.resistance(U.seed() % 999), levels: [{ price: 99.4, tol: 0.9, label: 'Resistance', color: '#f0465a' }], prompt: 'Mark the <b>resistance</b> level that stopped three rallies.', need: 1 }),
    () => ({ d: R.range(U.seed() % 999, 47, 50), levels: [{ price: 47, tol: 0.45, label: 'Support', color: '#16c784' }, { price: 50, tol: 0.45, label: 'Resistance', color: '#f0465a' }], prompt: 'Mark the <b>support</b> OR the <b>resistance</b> of this range.', need: 1 }),
  ];
  function drill(kind, after) {
    const body = U.el('<div class="drill"></div>');
    const md = U.modal({ title: kind === 'levels' ? '📏 Level Hunt' : '🕵️ Breakout or Fakeout?', body, wide: true, actions: [{ label: 'Done', cls: 'btn-ghost' }], onClose: () => {
      w && w.destroy && w.destroy();
      TM.Coach.setContext({ view: 'challenges', hint: null, label: 'Trading Challenges' });
      after();
    } });
    let w = null;
    const round = () => {
      if (w && w.destroy) w.destroy();
      body.innerHTML = '';
      if (kind === 'levels') {
        const L = U.pick(LEVEL_RECIPES)();
        body.insertAdjacentHTML('afterbegin', `<p class="muted small">Found so far: <b>${S().counters.srFound}</b> / 5</p>`);
        w = TM.W.level(body, { data: L.d, prompt: L.prompt, levels: () => L.levels, need: L.need, explain: 'Price reversed there repeatedly — traders remember those prices.' }, (r) => {
          if (!r.revealed) {
            TM.Store.inc('srFound');
            TM.Progress.checkAchievements();
          }
          next();
        });
      } else {
        const fake = Math.random() < 0.55;
        const seed = U.seed() % 999;
        const d = fake ? R.fakeout(seed) : R.breakout(seed);
        const res = fake ? 50 : 102;
        const cut = fake ? 41 : 42;
        body.insertAdjacentHTML('afterbegin', `<p class="muted small">Fakeouts identified: <b>${S().counters.fakeoutsFound}</b> / 3 · Look at volume, the wick and the close.</p>`);
        const inner = U.el('<div></div>');
        body.appendChild(inner);
        const C = TM.W.chartIn(inner, { candles: TM.Recipes.build(d).slice(0, cut + 1), lines: [{ price: res, color: '#f0465a', label: 'Resistance' }], rightPad: 8 });
        w = { destroy: () => C.ch.destroy() };
        TM.W.choice(body, { prompt: 'Price just pushed above resistance. Real breakout or fakeout?', options: ['Real breakout — likely to continue', 'Fakeout — likely to fail'], answer: fake ? 1 : 0, explain: fake ? 'Weak volume, a long upper wick and no strong close: classic fakeout. Watch what happened next.' : 'A strong close above the level on a big volume spike: a genuine breakout. Watch what happened next.' }, (r) => {
          if (r.ok && fake) {
            TM.Store.inc('fakeoutsFound');
            TM.Progress.checkAchievements();
          }
          C.ch.setData(TM.Recipes.build(d), { fit: true });
          next();
        });
      }
    };
    const next = () => {
      const b = U.el('<div class="btn-row center"><button class="btn btn-primary">Next chart →</button></div>');
      b.querySelector('button').onclick = round;
      body.appendChild(b);
    };
    round();
    return md;
  }
  TM.drill = drill;

  /* -------- achievements -------- */
  TM.Views.achievements = function (el) {
    const s = S();
    const got = TM.Progress.ACH.filter((a) => s.achievements[a.id]).length;
    const ri = TM.Progress.rankIndex();
    el.innerHTML = `
      <div class="page-head"><div><h2>Achievements & Ranks</h2><p class="muted">${got} of ${TM.Progress.ACH.length} badges unlocked · ${s.xp} XP total</p></div></div>
      <section class="card"><h3>Rank ladder</h3><div class="ladder-r">${TM.Progress.RANKS.map((r, i) => `<div class="rk ${i < ri ? 'past' : i === ri ? 'cur' : ''}"><span class="rk-ic">${r.icon}</span><b>${r.name}</b><span class="small muted">${r.xp.toLocaleString()} XP</span><span class="tiny muted">${r.blurb}</span></div>`).join('')}</div>
      <p class="small muted">XP sources: lessons, quizzes and tests, scenarios, challenges, journal entries, day/swing sessions, and trades graded on <b>process</b> (stop-loss, risk ≤2%, good reward:risk, trading with the trend). Profit alone earns nothing — reckless winners earn no XP, disciplined losers do.</p></section>
      <div class="ach-grid">${TM.Progress.ACH.map((a) => {
        const t = s.achievements[a.id];
        return `<div class="ach ${t ? 'got' : ''}"><span class="ach-ic">${a.icon}</span><b>${a.name}</b><span class="small muted">${a.desc}</span><span class="tiny ${t ? 'up' : 'muted'}">${t ? 'Unlocked ' + U.dateTime(t) : a.xp ? '+' + a.xp + ' XP' : 'Rank badge'}</span></div>`;
      }).join('')}</div>
      <section class="card"><h3>Recent XP</h3>${s.xpLog.length ? `<ul class="xplog">${s.xpLog.slice(0, 20).map((x) => `<li><span class="xp mono">+${x.amount}</span><span>${U.esc(x.reason)}</span><span class="muted tiny">${U.dateTime(x.t)}</span></li>`).join('')}</ul>` : '<p class="muted small">Complete your first lesson to start earning XP.</p>'}</section>`;
  };
})();

(function () {
  'use strict';
  const U = TM.U;
  const S = () => TM.Store.s;
  const N = 10;

  TM.Views.tests = function (el, lvParam) {
    if (lvParam) return run(el, lvParam === 'mix' ? 'mix' : isNaN(+lvParam) ? lvParam : +lvParam);
    const s = S();
    const tp = s.quiz.topics;
    const weak = Object.keys(tp)
      .map((k) => ({ id: k, acc: tp[k].r / Math.max(1, tp[k].r + tp[k].w), n: tp[k].r + tp[k].w }))
      .filter((x) => x.n > 0)
      .sort((a, b) => a.acc - b.acc);
    const answered = s.counters.quizAnswered;
    const acc = answered ? (s.counters.quizCorrect / answered) * 100 : 0;
    el.innerHTML = `
      <div class="page-head"><div><h2>Knowledge Tests</h2><p class="muted">Ten questions per level: multiple choice, chart identification and real trading decisions. Answers are revealed only after you commit. Pass with 70%.</p></div>
      <div class="ring" style="--p:${acc}"><b>${answered ? acc.toFixed(0) + '%' : '—'}</b><small>accuracy</small></div></div>
      <div class="grid g4">${TM.Tests.levels
        .map((L) => {
          const r = s.quiz.levels[L.id];
          const unlocked = TM.Lessons.levelUnlocked(L.id);
          return `<section class="card test-card ${r && r.passed ? 'passed' : ''}"><div class="lv-ic">${L.icon}</div><b>${L.id === 'C' ? 'Crypto' : 'Level ' + L.id}: ${L.name}</b><div class="small muted">${r ? `Best ${r.best}% · ${r.count} attempt${r.count > 1 ? 's' : ''}` : 'Not attempted'}</div>${r && r.passed ? '<span class="pill pill-ok">Passed ✓</span>' : ''}<a class="btn btn-sm ${unlocked ? 'btn-primary' : 'btn-ghost'}" href="${unlocked ? '#test-' + L.id : '#tests'}" ${unlocked ? '' : 'data-locked="1"'}>${unlocked ? (r ? 'Retake' : 'Start test') : '🔒 Locked'}</a></section>`;
        })
        .join('')}</div>
      <div class="grid g2">
        <section class="card"><h3>Knowledge map</h3>${weak.length ? `<ul class="bars">${weak.slice(0, 10).map((w) => { const l = TM.Lessons.byId(w.id); return `<li><span>${l ? l.id.replace('-', '.') + ' ' + U.esc(l.title) : w.id}</span><i class="${w.acc >= 0.7 ? 'ok' : 'bad'}" style="width:${Math.max(4, w.acc * 100)}%"></i><b>${Math.round(w.acc * 100)}%</b>${w.acc < 0.7 && l ? `<a class="link small" href="#lesson-${l.id}">review →</a>` : ''}</li>`; }).join('')}</ul><p class="tiny muted">Sorted weakest first. Red topics are recommended for review.</p>` : '<p class="muted small">Answer quiz questions in lessons and tests to build your knowledge map.</p>'}</section>
        <section class="card"><h3>Mixed review</h3><p class="small">10 questions drawn from <b>your weakest topics</b> across every unlocked level. The fastest way to close knowledge gaps.</p><a class="btn btn-primary" href="#test-mix">Start mixed review</a></section>
      </div>`;
    U.$$('[data-locked]', el).forEach((a) => a.addEventListener('click', (e) => {
      e.preventDefault();
      U.toast('Finish the previous level’s lessons to unlock this test (or enable "Unlock all levels" in Settings).', 'info');
    }));
  };

  function run(el, lv) {
    const s = S();
    let pool;
    let title;
    if (lv === 'mix') {
      const tp = s.quiz.topics;
      const all = TM.Tests.levels.filter((L) => TM.Lessons.levelUnlocked(L.id)).flatMap((L) => TM.Tests.pool(L.id));
      const score = (q) => {
        const t = tp[q.lesson];
        return t ? t.r / Math.max(1, t.r + t.w) : 0.5;
      };
      pool = U.shuffle(all).sort((a, b) => score(a) - score(b)).slice(0, N);
      title = 'Mixed review';
    } else {
      if (!TM.Lessons.levelUnlocked(lv)) {
        location.hash = '#tests';
        return;
      }
      const L = TM.Tests.levels.find((x) => x.id === lv);
      title = `${L.icon} ${lv === 'C' ? 'Crypto' : 'Level ' + lv}: ${L.name}`;
      const p = TM.Tests.pool(lv);
      const charts = U.shuffle(p.filter((q) => q.chart));
      const plain = U.shuffle(p.filter((q) => !q.chart));
      pool = U.shuffle(charts.slice(0, 3).concat(plain).slice(0, N));
    }
    let i = 0,
      right = 0,
      chart = null;
    const missed = [];
    el.innerHTML = `<div class="lesson-top"><a class="btn btn-ghost btn-sm" href="#tests">← Tests</a><div class="lt-t"><div class="eyebrow">Knowledge test</div><h2>${title}</h2></div></div><div class="qbar"><i></i></div><div class="card test-body"></div>`;
    const body = el.querySelector('.test-body');
    const bar = el.querySelector('.qbar i');
    const one = () => {
      if (chart) chart.destroy();
      chart = null;
      const q = pool[i];
      bar.style.width = (i / pool.length) * 100 + '%';
      body.innerHTML = `<div class="muted small">Question ${i + 1} of ${pool.length}${q.chart ? ' · chart identification' : ''}</div>`;
      if (q.chart) {
        const box = U.el('<div></div>');
        body.appendChild(box);
        chart = TM.W.chartIn(box, Object.assign({ height: 260 }, q.chart)).ch;
      }
      const order = U.shuffle(q.o.map((t, k) => ({ t, k })));
      const sel = U.el('<div></div>');
      body.appendChild(sel);
      // commit-then-reveal: choose, then press "Check answer"
      sel.innerHTML = `<p class="w-prompt">${q.q}</p><div class="opts">${order.map((o, k) => `<button class="opt" data-k="${k}"><span class="opt-k">${'ABCD'[k]}</span><span>${o.t}</span></button>`).join('')}</div><div class="btn-row"><button class="btn btn-primary" id="t-check" disabled>Check answer</button></div><div class="w-fb"></div>`;
      let pick = null;
      U.on(sel, 'click', '.opt', (e, b) => {
        if (sel.dataset.locked) return;
        U.$$('.opt', sel).forEach((x) => x.classList.toggle('sel', x === b));
        pick = +b.dataset.k;
        sel.querySelector('#t-check').disabled = false;
      });
      sel.querySelector('#t-check').onclick = () => {
        if (pick == null || sel.dataset.locked) return;
        sel.dataset.locked = '1';
        const ansK = order.findIndex((o) => o.k === q.a);
        const ok = pick === ansK;
        U.$$('.opt', sel).forEach((x, k) => {
          x.disabled = true;
          if (k === ansK) x.classList.add('right');
          if (k === pick && !ok) x.classList.add('wrong');
        });
        if (ok) right++;
        else missed.push(q);
        TM.recordAnswer(q.lesson, ok);
        const l = TM.Lessons.byId(q.lesson);
        const fbx = sel.querySelector('.w-fb');
        fbx.className = 'w-fb show ' + (ok ? 'fb-ok' : 'fb-bad');
        fbx.innerHTML = (ok ? '✓ Correct. ' : '✕ Incorrect. ') + q.e + (!ok && l ? ` <a class="link" href="#lesson-${l.id}">Review lesson ${l.id.replace('-', '.')}</a>` : '');
        U.sound(ok ? 'click' : 'error');
        const btn = sel.querySelector('#t-check');
        btn.textContent = i < pool.length - 1 ? 'Next question →' : 'See results';
        btn.onclick = () => {
          i++;
          if (i < pool.length) one();
          else finish();
        };
      };
    };
    const finish = () => {
      if (chart) chart.destroy();
      chart = null;
      bar.style.width = '100%';
      const pct = Math.round((right / pool.length) * 100);
      const passed = pct >= 70;
      let xp = 0;
      if (lv !== 'mix') {
        const prev = s.quiz.levels[lv];
        const firstPass = passed && !(prev && prev.passed);
        s.quiz.levels[lv] = { best: Math.max(prev ? prev.best : 0, pct), last: pct, count: (prev ? prev.count : 0) + 1, passed: passed || !!(prev && prev.passed) };
        if (firstPass) xp += 150;
        if (pct === 100 && !(prev && prev.best === 100)) {
          xp += 50;
          s.counters.perfectTests++;
        }
      } else xp = right * 3;
      TM.Store.save();
      if (xp) TM.Progress.addXP(xp, lv === 'mix' ? 'Mixed review' : `Test passed: ${pct}%`);
      TM.Progress.checkAchievements();
      const recs = {};
      missed.forEach((q) => q.lesson && (recs[q.lesson] = (recs[q.lesson] || 0) + 1));
      body.innerHTML = `<div class="ls-done"><div class="ls-done-ic">${passed ? '🏆' : '📚'}</div><h3>${pct}% — ${passed ? 'Passed!' : 'Not yet'}</h3><p class="muted">${right} of ${pool.length} correct. ${passed ? 'Great work. Knowledge without discipline is useless, so go and apply it in the simulators.' : 'You need 70% to pass. Review the recommended lessons and try again.'}</p>
        ${Object.keys(recs).length ? `<h4>Recommended review</h4><div class="btn-row center">${Object.keys(recs).map((id) => { const l = TM.Lessons.byId(id); return l ? `<a class="chip" href="#lesson-${id}">📘 ${id.replace('-', '.')} ${U.esc(l.title)} · missed ${recs[id]}</a>` : ''; }).join('')}</div>` : ''}
        <div class="btn-row center"><a class="btn btn-ghost" href="#tests">All tests</a><button class="btn btn-primary" id="t-retry">Retake</button></div></div>`;
      body.querySelector('#t-retry').onclick = () => TM.route();
    };
    one();
    return { destroy: () => chart && chart.destroy() };
  }
})();

  /* ---------------- global market loop ---------------- */
  let lastSample = 0;
  function processMain() {
    const acct = S().account;
    if (!acct.positions.length && !acct.orders.length) return;
    const eq = TM.mainEquity();
    TM.Live.ASSETS.forEach((d) => {
      const p = TM.Live.price(d.sym);
      const bar = { h: p, l: p, c: p, o: p };
      if (acct.orders.some((o) => o.sym === d.sym)) {
        const filled = TM.Trading.fillOrders(acct, d.sym, bar, (o) => ({
          sym: o.sym,
          side: o.side,
          qty: o.qty,
          entry: o.limit,
          stop: o.stop,
          target: o.target,
          lev: o.lev,
          mode: o.mode,
          feeRate: o.feeRate,
          equity: eq,
          ctx: TM.Market.context(TM.Live.series(o.sym, '1m')),
          t: TM.Live.simT,
        }));
        filled.forEach((p2) => {
          U.toast(`Limit order filled: ${p2.side.toUpperCase()} ${U.num(p2.qty, p2.qty % 1 ? 4 : 0)} ${p2.sym} @ ${U.price(p2.entry)}`, 'good');
          U.sound('fill');
        });
      }
      if (acct.positions.some((x) => x.sym === d.sym)) {
        const closed = TM.Trading.process(acct, d.sym, bar, { t: TM.Live.simT });
        closed.forEach((t) => TM.Progress.afterTrade(t, { silent: true }));
      }
    });
  }
  function fundingCheck(prevT) {
    const now = TM.Live.simT;
    if (Math.floor(prevT / 28800) === Math.floor(now / 28800)) return;
    const acct = S().account;
    let total = 0;
    acct.positions
      .filter((p) => p.mode === 'crypto' && p.lev > 1)
      .forEach((p) => {
        const rate = TM.Live.funding(p.sym);
        const fee = p.qty * TM.Live.price(p.sym) * rate * (p.side === 'long' ? 1 : -1);
        p.funding = (p.funding || 0) + fee;
        total += fee;
      });
    if (total) U.toast(`Funding settled on leveraged crypto: <b class="${U.cls(-total)}">${U.smoney(-total)}</b>`, total > 0 ? 'bad' : 'good');
  }
  function stormCheck() {
    const m = S().market;
    if (!m.storm) return;
    if (S().account.positions.some((p) => p.mode === 'crypto' && p.lev > 1)) m.storm.engaged = true;
    if (m.ticks >= m.storm.end) {
      TM.Live.storm(false);
      const survived = m.storm.engaged && S().counters.liquidations === m.storm.liq;
      if (survived) {
        TM.Store.inc('stormsSurvived');
        U.toast('🌪️ The volatility storm is over — you survived <b>without liquidation</b>!', 'good', { ms: 6000 });
        TM.Coach.say('Storm survived. Notice how lower leverage and real stops kept you alive while price whipped around.');
      } else if (!m.storm.engaged) U.toast('🌪️ The storm has passed. Trade with leverage during a storm to complete the Crypto Survivor challenge.', 'info', { ms: 6000 });
      else U.toast('🌪️ The storm has passed. You were liquidated during it — lower your leverage next time.', 'bad', { ms: 6000 });
      m.storm = null;
      TM.Progress.checkAchievements();
      TM.Store.save();
      TM.bus.emit('storm');
    }
  }
  function loop() {
    const sp = S().settings.speed;
    if (sp > 0 && TM.Live.ready) {
      for (let k = 0; k < sp; k++) {
        const prevT = TM.Live.simT;
        TM.Live.tick();
        processMain();
        fundingCheck(prevT);
        stormCheck();
      }
      TM.bus.emit('tick');
    }
    const now = Date.now();
    if (now - lastSample > 2000) {
      lastSample = now;
      TM.Trading.sampleEquity(S().account, TM.mainEquity());
      TM.Live.remember();
      updateTop();
      TM.Store.save();
    }
  }

    const st = TM.Trading.stats(s.trades);
    const eq = TM.mainEquity();
    const done = TM.Lessons.list.filter((l) => s.lessons[l.id] && s.lessons[l.id].done).length;
    const rec = TM.Coach.recommend();
    const tile = (n) => `<a class="tile" href="#${n.id}"><span class="tile-ic">${n.icon}</span><b>${n.label}</b><span class="muted small">${
      {
        academy: `${done}/${TM.Lessons.list.length} lessons complete`,
        practice: 'Paper trade 6 simulated stocks',
        day: 'Live trading-day session, 9:30 → 16:00',
        swing: '8-week campaign with gaps & earnings',
        crypto: '24/7 market, leverage & funding',
        scenarios: `${Object.keys(s.scenarios).length}/${TM.Scenarios.list.length} realistic scenarios done`,
        portfolio: `${st.n} trades · ${st.winRate.toFixed(0)}% win rate`,
        challenges: `${Object.keys(s.challenges).length}/${TM.Progress.CH.length} challenges completed`,
        achievements: `${Object.keys(s.achievements).length}/${TM.Progress.ACH.length} badges unlocked`,
        journal: `${Object.keys(s.journal).length} entries`,
        tests: `${Object.values(s.quiz.levels).filter((x) => x.passed).length}/${TM.Tests.levels.length} tests passed`,
      }[n.id] || ''
    }</span></a>`;
    el.innerHTML = `
      <section class="hero card">
        <div class="hero-l">
          <div class="eyebrow">${s.name ? 'Welcome back, ' + U.esc(s.name) : 'Your trading academy'}</div>
          <h2>${next ? 'Continue: <span>' + U.esc(next.title) + '</span>' : 'Curriculum complete. Keep sharpening.'}</h2>
          <p class="muted">${next ? `Level ${next.level === 'C' ? 'Crypto' : next.level} · Lesson ${next.id.replace('-', '.')} · ${next.topics.join(' · ')}` : 'Revisit tests, run scenarios and keep journaling your simulated trades.'}</p>
          <div class="btn-row">${next ? `<a class="btn btn-primary btn-lg" href="#lesson-${next.id}">▶ Continue learning</a>` : ''}<a class="btn btn-ghost" href="#practice">Open the trading terminal</a></div>
        </div>
        <div class="hero-r">
          <div class="rank-big"><span class="rb-ic">${r.icon}</span><div><div class="muted small">Current rank</div><b>${r.name}</b><div class="xpbar xpbar-lg"><i style="width:${lp.pct.toFixed(1)}%"></i></div><div class="small muted">${s.xp} XP${nr ? ` · ${nr.xp - s.xp} XP to <b>${nr.name}</b>` : ' · Top rank'}</div></div></div>
          <div class="ranks-mini">${TM.Progress.RANKS.map((k, i) => `<span class="${i <= TM.Progress.rankIndex() ? 'on' : ''}" title="${k.name} (${k.xp} XP)">${k.icon}</span>`).join('')}</div>
        </div>
      </section>
      <div class="grid g3">
        <section class="card">
          <h3>Today’s goals <span class="pill">🔥 ${d.streak || 0}-day streak</span></h3>
          <ul class="goals">${d.goals
            .map((g) => {
              const G = TM.Progress.GOALS[g];
              const cnt = (d.count && d.count[g]) || 0;
              return `<li class="${d.done[g] ? 'done' : ''}"><span class="gchk">${d.done[g] ? '✓' : ''}</span><span>${G.text}${G.need ? ` <span class="muted">(${Math.min(cnt, G.need)}/${G.need})</span>` : ''}</span>${G.href ? `<a class="btn btn-sm btn-ghost" href="${G.href}">Go</a>` : '<button class="btn btn-sm btn-ghost" data-coach>Ask</button>'}</li>`;
            })
            .join('')}</ul>
          <p class="tiny muted">+40 XP each, +60 bonus for all three. Goals reward learning and discipline, not trading volume.</p>
        </section>
        <section class="card">
          <h3>Simulated account</h3>
          <div class="kv"><span>Equity</span><b class="mono">${U.money(eq)}</b></div>
          <div class="kv"><span>Total P&L</span><b class="mono ${U.cls(eq - s.account.start)}">${U.smoney(eq - s.account.start)}</b></div>
          <div class="kv"><span>Today</span><b class="mono ${U.cls(eq - s.account.daily.start)}">${U.smoney(eq - s.account.daily.start)}</b></div>
          <div class="kv"><span>Open positions</span><b class="mono">${s.account.positions.length}</b></div>
          <div class="kv"><span>Closed trades (all modes)</span><b class="mono">${st.n}</b></div>
          <canvas class="spark" id="home-eq"></canvas>
        </section>
        <section class="card">
          <h3>Coach Nova recommends</h3>
          ${rec.length ? `<ul class="recs">${rec.map((x) => `<li><a href="#lesson-${x.l.id}"><b>${x.l.id.replace('-', '.')} ${U.esc(x.l.title)}</b><span class="muted small">Because ${x.why}.</span></a></li>`).join('')}</ul>` : '<p class="muted">You are all caught up!</p>'}
          <button class="btn btn-ghost btn-sm" data-coach>Ask the coach</button>
        </section>
      </div>
      <h3 class="sec-h">Main menu</h3>
      <div class="tiles">${NAV.filter((n) => n.id !== 'home').map(tile).join('')}</div>`;
    U.lineChart(el.querySelector('#home-eq'), s.account.equityCurve.map((p) => p.v), { baseline: s.account.start, empty: 'Your equity curve appears after you trade' });
    U.$$('[data-coach]', el).forEach((b) => (b.onclick = () => TM.Coach.toggle(true)));
    const off = TM.bus.on('progress', () => {});
    return { destroy: off };
  };

  /* ---------------- boot ---------------- */
  function boot() {
    TM.Store.init();
    document.body.classList.toggle('reduce-motion', !!S().settings.reduceMotion || window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    buildShell();
    TM.Coach.init();
    TM.Live.init();
    TM.Progress.daily();
    window.addEventListener('hashchange', route);
    route();
    setInterval(loop, 400);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') U.closeTopModal();
    });
    TM.bus.on('trade:recorded', updateTop);
    TM.bus.on('xp', updateTop);
    if (!S().onboarded) setTimeout(onboarding, 250);
    TM.Progress.checkAchievements();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
